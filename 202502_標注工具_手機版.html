您好！我是藥學系的學生∼我在今年1/24有接受近視雷射手術，術式是SFAIRTransPRK，目前右眼非常清晰，但是左眼還是有散光+模糊的情況，連使用手機和電腦都有點吃力，沒有像之前戴眼鏡般清晰，已詢問替我手術的診所，診所回覆：「目前還是修護的初期所以是正常現象，因為才過一個月而已，角膜完全長好需要一些時間，過程中因為表皮生長位置關係偶有模糊現象是正常的隨著表皮逐漸恢復就會跟著進步，角膜生長到最佳是6個月後，右眼恢復迅速，左眼要繼續好好照顧，眼藥水多點，最重要好好休息不要太累，給它時間恢復。」但是我的左眼是持續的散光+模糊，並非「偶有模糊」，我很擔心是不是雷射失敗導致的，會不會之後左眼無法跟右眼一樣清楚...想請教其他專業的眼科醫生建議∼非常謝謝您的閱讀！", "large": [], "small": [], "tier3": []}, {"no": "a0d15ada", "user": "小星", "q": "何醫生您好如題睡覺時.手機設鬧鐘没關機放枕頭旁很近會有手機光，雖然閉眼睛……如果這樣手機放旁長期照射會不會影響眼睛呢？我曾因視網膜過薄雷射過3次謝謝", "large": [], "small": [], "tier3": []}, {"no": "fbf53bf8", "user": "林", "q": "敬愛的醫師您好，我近視600度，雙眼有飛蚊症。去年11月中時左眼看到環形、霧、小黑點，醫生說：玻璃體退化、視網膜沒問題。隔年1月又追蹤了一次，視網膜沒問題。2月中開始，在日光燈環境下，每天都會看到大概0.1秒類似日光燈管閃爍暗一下，整天大概發生1至3次，好像低頭的時候比較會發生。請教醫師：1、該怎麼避免閃爍發生？2、我該儘速回診嗎？日光燈感閃爍次數增多再回診？還是視野缺損、模糊、閃光時回診？3、請問俯臥或低頭會讓視網膜和玻璃體的拉扯力量變大嗎？萬分感謝醫師幫忙解惑，平安∼❤️", "large": [], "small": [], "tier3": []}, {"no": "6bc8e3e7", "user": "張國泰", "q": "1眼睛有看的很遠的能力是可以的嗎？2眼睛有看很遠的能力是可以的嗎？", "large": [], "small": [], "tier3": []}, {"no": "8c29461d", "user": "宏", "q": "醫師您好，我最近因工作和家庭原因壓力大，焦慮，心情會煩躁低落，擔憂，這兩個星期頭頭會突然暈眩會轉的那種但眼前沒有天璇地轉，我在擔憂或煩腦時頭都會感覺沉暈一下的感覺，這跟心情有關嗎？是不是自律神經失調？晚上也都會半夜自己醒來要過一段時間才有辦法入睡，最近家人有分我焦慮藥牟靜,請問是否有效，上午如果心情差時牟靜是否可以早上吃。", "large": [], "small": [], "tier3": []}, {"no": "3721f5e8", "user": "白羅曼鵝", "q": "梁醫師您好,我有些事情想要問你,我的重大傷病卡病名上面寫源自兒童期之精神病,是甚麼樣子的症狀,機車駕照體檢,會不會,受影響", "large": [], "small": [], "tier3": []}, {"no": "78beb733", "user": "智留", "q": "以前有一位醫師好像不喜歡開安眠藥，我服用estazolam2mg幫助睡眠的時候甚至只服用lorazepam0.5mg幫助睡眠，他都想換成戀多眠，藥理學上是否戀多眠是鎮靜安眠藥中最作用最輕微的藥物？或者對睡眠結構影響還是副作用最少的藥物？", "large": [], "small": [], "tier3": []}, {"no": "e542edb3", "user": "Lowras", "q": "醫師你好每次過年過節回家聚餐就覺得很痛苦還要被強迫跟原本就很不熟的親戚吃飯感覺大家就是互相比較誰的小孩成績好、誰的學歷高、工作薪水誰比較多、或是炫耀去哪 堨X國旅遊⋯或是討論某某親戚的八卦⋯常常一坐下就覺得渾身僵硬不自在、面對一堆問題又不得不回應⋯⋯還要假裝很認真在聽長輩的建言⋯又不敢提早離開因為怕被覺得不禮貌⋯每次聚餐聚會結束就覺得心情很差腦中一直都是家人親戚講話的內容覺得家人一直拿我跟別人比較、覺得自己薪水、學歷都比不上哥哥或其他表兄弟又想起從小父母就比較疼哥哥、常在我面前稱讚哥哥⋯在家人中總是有格格不入的感覺一想起他們講的話就有想哭的感覺覺得自己什麼都做不好⋯什麼都比不上別人⋯現在心情真的很差反正怎麼努力也沒用乾脆去死一死⋯請問這樣是正常的嗎？", "large": [], "small": [], "tier3": []}, {"no": "00ffe829", "user": "R先生", "q": "醫生你好我最近在等待入職比較焦慮，焦慮跟不安的感覺一下子好一下子又出現，有時就很心慌，整天都有點焦慮擔心，坐立不安的感覺，擔心自己會發瘋，晚上睡意來時準備入睡身體卻一直小抖一下驚醒，整晚都反覆這樣，身體睡到流汗，心跳有變快，肌肉也會抽動，整個人變得沒甚麼食慾，也感覺記憶力比較不好，因為自己平常就比較容易焦慮緊張，這些症狀產生後讓我更擔心我自己，也害怕越想就越更擔心焦慮，請問我這樣到底是怎麼了..", "large": [], "small": [], "tier3": []}, {"no": "9bbf0093", "user": "林", "q": "您好，我阿嬤突然出現滿嚴重的幻聽問題，已經持續一段時間，會一直一直聽到隔壁鄰居在哭喪，中午晚上凌晨都會有，是提到比較以前的喪禮會用到的禮儀，症狀初期她到處問很多人，但當然沒有人聽到，她本身也有重聽問題，也有帶到那戶人家確認沒有，她當下會說沒有，可是過一陣子又會開始說哭喪的狀況，常常覺得沒睡好，在精神狀況不好的時候，說話常常反反覆覆。之前家人以為是阿茲海默症的前兆有帶去看過醫生，檢查後並沒有發現問題，最後有開精神穩定與安眠的藥物，但也沒有什麼效果。在這之後她就比較沒有問我們有沒有聽到，但是可能是有不信任感，因為她喝酒之後偶爾會大罵隔壁鄰居，而且可能因為這樣所以目前跟家人相處不太好，擔心可能會有不願意就醫的問題，想請問醫生這樣的症狀是妄想症嗎，以及該怎麼處理比較好。", "large": [], "small": [], "tier3": []}, {"no": "e7b59358", "user": "ALEX", "q": "醫生您好,家父年近60幾歲長期凌晨2點睡覺、會打呼、下午常常沒精神睡3~4個小時，而且還經常有胃痛症狀近幾個月常常發生一些奇怪的行為1.有一次早上談話中聊到不久前約定的事情結果完全沒印象。2.凌晨4點常常起來上廁所，上廁所常常跌倒。3.有數次跑到我的房間撞到桌子後跑出去，有兩次甚至跑到我的房間直接就地小便，早上醒來沒印象。除了以上怪異行為，早上談話其實都蠻正常的有上網大概查了一下，有懷疑是否為睡眠呼吸中止造成的睡眠障礙，但睡眠呼吸中止真的有這麼嚴重嗎?因為從我懂事以來家父睡覺就會打呼，有可能近幾個月才開始因為睡眠呼吸中止造成以上現象嗎?另一方面也擔心是否為失智症前兆有準備先以改善睡眠的理由帶他去醫院諮詢請問有哪些問題是我可以先行準備諮詢醫生的呢?", "large": [], "small": [], "tier3": []}, {"no": "52ddd742", "user": "大學生", "q": "我因為熬夜到3點玩遊戲出現無法思考，看字會極度不舒服的症狀，最初我以為我要猝死了，恐慌發作，有死亡焦慮，半夜時不時就有這種感覺。後來去看了家醫和身心科，身心科開給我離憂膜衣錠，我吃了一顆後來聽阿姨的建議隔天就沒吃，結果晚上突然有很憂鬱想死的感覺，我靠睡覺不去想這件事，就這樣自行斷離憂膜衣錠一個月，現在症狀惡化，對聲音和光線很敏感，無法閱讀無法思考，記憶力也下降，那些各種刺激會有腦袋受不了的感覺，只要晚上就會出現症狀，偶爾白天也會，一整天接近無法活動，複診也忘記告知戒斷藥物的事，現在他開給我新的樂復得藥物。我想問：我症狀惡化主要是因為吃了一顆離憂膜衣錠而自行戒掉導致的嗎？我沒有定時吃藥的習慣，很怕長期用藥物副作用會影響到自己，戒不掉藥物，現在醫生又新開了藥給我，我怕吃了藥以後我的症狀會更嚴重，我認為我沒有憂鬱吃了藥會變憂鬱，我該怎麼辦？現在只要活動就會極度疲憊，醫生說是自律神經的問題，但我很怕受不了刺激會對腦有永久性的影響，晚上難以進行活動，這些刺激致命嗎？要開學了要如何改變這樣的自己？", "large": [], "small": [], "tier3": []}, {"no": "67189791", "user": "陳小姐", "q": "以下為簡單敘述媽媽長期有被害妄想症的症狀，包含懷疑家裡有人裝監控在偷拍他、覺得別人要害他等症狀，但他本人無病識感，認為自己沒有病。最近因為一些事情我們有讓其他親戚得知媽媽目前的精神狀況，有親戚已勸說媽媽就診，但不是以被害妄想症的理由，而是跟媽媽說他可以去做做看諮商，但我們很清楚媽媽不會提及上述的症狀，媽媽可能只會告知醫生他會失眠、頭痛等症狀，陪他就診時，我們該怎麼讓醫生得知媽媽詳細的精神狀況？可以偷偷將症狀寫成紙條塞給醫生嗎？還是有其他辦法？", "large": [], "small": [], "tier3": []}, {"no": "5588e29d", "user": "水豚", "q": "夢到自己自殺，很快樂，好像還得了憂鬱症，但也不確定是不是，整個人完全開心不起來，感覺整個人拖著一塊大石頭，行為舉止被媽媽說很怪，然後就醒了，開始哭，覺得還沒醒過來，不感覺到自己在真實世界，日常對事物較不敏感，可能因為學習關係，覺得自己抗壓力挺高的，但是好像有點高到不太正常，但也覺得很正常，不太想知道別人的事，覺得不怎麼重要，每次難過時都告訴自己沒事，到底在哭什麼，但也不知道為什麼自己要這樣想，反覆糾纏，還有好多感受不知道如何表達，已經持續六年，有想過跟家人說想去諮詢，但又覺得自己沒事為什麼要，同時又覺得自己真的哪 堨X了問題，但又是個正常人，自殘過幾次，但覺得沒怎樣反而覺得噁心，知道這樣做沒意義，但好像是想讓自己冷靜，不知道自己想不想死，但感覺家人會很難過，但如果家人都不在了，我會去自殺，活著也沒有意義，也不知道所謂的朋友會不會因為我的死亡而難過，感覺是不會，因為我自己可能也不會，請諒解我的不善言辭，想到什麼就打什麼，大概小三就會思考到底為什麼要活著，處於高處時也想過一躍而之，幾乎每天都在腦海自問自答，為什麼人是人這類的問題，知道不只自己會這樣，但始終得不出答案，這次發現這個網站想來解答自己的問題。", "large": [], "small": [], "tier3": []}, {"no": "1a18d2a6", "user": "角落的草", "q": "醫師好我本身是一個非常容易緊張，也蠻容易受到驚嚇的人。最近離家到外縣市開始新工作，工作環境全部都是陌生的人。我只要一面對新的人，我打交道就會很緊張，有時候可能社交上做的不好(自己覺得)，我就會無法控制的反覆回想社交挫敗的記憶。只要我不能確定對方會有什麼反應，我很難跟人搭話，甚至有時候對方沒有給出太熱情的反應，我第一想法就是會不會被討厭了，然後就會開始對跟他搭話有障礙，並迴避需要主動跟對方搭話的情況。平常會小心不跟他人對到眼神，怕對到了然後打招呼對方沒反應，乾脆假裝沒看到，避免發生社交挫敗上台報告或發言前，即使有準備還是緊張得發熱發抖，上台後台下的人視線集中在自己身上真的超不舒服......社交很挫敗、必須面臨無法迴避的社交情境時，會覺得心情低落、胸口很悶很緊目前自己住宿舍，這兩週常覺得胸口很悶超級憂鬱的......由於新的工作需要跟長官報告、跟其他部門合作需要洽談、購買東西必須跟廠商電話聯繫，或者辦活動需要在非常多人面前講課等等。這個情況開始影響我的工作表現，最近變得越來越嚴重，甚至我下意識為了逃避社交，變成去優先解決不需要社交的業務、不敢提出一定得問的問題等等。但我在網路上、對客人都沒有這種問題，我是可以跟人正常交流的(至少表面上如此)。只是心裡不斷內耗，擔心根本是大驚小怪，去看醫生反而浪費資源，所以才找到這裡，想問看看我的情況是屬於需要就醫狀況嗎？還是只要自我調適就可以？謝謝醫師的回答", "large": [], "small": [], "tier3": []}, {"no": "470597e2", "user": "w", "q": "醫生你好因為前陣子比較焦慮有到身心科去就診服用了一個多禮拜的藥物後已經有覺得沒有那麼焦躁不安了因為吃藥多少都有些副作用請問是否可以開始慢慢停藥?主要吃的是憂必舒跟一顆鎮靜劑，最近發現晚上睡覺時都會流汗自從吃藥後性慾也完全歸零請問這些是吃抗憂鬱藥物造成的嗎", "large": [], "small": [], "tier3": []}, {"no": "8dadf50d", "user": "w", "q": "醫師你好最近總是會覺得整個人晃晃的，手腳不太俐落的感覺。有去診所，醫師的判斷可能是姿勢性頭暈，因為我只有站著的時候感覺比較強烈。那之所以會覺得是焦慮造成的原因是，我在一個月前因為胸痛掛了急診，急診的結果都沒有問題，但我還是會痛就又掛了一個心臟科，結果醫師看了我的狀況只有說：你的血壓有點高喔。我指了我的胸說：還有我這裡會痛。醫師只說了：你會痛那就表示不是心臟問題。然後我就在診間外面了。後面反反覆覆因為擔心掛了34次急診都說只是神經痛之類的問題。這件事讓我有點不敢看醫生，因為不知道要到什麼程度醫生才會願意幫你看。而且我也因為小症狀一直去醫院很不好意思。最後是跑到一個心臟科醫師開的診所和他好好的聊，我才終於不那麼擔心。但是我最近的頭暈又讓我很困擾。我如果直接跑去找醫生，醫生會不會因為我的症狀不夠而又不了了之呢？我之前的胸痛和神經痛會不會其實也只是焦慮在作祟呢？去看心臟科的那一次下定決心開始減肥了（本人破百還在努力中血壓很高真的嚇到我）有看到說減肥其實是一種無形的壓力，如果真是這樣，焦慮該怎麼緩解呢？先謝謝醫生了", "large": [], "small": [], "tier3": []}, {"no": "52c29f64", "user": "阿越", "q": "醫生您好：我是一個罹患強迫症十年的患者也吃了百憂解超過十年了，每天服用的是最高劑量的百憂解（80mg)以及低劑量的安立復（2mg)我知道安立復有可能使患者體重增加，但我現在有個疑問就是，長期服用這麼高劑量的百憂解是否也會變胖，雖然蠻多醫生跟我說百憂解不會增加體重，但我印象我有在文獻中看到初期使用百憂解體重會減輕，但長期的話體重反而會增加，想知道這個論述是否正確？醫師，想請問在您的個案中是否有像我一樣服用高劑量百憂解超過五年甚至十年的患者，他們的體重是否有增加，比例高嗎？想知道長期服用最大劑量的百憂解是否真的會造成變胖的問題？因為我真的在這十年中胖了不少..想了解會不會除了安立復其實百憂解也會令我增加體重..在勞煩醫師為我解答，感恩！", "large": [], "small": [], "tier3": []}, {"no": "a35835e3", "user": "alowei", "q": "2/2晚上突然覺得心跳加速一直很焦慮的感覺，當晚我有戴applewatch睡覺，早上起床看手機心律紀錄是在正常範圍，大約落在50-70之間，但是吃完早餐後我的心跳又開始變快，於是到附近診所看診，醫生有幫我照過X光和10秒心電圖，看報告的時候醫生說我的X光沒有問題，心臟也沒有肥大的現象，只說了心跳有點快而且沒有心房顫動。隔天，我去看中醫的時候也有和醫生提起我容易緊張的事，後來的幾天那些焦慮或是心悸的症狀就神奇的消失了，但是直到2/13號晚上我又開始出現心跳快、一直很焦慮的情況。想請問醫生我該先去諮商釐清原因，還是直接到身心科就診?", "large": [], "small": [], "tier3": []}, {"no": "61f844ca", "user": "困擾的人", "q": "這個問題已經困擾我十幾年了從我小時候開始我就有脂漏性皮膚炎體質,頭皮經常很癢,我就會下意識地去抓頭皮,到後來就逐漸演變成焦慮時就手經常頭上剝一片頭皮屑下來,雖然有在看皮膚科拿藥,但因為這個強迫症的關頭上還是經常掉屑屑屑,我擔心這樣像去會影響到求職或是頭皮健康,請問要怎麼改善呢謝謝一", "large": [], "small": [], "tier3": []}, {"no": "24e270e8", "user": "林先生", "q": "醫師您好，我今年20歲，男性，目前有一個女友我們很深愛彼此，從第一次對人有心動的感覺到現在喜歡的對象和交往的對象都是異性，也認為自己是異性戀，但大概在兩週前因為看到了恐同就是同性戀的相關文章，因為本身就不太喜歡同志或雙性戀，搞的我自己很焦慮，開始會反覆測試自己是不是其實雙性戀或同志，例如在路上看到男性會測試自己會不會想跟他發生性關係或是否有心動的感覺、在網路上看到帥哥是否會有心動的感覺或看同志性愛片測試自己是否有生理反應（只看了一次，感到特別不適），但每次測試完都是沒反應，也搞得自己很想吐很不舒服甚至更焦慮，但我也沒辦法停止該行為，腦中會一直反覆的想，沒辦法控制，一直擔心自己未來會不會喜歡同性別的人，儘管感覺很不合理，但還是會一直想，搞的自己很累胸口很悶。在國中二年級的時候也有發生過同樣的事件那時候是被同性婚姻合法化震撼到，我有去看醫生和吃藥，國三後就突然的不會想這類問題了，經過了五年就算看到類似文章也都沒讓我感到焦慮也不會多想，我不能理解為何這陣子又復發，請問我該怎麼不去一直想這個問題，讓自己不焦慮，讓我的生活回歸正常，能夠更享受當下？", "large": [], "small": [], "tier3": []}, {"no": "08df48e9", "user": "箱箱", "q": "目前服用晚上2顆離憂早晚各一百事隆但做惡夢增加很多有方法能降低噩夢嗎", "large": [], "small": [], "tier3": []}, {"no": "266ae541", "user": "mei", "q": "無法忍受樓上鄰居家的噪音，家人認為須尊重鄰居的自然家居聲音，但我會情緒暴怒想制止及反擊，因害怕突如其來的腳步聲、拖椅聲...我用全開重音音樂24小時來預防，用敲牆來告知樓上有噪聲，故常搞到派出所通知，鄰居嫌我吵!怨惡衛生局和社會局要我精神檢查。請協助我，謝謝!", "large": [], "small": [], "tier3": []}, {"no": "b0516558", "user": "R", "q": "醫生你好我因為焦慮身心科醫生開給我一顆憂必晴每天晚上吃一顆安平靜一次0.5顆有焦慮的時候再吃服藥後2週今天突然出現幾次天旋地轉的感覺時間長達幾十分鐘到一個小時第一週的時候沒出現這種症狀那種感覺就像人原地轉圈完後看東西都在轉然後有一點點想吐因為原本沒有這種症狀突然出現讓我很害怕自己是不是得了甚麼嚴重的病想問這是藥物的副作用?還是需要再到醫院檢查如果就醫的話建議掛什麼科?", "large": [], "small": [], "tier3": []}, {"no": "c114d988", "user": "斐文", "q": "就是從小到大我一直有咬指甲和用手指捲頭髮的行為，但我不知道原因，上網查網路上說那是種焦慮的行為，也有提供一些改善的方法但都沒有效，最近似乎症狀加重，如果被迫停止這類行為，會感到很煩躁，我想請問這是一種病，需要治療嗎？要怎麼治療", "large": [], "small": [], "tier3": []}, {"no": "2edcd10e", "user": "123", "q": "醫生你好我從小就跟有思覺失調的家人生活在一起，承受著巨大的心理壓力，最近因為焦慮到身心診所就醫，焦慮的狀況都會反反覆覆，服藥後產生的副作用，讓我常常胡思亂想，擔心自己自否也會像家人一樣得到精神病，很擔心自己也會幻聽，我日常生活是沒有這個症狀，而且只要聽到有一些聲音就會很敏感，一定要找到聲音的來源，確定自己不是幻聽，比較讓我擔心的是在我睡覺的時候，已經快入睡時常常都會因為腦袋裡想起某人跟我說過的某句話而驚醒，就在想自己為什麼腦袋會冒出這句話，而擔心自己是不是會發瘋，以前睡覺其實也會想起某人跟我說過的某句話或者是某首歌詞或電視廣告詞，但都不會驚醒，自從我開始注意到我快入睡時會想起這種聲音，我就很擔心害怕，快入睡時想到就會馬上嚇一跳身體小抖驚醒然後很焦慮，身上的肌肉也會跳動，想問快入睡時會想起某人跟我說過的某句話是進入睡眠前會產生的正常狀況嗎，我會驚醒害怕是因為太緊繃焦慮而造成的嗎，我有可能會發瘋嗎，我已經20幾歲了，過去生活也都很正常，只是因為從小家庭環境讓我個性容易焦慮擔心", "large": [], "small": [], "tier3": []}, {"no": "70e9e3bb", "user": "yao", "q": "醫師您好，我在2024年7月的時候，在朋友的慫恿下注射了一次安非他命，當下沒有什麼不舒服的症狀，但是到了隔天早上開始出現呼吸急促、胸悶、想吐，有去掛急診，抽血、心電圖都沒有異常，然後在急診待了3、4個小時狀況好轉之後就返家休息，但是之後的身體還是會胸悶、想吐、頭暈、感覺呼吸沈沈的（狀況會持續一整天），有去看過心臟科、腸胃科、胸腔科、腦神經科，都說沒有問題，原本12月有好轉沒再出現上敘問題，但是在今年2月這幾天開始又出現這些狀況，我想請問這是什麼原因呢？是否患上焦慮症呢？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "76bd0673", "user": "橘子", "q": "醫師您好：我從2023/6月開始服用離憂（escitalopram)，目前劑量為一天一顆（10mg)，此外沒有服用其他的精神科藥物。這幾個月狀態都算很好，所以想要開始減藥，想詢問醫生該如何規劃減藥？感謝醫生撥空回答問題！", "large": [], "small": [], "tier3": []}, {"no": "d365d03c", "user": "鍾小姐", "q": "如題，想請問醫師，因為媽媽有在服用控制血糖及阿斯匹靈藥物。這幾年又因為失眠問題，身心科醫師開了離憂及安眠藥，離憂的藥劑本來是一天1.5顆（晚上服用）後來改成一天2顆，早晚服用，因為媽媽的阿斯匹靈是在早上服用，所以不知道離憂和阿斯匹靈是否有藥物交互作用，想請醫師解答，感謝！", "large": [], "small": [], "tier3": []}, {"no": "0141aa3c", "user": "雪安穩", "q": "從小我就是蠻容易緊張的人，面對陌生人或是在人多的場合都會令我感到不自在，最近有考慮去諮商找出最根本的問題，但因為已經大學畢業了外面的諮商費用也不便宜，所以有預約實習諮商心理師，想請問醫師第一次諮商該說什麼比較好，通常要諮商幾次才會有效果?最後還想請問醫生幾點問題：容易緊張的人是不是胃食道逆流比較容易反覆發作?吃魚油真的有助於減緩焦慮嗎?中醫對於腸胃改善和睡眠品質改善是否有效?", "large": [], "small": [], "tier3": []}, {"no": "3ef7f1b1", "user": "金小喬", "q": "請問，我女兒國一才診斷出有亞斯柏格症和專注力不足，這樣有算輕度身障嗎？已鑑定兩家大醫院，一家說專注力不足而已，另一醫院診斷兩項都有。目前有社工在諮商，但沒什麼用，社工希望去申請輕度身障，這樣可以進特教班，是否申請的過呢？我覺得亞斯柏格症特質很嚴重，真的沒同理心，不善社交，國小人際關係很差，而且，邏輯思考，表達能力有夠另人生氣，講話不看別人，甚至連我是她母親也一樣，問了很一般問題，無法回答，拖很久講不出一句話，常在不適當時間點，說出令人不知所措，或跟話題無關的話。老師已告知過，但，卻還是當她一般學生，要求她常達不到的標準，上課遲到，睡覺,遲到沒做掃地工作，還記缺點到變警告。****請問，榮總醫生證明已寫出，亞斯柏格症和專注力不足，是否可請醫生開輕度身障手冊？（有做心理衡鑑）****要不然每換一個老師，就要講一次，而有些老師好像不能理解在日常基本生活為何達不到標。搞到我快瘋掉，也請教，如果事情發生時，要怎麼跟她相處，也不讓自己發飆。常常恍神，上個廁所要半小時，寫功課寫到睡著，對自己有興趣就有精神，沒興趣可以邊聽點睡，要不然就是那個沒交這個沒交........。一直滑手機，只看一些沒用的影片，女生也不愛漂亮就算了，還不愛洗澡，衣服也不換洗（貼身衣，褲也是如此。）MC來，也不愛洗澡，超讓人抓狂，好好講，每次都說好，實際上不做無意識常愛用手扣自己手臂.......,.。", "large": [], "small": [], "tier3": []}, {"no": "c36a67b8", "user": "紫薯", "q": "您好請問早產造成的注意力不足主顯型的ADHD病理機制是不是跟一般的ADHD有所不同？有哪些不同？服用利他能會有什麼差異嗎？注意力不足可能跟學習障礙讀寫算障礙有關嗎？網路上說吃利他能專司達等藥，是在干擾多巴胺系統，每吃一次就會讓多巴胺受體的敏感度下降是真的嗎？為什麼會覺得狀態好時不服藥也感覺專注力非常好（像是可以專注的上6~8節課），狀態不好時專注力很差（每堂課都不太專心）？謝謝", "large": [], "small": [], "tier3": []}, {"no": "ee58b6ca", "user": "泥", "q": "只要一吵架我的情緒起伏就會變異常的大，會開始摔東西、自傷，只要冷靜下來就覺得自己很可怕，但是當下自己沒有辦法控制情緒。（4、5年前有憂鬱症、PTSD但藥吃完後就沒有持續就診，心情有感覺比之前好但是我的記憶力還是很差，不知道是不是跟這些有關聯。再麻煩醫師回答十分感謝。", "large": [], "small": [], "tier3": []}, {"no": "66bf2fbe", "user": "晴天", "q": "醫師你好：我現在是21週媽媽，在台大醫院做產檢，羊膜穿刺正常，羊水基因晶片檢查結果，第16號染色體長臂q24.2~24.3區域有2.19Mb微片段擴增，涵蓋39個OMIM基因。晶片篩檢報告說明寫道：擴增片段涵蓋ANKRD11其致病性變異缺失會導致罕見疾病KBG症候群罕見疾病，但是ClinGen資料庫針對ANKRD11擴增沒有具體致病性的證據。我在第21週已經完成台大高層次超音波檢查，器官發育跟臉部手腳指骨骼等外觀觀察報告都正常(pregnancyfor21weeks,AGA)，現階段已經抽取父母親血液檢體等待比對結果中，我上網查詢外國論文資料庫，有一篇義大利文章提及有一例男孩病跟我一樣染色體區域發生自發性突變(aboywithadenovo16q24.2q24.3microduplicationattheSingleNucleotidePolymorphism(SNP)-arrayanalysisspanning~2.2Mbandencompassing38genes)，出現智力障礙、言語遲緩和輕度畸形特徵(窄額頭鼻孔外翻小拇指彎曲)，但是我找了台灣沒有相關文獻討論這個染色體問題，想請教小孩出生後發病機率風險是否很高？謝謝醫師。", "large": [], "small": [], "tier3": []}, {"no": "feee5cea", "user": "jack", "q": "季醫師妳好:在某天在電腦前站起突然耳鳴不止，就醫之後檢測出某區段低音頻出現無法聽到，打了快3個月類固醇直到現在還是一直出現耳鳴，醫生指出是突發性耳聾，可能運氣好會自然好，目前說無法有根治狀態。我想請問季醫師，如果已經接受自己有耳聾狀態，但是耳鳴依舊，是否還要再積極自療。感謝醫師百忙之中抽看~~謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "2a5c988d", "user": "ABC", "q": "請問醫師前天有發燒，隔天就退燒了，但退燒後的隔天食慾就變得沒有以前好，感覺都不會很餓，而且也變得不容易排便，請問剛發燒完會有這些影響嗎？", "large": [], "small": [], "tier3": []}, {"no": "8546fccf", "user": "匿名", "q": "醫生您好，昨天心情低落想上吊自殺,嘗試兩次應該是十幾秒因為太難受放棄，但直到今天喉嚨都挺痛的，尤其吞嚥跟打哈欠，偶爾微癢，剛剛也打了個噴嚏，我這是剛好感冒，應該作息調整好就好，應該不是上吊喉嚨部分受傷吧？因為如果去看耳鼻喉科有點不知道怎麼跟醫生說謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "6023f8ce", "user": "匿名", "q": "醫師您好，近期吞口水卡卡的有到診所就醫看診，扁桃腺發炎化膿，有一點結石，之前也有過想了解扁桃腺化膿主要原因是什麼？近期比較常幫男友口交，會不會也有關聯呢？還是生活作息也有關係謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "9e8ff396", "user": "ABC", "q": "醫師你好前天有發燒，隔天退燒後的一兩天胃口變得沒有以前好，而且肚子都會隱隱的陣痛，但是大號又大不出來，感覺好像消化很慢的感覺，請問是跟發燒有關係嗎？", "large": [], "small": [], "tier3": []}, {"no": "d8443fbb", "user": "盧先生", "q": "醫師您好，我從7∼8前開始左耳耳內就有連續震動的問題，過往都發生在早晨，最早僅持續短短幾分鐘到現在會持續一個小時，到這幾個月甚至中午都還會有這種情形。我的工作環境以辦公室為主，偶爾需要至工地巡查，接觸噪音也都有適當的防護裝備。期間去過幾間診所及大醫院，醫師都開肌肉鬆弛劑，也都沒效果。也做過聽力檢查(戴耳機按按扭)也都正常...想請問醫師有沒有什麼建議，謝謝！", "large": [], "small": [], "tier3": []}, {"no": "f44f2a3c", "user": "青", "q": "請問醫師做睡眠檢測時假如都睡不著是不是就不會有數據了那回診時醫師會怎麼處理這問題?", "large": [], "small": [], "tier3": []}, {"no": "76a7f48a", "user": "pei", "q": "哈囉醫生您好，前陣子1/20左右觀察到自己的扁桃腺(右側)附近腫了起來(像一顆紅豆的感覺)https://ppt.cc/fJmdfx@.jpg，前後已給醫生檢查2、3次，，超級擔心是否是什麼重大疾病，但檢查都說正常，醫生也表明會腫起是因為扁桃腺的機制，導致那個位子發炎腫起，會慢慢消下去，但我還是覺得非常緊張，那個腫起物沒有變大，雖然有用龜速般的速度慢慢消下去的感覺，卻覺得拖好久", "large": [], "small": [], "tier3": []}, {"no": "770dd1b8", "user": "陳小姐", "q": "醫生您好，最近發現我舌頭中間有長一顆小小的好像是肉芽或是息肉，但如果去捏他的話能感覺得到是有神經的會有感覺，不會影響生活，平時吃東西也不會痛也不會有異物感，可是因為是突然長出來的，請問這種息肉的話有需要去開診處理嗎", "large": [], "small": [], "tier3": []}, {"no": "ee0d2710", "user": "鈴", "q": "醫師您好想上來詢問一下2/5週三開始我出現喉嚨像被刀割一樣的痛，還沒什麼其他症狀，就只有喉嚨痛而已一開始只是先喝普拿疼伏冒熱飲先止痛（因為還在上班）短暫止痛然後因為那天我常去看的耳鼻喉科診所那天晚上休診，所以我先去同事推薦的另外一間診所看，吃了藥之後喉嚨是沒那麼痛了，但也沒比較好，後面症狀陸陸續續出現黃鼻涕、黃痰、鼻塞、發燒（腹內燒）、咳嗽、聲音沙啞沒聲音有一次咳嗽咳出黃痰+血絲（目前只有那一次而已）剩餘都是黃痰而已鼻子也因為擤鼻涕到嘴唇上方部分都破皮很痛了擤鼻涕也有一點血絲、鼻子裡面也很痛後面2/8週六受不了了只好向主管請假兩個小時去我常去看的那間診所看（早上）醫師幫我抽痰、鼻涕、喉嚨塗藥開了抗生素、化痰止咳、止痛的藥，還有鼻炎的藥（睡前吃）目前已吃了兩天，仍舊是黃痰黃鼻涕現在因為咳嗽的關係，我覺得現在喉嚨像是有異物一樣卡卡痛痛的一個晚上可以讓我用掉一整包的衛生紙因為聽說如果是中流感會全身酸痛，但我不會，因為也沒有驗，所以不太確定同事是建議我至大醫院胸腔內科掛個門診，照X光確定肺部沒事，我跟他講我剛看完我常看的這間診所，再吃幾天藥看看，因為我從小都看這間，這間的院長開的藥很有效，重感冒頂多看兩到三次的醫生就可好的差不多了（公費流感疫苗去年已打）之前也有一次感冒也是像這樣燒聲，鼻塞、咳嗽咳到呼吸困難早上緊急請病假掛急診（但沒有黃痰黃鼻涕）照了，X光之後醫師說肺部沒什麼大問題要是真的要去大醫院看我該掛耳鼻喉科還是胸腔內科呢謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "db74cb9b", "user": "dodo", "q": "醫生您好，我今天早上喝水（去飲水機裝的水）的時候突然感覺有什麼東西刺到了我的喉嚨，接著就出現血腥味但是我去吐口水的時候還是透明的顏色，接著就是覺得有一點異物感但血腥味消失，然而如果去刺激那個部位又會感覺到血腥味，接著就是喝水的時候會感覺那裡好像有什麼東西凸凸的像一塊肉塊在那裡這樣，不過吞嚥跟喝水不會有太大的困難，只是東西經過那裡或是喉嚨肌肉運動或是轉動頭部的時候會時好時壞的出現有點不舒服的感覺，因此想請問醫生這是什麼情況，勞煩醫生解惑了，感謝您。", "large": [], "small": [], "tier3": []}, {"no": "8e95599f", "user": "萍萍", "q": "醫生您好∼我平時吃辣是「微」辣等級，但也沒有每天都會吃辣。昨晚下大雨感覺寒冷，就忽然很想吃辣的，晚餐買了泰式酸辣麵…。辣度對我而言，應該有到「中」辣的程度了，邊吃邊狂流鼻水..但因為很好吃又忍不住一直吃，甚至吃完還意猶未盡的喝了好幾口湯…。吃飽大概兩小時後，忽然開始覺得喉嚨會癢癢的…我開始多喝水，但直到睡前這種癢感都沒有消失。結果今天早上睡醒，就覺得喉嚨很乾很乾，燒燒的，喝水也沒用，還是很乾..而且聲音還變的很低沈…。想請問醫生：吃辣有可能導致喉嚨發炎嗎？喉嚨發炎聲音會變嗎？使用藥局賣的喉嚨噴劑能治療嗎？", "large": [], "small": [], "tier3": []}, {"no": "b19aaa64", "user": "萍萍", "q": "醫生您好∼我平時吃辣是「微」辣等級，但也沒有每天都會吃辣。昨晚下大雨感覺寒冷，就忽然很想吃辣的，晚餐買了泰式酸辣麵…。辣度對我而言，應該有到「中」辣的程度了，邊吃邊狂流鼻水..但因為很好吃又忍不住一直吃，甚至吃完還意猶未盡的喝了好幾口湯…。吃飽大概兩小時後，忽然開始覺得喉嚨會癢癢的…我開始多喝水，但直到睡前這種癢感都沒有消失。結果今天早上睡醒，就覺得喉嚨很乾很乾，燒燒的，喝水也沒用，還是很乾..而且聲音還變的很低沈…。想請問醫生：吃辣有可能導致喉嚨發炎嗎？喉嚨發炎聲音會變嗎？使用藥局賣的喉嚨噴劑能治療嗎？", "large": [], "small": [], "tier3": []}, {"no": "9e2ea95e", "user": "阿驛", "q": "請教季醫師：因豐原醫院醫師叫我轉院到台中慈濟醫院去做這個聽小骨重建，因為左耳分貝75分貝，右耳35分貝°1月份後來轉診到慈濟醫院後，那位醫師說我先做聽小骨重建，2/11開完刀說我左耳聽小骨老化，先把舊的敲掉，然後有點化膿發炎，把腐肉刮除有塞填充物，如果不要在慈濟醫院拆線，回豐原醫院拆線可以嗎？這樣會不會有問題呢？", "large": [], "small": [], "tier3": []}, {"no": "c20d3ef2", "user": "匿名", "q": "醫師您好，我曾經有確診過兩次，並且在去年11月初發燒生病以後，就開始咳嗽咳不停，在今天之前，去過三次診所，專看耳鼻喉科的診所也去過任何止咳藥都沒有效果，喝溫熱的東西也沒有減緩喉嚨乾癢、咳嗽的症狀，在當時醫生建議我去照X光到大醫院掛家醫科，無論是胸腔X光、呼吸檢測、痰液檢測都沒有異狀，皆為正常，因此排除肺部問題以及肺結核、氣喘但還是會一直咳嗽，有一點痰，但不多，白色的，開的藥也都沒辦法止咳，連止咳藥成藥都沒有效果並且咳嗽聲疑似有咻咻聲，聲音比較奇怪一點，和往常咳嗽的症狀不大一樣，夜晚或是感覺乾、冷的時候會咳不停，不分白天、夜晚的咳嗽因為有點影響生活，像是可能睡前會一直咳嗽導致睡不好，睡眠品質受到影響，或是會因為咳嗽而導致不停乾嘔，若有吃東西的情況，有時也會不小心咳到嘔吐的情況查了相關資料，但看哪一科的說法有很多，有點不知道該怎麼選，想知道這樣的情況掛耳鼻喉科還是胸腔科、呼吸科哪一個會比較能解決我的問題？", "large": [], "small": [], "tier3": []}, {"no": "5f3edb7d", "user": "巧虎", "q": "長期被扁桃結石問題困擾，診所看診醫師說我的隱窩孔比較大本身就很容易卡髒污加上長期鼻涕倒流所以很容易沒有辦法解決，近幾個月我晚上常被掉落結石卡到喉嚨驚醒，每月清潔的結石也越來越大顆越來越多顆感覺就像毛孔被撐大的感覺，髒污越來越會卡在裡面，也常有流血狀況，真的很痛苦，考慮很久希望醫師可以評估手術，但到了醫院詢問卻得到除非爛掉不然不用手術的回覆，真的讓我覺得很氣餒也很難受，真的只能等爛掉才能手術嗎？真的很難受，先感謝醫師回覆", "large": [], "small": [], "tier3": []}, {"no": "c07fc291", "user": "Zoey", "q": "鄭醫師您好發生頻率大約是一天3-5次，一頓暴咳後每次可咳出1.2根鼻毛。原以為是鼻涕倒流造成，因此嘗試看醫生吃藥控制。這幾年鼻涕倒流現象雖然緩解，但是鼻毛造成的嗆咳情形仍未減緩，無法理解脫落的鼻毛為何會頻繁向後移動至咽喉。一直以來對日常生活造成影響，開會、出入安靜場所或睡覺時真的困擾…。不知道有沒有什麼藥膏、噴劑或治療方式能夠解決鼻毛掉進喉嚨的問題，目前吃藥沒有改善、上網搜尋也沒有類似例子做參考。感謝鄭醫師。", "large": [], "small": [], "tier3": []}, {"no": "a57f99c2", "user": "Wll", "q": "醫師你好，今天早上我因為匆忙趕著出門，然後喝咖啡喝得很急又很大口，突然間覺得喉嚨有一種快被撐破的感覺，然後我還是硬把它吞下去之後我一直覺得喉嚨怪怪的，然後呼吸的時候深呼吸的時候也怪怪的，只是沒有痛的感覺。今天晚餐想吃飯的時候就覺得吞東西喉嚨感覺很緊很不舒服，我不知道這個是不是因為喝太大口的飲料然後來不及反應造成還是有其他的狀況。但是我很確定我的咖啡裡面沒有任何的固體物，溫度沒有很高就是一般的溫溫的溫度而已，所以我才想說急著出門很大口的喝下去，那種感覺很像是被很巨大意的東西突然間堵在喉嚨當時我的反應就是想要趕快把它吞下去，於是硬吞下去。吞下去的時候就突然間發現喉嚨很不舒服，感覺好像快被漲破一樣。請問這是正常的嗎？", "large": [], "small": [], "tier3": []}, {"no": "67a29b25", "user": "男", "q": "醫師您好，小弟我今天照鏡子突然發現在舌根（很伸處的地方）長了幾顆不知道什麼東西，左右兩邊都有，想請問這是什麼？是感染到什麼了嗎？應該要如何改善？https://imgur.com/a/Y9lwEDF", "large": [], "small": [], "tier3": []}, {"no": "7b3b8eab", "user": "晴", "q": "你好醫師，是這樣的，因為我在鼻子內部接近鼻孔處長了一顆小小的東西一直以來都不會痛（除非去摳）所以一直以來都把它遺忘掉直到最近突然想起來，發現似乎一直都沒有消下去然後昨天手賤扣了然後扣痛了，因為一直沒消所以很怕出事，所以今天跑去看耳鼻喉科耳鼻喉科醫生說是甚麼毛囊發炎，開了一個藥讓我擦但是醫生說的話讓人很擔心，因為他說藥擦了沒好不排除要去醫院做切片，跑去看網路上的資料也確實發現如果沒有好不排除是更嚴重的病症……很擔心萬一真的擦了沒有好要怎麼辦？擦藥後多久會有成效？我看網路上說一般不吃藥可能也都會自己消，我的偏偏幾個月了也沒見消……", "large": [], "small": [], "tier3": []}, {"no": "c11767e1", "user": "陳", "q": "自去年夏天起常無故流鼻血有時一週達2∼3次幾乎為左側、偶有鼻塞血稀如水、呈鮮紅色、有時有血塊量多、不易止已掛號預約檢查1.請問近期應如何快速止血2.請問可能的原因有哪些", "large": [], "small": [], "tier3": []}, {"no": "fdb254c3", "user": "藍天", "q": "醫師您好:因為兒子服用三天日舒，依然咳嗽劇烈，且都是深黃痰。再次回診，醫生開了早晚各二顆得喜寧100mg，一天加總四顆，要服用一周。不知道這樣的劑量是否安全?兒子快62公斤。另外就是得喜寧和艾胃逆服可同時服用嗎?", "large": [], "small": [], "tier3": []}, {"no": "36404672", "user": "Kris", "q": "鄭醫師您好:想請教您，就是我用棉花棒掏耳時，會感覺右耳的外耳道棉花棒較難進入；左耳相對好進入些。我以為是我右耳的外耳道較左耳的外耳道狹窄所導致，而前陣子去看耳鼻喉科，有順勢詢問醫師，我右耳的外耳道是否較左耳的外耳道狹窄，經醫師用耳放大鏡檢視後，告知我兩耳的外耳道寬度都是一樣的。後來我用較細的棉花棒去掏耳才發現，似乎是因我右耳外耳道的彎度較彎，所以棉花棒才會卡卡的難進入；而我左耳外耳道的彎度沒那麼彎，感覺較筆直，所以棉花棒才會較好進入。以下請教鄭醫師:Q1.請教您，像我這樣兩耳外耳道的彎度不一樣是否為正常的現象呢?(即我右耳外耳道的彎度較左耳外耳道的彎度彎)Q2.我有時會感覺到右耳有些悶塞感。請教您，是否因我右耳外耳道的彎度較彎，才因此導致我的右耳出現悶塞感呢?外耳道的彎度較彎與耳朵悶塞感，兩者是否有關聯呢?以上，還請鄭醫師指導，感謝您。", "large": [], "small": [], "tier3": []}, {"no": "809f0e2d", "user": "阿黃", "q": "醫生你好，我在前幾天嘴巴裡長了一個潰瘍，但跟以往不同的是他不會痛，但看起來卻跟一般的口腔潰瘍差不多這裡是照片：https://lurl.cc/AJ5Cx我有在網路上查詢，他說有可能是口腔癌前兆，請問會發生類似的問題題是因為什麼呢？", "large": [], "small": [], "tier3": []}, {"no": "6f8b00b4", "user": "Kris", "q": "鄭醫師您好:非常感謝您在「#215881疑問諮詢」給予的回覆與說明。原來兩耳外耳道的彎曲角度有差異是正常的現象，這令我放心許多。惟您在前篇提問的回覆中提到:「...外耳道的彎度可能與耳朵悶塞感部分相關...」以下想再請教鄭醫師:Q.我查詢到的資訊指出若外耳道的彎度較彎，可能會導致耳垢或水較易堆積在耳道內不易排出，致使耳朵發炎出現悶塞感。請教鄭醫師，您提到外耳道的彎度可能與耳朵悶塞感部分相關，是否也是指上述我查詢到的資訊呢?還是說，您認為有其它的原因，比如:外耳道的彎度較彎，這種耳道本身構造上的問題，即會導致耳朵出現悶塞感(這是我自己的猜想)。以上，還請鄭醫師指導、解惑，感謝您。", "large": [], "small": [], "tier3": []}, {"no": "5ddfbd38", "user": "吳小姐", "q": "妻子患有支氣管擴張症，已在長庚持續追蹤治療8年左右。去年X光片及斷層掃描顯示，控制狀況尚可，持續以每日兩次拍痰保養中。但去年中開始有頻繁的咳痰（清白色為主）現象，特別在清晨起床及晚上躺床後不久，看過耳鼻喉科醫生，說是鼻水倒流造成，但為何吃藥總無明顯改善至今，頗影響睡眠及作息。想請問醫生，進一步積極診療的建議如何？謝謝", "large": [], "small": [], "tier3": []}, {"no": "0f07bbaa", "user": "匿名", "q": "醫生您好，我在約兩個月前得了重感冒，藥沒有吃完，在感冒了一個月後症狀消失，但喉嚨還是會痛。我的喉嚨有時會痛有時不會，痛的位置在靠近口腔處的喉嚨左側，吞口水、吃東西時會有刺痛感，打哈欠時扯到會很痛，並且痛的時候左側的頸部和頭部交界處的淋巴結腫大，不會痛。今天發現在左側的頸部中段也有一個小硬塊，除此之外沒有發燒或其他感冒症狀，喉嚨看起來也沒有紅腫，聲音正常，沒有呼吸困難。我之前有時會有扁桃腺結石，不久前發現喉嚨裡有一塊，但沒有吐出來。想請問這樣可能是什麼情況？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "e88b9d5b", "user": "Li", "q": "副院長,您好：我是214804尋問者,感謝您上次之回復,以下問題再次請教:1.\t膽管內徑正常範圍是幾mm？多少ｍｍ算膽管擴張或狹窄？2.\t胰管內徑正常範圍是幾mm？多少ｍｍ算胰管擴張？3.\t血液中總膽紅素及鹼性磷酸酶正常，是否表示膽道未阻塞？", "large": [], "small": [], "tier3": []}, {"no": "690d151c", "user": "唐先生", "q": "醫師您好，非常不好意思在您這麼繁忙的狀況下還來打擾您，我是一名19歲的大學生，想問您兩個問題第一個問題是最近發生的，在昨天我的肛門附近（內部）突然發生一陣劇痛，但是就沒有後續了，結果過了幾個小時上廁所的時候發現有血便，今天在上廁所的時候也有血便的發生（還有腹瀉，但我不確定腹瀉是因為這個還是因為過年吃太多），之前有肛裂的情形發生也有血便的發生（但是血都是在大便末端而且只有一點點，而且久很久沒有發生了）第二個問題是平時我的糞便都偏軟，而且在考試前或者比賽前常常會有便意或者要腹瀉的感覺，請問這個問題嚴重嗎？", "large": [], "small": [], "tier3": []}, {"no": "884ce5f2", "user": "小庭", "q": "從除夕時開始有發燒的症狀，之後稍微好一點，1/31日時又變嚴重，當晚有發燒嘔吐的情況，隔天看醫生，只有發燒跟全身痠痛的情況有緩解，到2/2的時候晚上吐了數次，又再去看醫生，醫生說單純腸胃不適，吃藥回家休養，今天2/4有感覺好一點，但是還是不太有食慾，吃東西還是會想吐，請問這樣是正常的恢復期嗎，還是要再去做進一步檢查？謝謝再麻煩醫師回答了！", "large": [], "small": [], "tier3": []}, {"no": "b3be6cdb", "user": "陳小姐", "q": "我今年一月被確診了胃食道逆流，有做過胃鏡了，吃藥到現在也快8週了，但是吞口水還是會覺得喉嚨卡卡的，吃東西不會，醫生也沒換藥讓我繼續吃，不知道是不是胃食道逆流導致的", "large": [], "small": [], "tier3": []}, {"no": "cc1824f6", "user": "沈先生", "q": "醫師您好，兩個問題請教1.2023年8月做胃鏡檢查出食道末端有一顆2公分的黏膜下腫瘤，當時醫師說可能是脂肪瘤或水泡或其他腫瘤，想請教這顆在食道末端的黏膜下腫瘤有可能變成食道癌嗎？因為我一直沒有理它。2.請問糞便潛血陰性有沒有可能只是剛好採集到沒有血液的糞便，所以導致結果是陰性，這算是偽陰性嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "852aded2", "user": "安妮", "q": "醫師您好想請問醫師：1.前幾日在練習美甲的剪皮時，有借外婆的手練習，練習的途中剪破了外婆的手指且有流血，是兩個很小的洞，但因為外婆有B型肝炎，請問碰到血的器具使用酒精擦拭消毒即可嗎？會需要使用到漂白水或肥皂清潔嗎？2.想詢問b肝病毒會殘留於器具上多久呢？如果留在剪刀上的血液乾掉再接觸到下一人被剪破的傷口是否會被傳染？又或是血液乾掉便不具傳染力了嗎？因為近日練習外婆的手指也會練習自己、朋友，擔心沒有清潔乾淨會交互感染。3.外婆腳被小針刺到我想說試試軟化一下皮膚是否更容易拔出，而有將軟化劑，是指甲油類型的瓶罐與刷頭，直接塗抹在外婆的皮膚上，最後有拔出小刺，但中途塗抹2至3次，不太確定被針刺到的地方是否有小破洞、液體、血等等，想詢問您病毒是否會殘留於軟化劑內呢？擔心塗抹下一個客人又不小心剪破對方手時會有感染疑慮。謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "551b647b", "user": "匿名", "q": "醫師您好想請問長期胃食道逆流，但逆流的東西都沒有刺激性，不酸，就是跟吃進去的食物或液體，沒胃酸，這樣會怎麼樣嗎？需要看醫生嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "9f3e3d97", "user": "何先生", "q": "醫師您好，想請問腸胃的腫瘤，黏膜下的腫瘤會壓迫到神經造成背痛嗎？我近一年有中背與上背疼痛的問題，有明確疼痛的區域，是不會到非常痛但就是整天會感到背部不舒服的情況，躺著或坐在有椅背的沙發或椅子才會有明顯緩解。至骨科及神經外科檢查X光皆無異狀，所以想詢問是否跟臟器器官轉移的疼痛有關？謝謝", "large": [], "small": [], "tier3": []}, {"no": "67dea7ed", "user": "Hoho", "q": "家人刷牙時牙膏泡沫屢次四處噴濺也會噴到我牙刷上雖然我有拿水沖一次但他有牙周病，刷牙流血不確定他有沒有C肝或B肝請問醫師這樣有可能會被傳染B肝C肝嗎？謝謝好心的醫師協助回覆", "large": [], "small": [], "tier3": []}, {"no": "0cc1fad7", "user": "陳", "q": "最近吃完飯總覺得很撐很想吐，上網查了一下認為應該是消化不良，想了想，我突然想到前兩天去餐廳吃飯時點了一晚有海鮮的飯，而那間餐廳的飯是不剝蝦殼的，在吃的時候我吃到了一個硬硬的東西，我猜那應該是蝦殼，但它沒有卡在喉嚨，就這麼吞下去了。想問一下誤食蝦殼會導致消化不良嗎，還是有其他的原因讓我在吃完飯後覺得很撐想吐（有一點食欲不振，但還是會餓）求醫生解惑", "large": [], "small": [], "tier3": []}, {"no": "16879717", "user": "沈先生", "q": "醫師您好，關於血便問題向您請教我有斷斷續續血便的問題已經持續有一年了，血通常在糞便末端，有時候一點點有時候整個馬桶都是血，在衛生紙上也會看到血，本身沒有大腸癌家族史，體重也沒有莫名大幅下降，食慾一直很好，排便習慣頻率也正常也沒有便秘，大便形狀也沒有變細，我於一年半前曾做過糞便檢查結果是陰性。近一年有做過三次內痔結紮手術的病史，也曾肛裂過幾次。本身飲食都為外食且鮮少吃水果。期間曾至腸胃、大腸直腸科求診，但也只是開個藥回家吃而已，我也會懷疑這是不是大腸癌的症狀？謝謝您的回覆", "large": [], "small": [], "tier3": []}, {"no": "511c83c1", "user": "陳小姐", "q": "藥品:THROUGHF.C.TABLETSC.M中文藥品:便通樂錠成分:SENNOSIDEA+B(CALCIUM)請問這個藥品跟我的胃食道逆流藥會有衝突嗎,因為有一顆也是要睡前吃的最近有點便秘想吃", "large": [], "small": [], "tier3": []}, {"no": "8d97420c", "user": "陳小姐", "q": "我今年一月被確診了胃食道逆流，有做過胃鏡了，吃藥到現在也快8週了，但是吞口水還是會覺得喉嚨卡卡的，吃東西不會，醫生也沒換藥讓我繼續吃，不知道是不是胃食道逆流導致的", "large": [], "small": [], "tier3": []}, {"no": "b946a298", "user": "匿名", "q": "醫師您好我是前幾天問胃食道逆流的先生，我想問，長期胃食道逆流逆流的東西沒有刺激性、不酸，不影響生活，這樣還要去看醫生嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "8f5aacb7", "user": "匿名", "q": "醫師您好我想請問，我長期胃食道逆流，但逆流的東西都沒有刺激性，也不酸，我想請問這樣我還要去醫院看肝膽腸胃科嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "984e4936", "user": "647", "q": "醫生我最近一個月偶爾晚上會拉肚子，通常都是深棕色的泥狀便，而且油到發亮，有時拌隨著類似血味的腥味，不知道跟我有時飲食過油有沒有關係最近三個月只要吃的比較多，就會吐，正常吃一個便當的量就沒事，去診所服用胃發炎的藥有好轉我網路上查資料如果大便有血味可能是血便，但我的大便不是黑的是很深的棕色，這樣需要去檢查嗎？我大概三年前有做過胃鏡，結果是胃發炎和胃酸過多大腸鏡去年有做，只有輕微痔瘡這樣有需要做胃鏡檢查嗎？", "large": [], "small": [], "tier3": []}, {"no": "d07d6f6a", "user": "橘子", "q": "過年前因為上大號時有點出血是非常粉非常淡的粉色但因卡在避孕器的副作用所以不確定是會因出血還是肛門出血今天早上上廁所顏色都正常中午吃完午餐大便顏色稍微偏暗有點拉肚子(不是非常水)後來在今(2/11)下午3點左右要再上廁所時有比較用力點但是沒有上出來擦的時候有鮮血之後就都很淡很淡的粉色跟過年前一樣伴隨著一點想吐的感覺前年與大前年有做過大腸鏡檢查醫生說是痔瘡其他沒有太大問題請問我這次的問題會是因為痔瘡破裂或者是肛裂嗎?", "large": [], "small": [], "tier3": []}, {"no": "0f1d8af1", "user": "D", "q": "醫師您好從一個月前開始發現糞便型態鬆散且軟便，容易拉肚子。前一週則是有嘔吐跟拉水便低燒，去診所看診醫生說是腸胃炎，也有跟醫生描述前一個月的情況，醫生說等腸胃炎結束再來觀察，現在腸胃炎結束拉肚子軟便的情況也沒有了，但一週僅排便過兩次，第二次還是用軟便劑才得以排便，且兩次糞便顏色皆為墨綠色，請問醫師這是什麼情況，需要去做大腸鏡等檢查嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "2f5f7b36", "user": "章", "q": "醫師您好我最近有時候晚上會突然肚子很痛（應該是下腹部）然後就會拉肚子，但每次都只拉一點點，顏色偏黑，最近幾天會有橢圓形黑色顆粒（目測長度大概一個指節再短一點點），一晚上跑好幾次廁所，上完肚子還是很痛想請問可能是什麼原因？", "large": [], "small": [], "tier3": []}, {"no": "7b55429f", "user": "寧采臣", "q": "請問我早上睡醒側躺繼續睡時肚子會咕嚕咕嚕叫還會一直打嗝有氣從下往上出來然後沒吃東西也不會有飢餓感但是三餐都能正常吃只是消化好像沒有之前好之前吃完飯過1.2小時後可能還會有點肚子餓會吃點零食但是現在不會有飢餓感前陣子有輕微腹脹後來看醫生吃藥現在是沒有了沒有便秘那些就只有我上述這樣請問我是健康出問題了嗎", "large": [], "small": [], "tier3": []}, {"no": "d70b304f", "user": "林", "q": "想請問醫生，大腸鏡檢查有可能10分鐘就結束了嗎？做的途中有意識，但只有感覺插入肛門跟脹氣而已，有打鎮靜止痛，結束後得到的消息是發炎沒有息肉，有點疑惑，因為看前面的患者都做比較久，而且本人生活習慣比較差，有點疑惑，還是要回診看看？這是我的檢驗報告015大腸鏡(10)型號:CF-H290L財產編號:48057檢查開始時間:15:22:00檢查最深入時間:15:25:00檢查結束時間:15:31:00#1.IndicationSeerequestsheet#2.PainScore:Pre-procedure:0/10Post-procedure:0/10#3.大腸鏡伸入位置(Insertionlevel)最深位置:Cecum#4.檢查前用藥(Premedication):止痙攣用藥:無止痛鎮靜用藥:有MidazolamFentanyl內視鏡輔具:無#5.清腸用藥(Coloncleansingagent):Magnesiumcitrate類Dulcolax#6.清腸給藥時間(Prepartiontime):Spiltdose#7.清腸程度(Coloncleansinglevel):適當(Good)#8.大腸鏡檢後併發症(Complication):Nil#9.抗凝血藥物(Antiplatelet/Cogaulant):無#10.Finding1診斷痔瘡;#11.診斷1:痔瘡;#12.ImmediatePostprocedureNeeds:1.Explainfindingstopatientandfamily2.Arrangeoutpatientclinicfollow-up大腸鏡檢查日期:2025-02-12", "large": [], "small": [], "tier3": []}, {"no": "563ab488", "user": "Li", "q": "副院長,您好:我是214804提問者,感謝您前次之回復,1/14及2/4分別照完胃鏡和MRCP,健保快譯通胃鏡報告如下:GIF-H290(編號:G28)Indication:SuspectedampullavaterlesionEsophagus:Somemucosalbreaks,nolongerthan5mmoverL/3,noneofwhichextendsbetweenthetopsofthemucosalfolds.Stomach:Diffuseerythematouschangeofmucosa.S/PCLOtest.Fewxanthomas,upto0.2cm,atantrum.Duodenum:Negativetosecondportion.Endoscopicdiagnosis:1.Refluxesophagitis,LAGradeA2.Pangastritis3.Gastricxanthomas,antrumProcedure:(V)Photo(V)CLOtest()Hemostasis()Biopsy()Foreignbodyremoval()EVL/EISComplication:nilSuggestion:Medication,diet,andlifestylemodification.EGDfollowup我腸胃科醫師表示我有胃食道逆流及幽門桿菌,有開omezol及Amoxicillin,但因吃上述藥後引起蕁麻疹,醫師要我停藥改服益生菌來改善胃部情況.目前無胃疾及胃食道逆流症狀.請教副院長以下問題:1.\t我胃鏡報告有需要特別異常及注意之地方嗎?2.\tGastricxanthomas是否高血脂引起?3.\t益生菌是改善幽門桿菌還是胃食道逆流?益生菌服用多久再追查?以何種方式追查?4.\t目前無胃疾及胃食道逆流症狀,可以不用理會嗎?", "large": [], "small": [], "tier3": []}, {"no": "9362398f", "user": "匿名", "q": "醫師您好,最近因腸胃問題有至診所,醫生有開一個名為Bismuth324mg的藥物,網路上說該藥物會使大便顏色變深,但我排出的大變呈現灰白色,請問是胰臟癌的徵兆嗎?", "large": [], "small": [], "tier3": []}, {"no": "f0a77e80", "user": "Marcus", "q": "醫生/院長您好，我目前這幾個月的排便型態幾乎都是大便粗度只有之前的一半，有時還會發生剛大完卻又有感覺想大再衝回去廁所的情況，甚至偶爾還會聞到臭味。我的大便幾乎都是沈的，比較少看到浮的，請問會不會是有可能發生了癌症或消化道疾病？", "large": [], "small": [], "tier3": []}, {"no": "2d56ece9", "user": "M", "q": "醫師您好，我想詢問一下，我前幾天胃不太舒服，感覺一直漲漲的，後來就開始拉肚子，一個晚上拉了七八次，但感覺拉出來的都是水且顏色偏白，拉了兩天過後今天便便呈現正常條狀，但顏色一樣偏白，我上網看了一下有資料說到可能是肝膽出問題，這樣我需要再觀察一下呢？還是要立刻去看醫生呢？", "large": [], "small": [], "tier3": []}, {"no": "ac6638bb", "user": "Yu", "q": "醫師您好∼大概有兩年的時間有脹氣的問題∼而且早上起床的時候甚至會脹氣到沒辦法吃早餐（有時候甚至午餐也會，但到晚上就會比較舒服一點）∼很沒胃口，導致現在胃也常常有扭曲感的痛，之前有兩次左右因為腸子都是大便阻塞就醫過。平常胃痛或便秘都會吃wakamoto調節，但最近發現胃痛與脹氣頻率越來越多∼想問問是有需要去做檢查嗎？生活習慣：不菸不酒，有時候會吃宵夜，但大概一個月2次而已。會熬夜（幾乎每天）感謝醫師∼辛苦了", "large": [], "small": [], "tier3": []}, {"no": "b996ef6e", "user": "楊小姐", "q": "最近經常性的偶吐每天睡覺前一定會吐，吃完東西有種胃堵堵的感覺，然後就接著去吐了，沒有懷孕之前也沒有這樣狀況謝謝麻煩醫師了", "large": [], "small": [], "tier3": []}, {"no": "c6c725a1", "user": "張先生", "q": "胡醫師您好，我想請教關於腸胃不適的問題，如下:1.本人前日吃完晚餐後腸胃不適(肚子漲漲的)，第一次上廁所時糞便情形為條狀，後來又再度不適再去上第二次廁所，糞便情形為水便，但到隔天後多了想吐(每次吐都吐一點點)，躺著的時候會比坐著的時候還要想吐且有打嗝情形(次數多次)(覺得腸胃內部很多空氣)，但上廁所就是大便大不出來(喝了很多次的溫開水仍無法大出來)，請問上述情況是否為諾羅病毒症狀之腸胃炎?2.若上述問題症狀為真，是否有相關的藥物可以治療以及使排便順利?以上問題，還懇請胡醫師給與回覆，感謝醫師。", "large": [], "small": [], "tier3": []}, {"no": "c827defd", "user": "莊先生", "q": "有映像是2/8開始大便都不成型(每天只會上1-3次廁所)，有時鬆散有時很水或是泥狀，途中有大便成型過但就大概1-1.5公分左右，後續又繼續不成型，肚子不會痛，2/14跟2/19看過醫生是說腸道有脹氣，今天目前我的大便逐漸成形但是小條片段狀的(約一公分寬)，沒有出血，有時候肚子脹脹的，體重稍微減輕的情況(有在飲食控制)，吃飽飯有時會腸鳴一段時間，到現在已經兩周時間是不是有點太長，或者是其他疾病", "large": [], "small": [], "tier3": []}, {"no": "ccddf233", "user": "匿名", "q": "胃食道逆流約5年每天起床或躺臥直立站起就是會打個幾下嗝如果是改變姿勢就會打嗝這種物理方式造成會不會是器官方面哪裡有問題看了好幾家醫院有開藥給我吃也都沒用也試過中醫開了降逆止嗝的藥給我也沒用如果是胃酸逆流導致那我吃PPI應該要有效果但都看不見成效真的想不通是甚麼原因還是我應該去看神經科?", "large": [], "small": [], "tier3": []}, {"no": "9175eb3c", "user": "徐先生", "q": "醫師您好：個人罹肝癌並進行根治手術。部分病理報告內容不甚了解。GrossDescription:TumorSize:5.2x4.5x4.0cmTissuedefectsize:Tumor:2.5x1.0x1.0cm;Non-tumor:1.0x1.0x0.5cm.Representativesectionsaretakenandlabeledas:Jar2A1-4:tumor(A1:withsectionmargin)A5:nontumorousliverparenchymaMicroscopicDescription:ParenchymalMargin：Uninvolvedbyinvasivecarcinoma；Distanceofinvasivecarcinomafrommargin:0.5cmIshakmodifiedstagingoffibrosis(2)請問採樣方式、內容及其呈現意義為何？感謝醫師協助釋疑", "large": [], "small": [], "tier3": []}, {"no": "d0f93897", "user": "WEI", "q": "醫師您好:我37歲男性，血檢肝、腎功能檢查均正常，2/18照CT診斷出肝雙葉多顆囊腫、腎雙側微小囊腫，醫師請我每半年照腹部超音波追蹤，請問醫師:1.個別請胃腸肝膽科醫師及泌尿科醫師打開CT影像給我看，只看到肝、腎個別有單一顆小囊腫(肝1.2cm,腎0.Xcm)，但放射科醫師的CT報告上寫肝雙葉、腎雙側都有囊腫，為什麼會有這樣的差異呢?2.同上，經瞭解多囊肝/腎會影響肝/腎功能，我這樣算是多囊性肝/腎病嗎?3.肝/腎囊腫會變大的很快嗎?4.變大可以用內科囊腫引流術，大概是怎麼執行的呢?針多大支，傷口多大，局部麻醉後還是會痛嗎?5.在照CT前就有先照腹部超音波，但當時診察的醫師沒有發現肝/腎囊腫，若每半年檢查還是照超音波，會不會也看不到囊腫?要如何跟後續定期追蹤照腹部超音波的醫師說才能真的達到定期追蹤的效果呢?以下為2/18CT報告:CTscanofabdomenwithandwithoutcontrastenhancement:＞Severallowattenuationnodulesoverbilaterallobesofliver,infavorofhepaticcysts＞Nosignificantearlyenhancednodularlesionisfoundoverbilaterallobesofliverinthisstudy.＞Patentmainportalveinandbilateralmajorbranches＞Bilateraltinyrenalcysts.＞Non-distendedUBisnoted.＞Calcificationsinprostategland＞Bilateralmildhydrocele＞Slightfatstrandingoverperitonealregion＞Presenceofminimalascitesinpelvis.＞Thegallbladder,pancreas,spleenandvisiblelungfieldsarewithoutspecificabnormality＞Nosignificantlymphadenopathyintheabdomenorretroperitoneumisidentified＞Noosteolyticorosteoblasticbonelesionisidentifiedinvisiblebonystructure.IMP:1.Bilateralhepaticcysts2.Bilateralrenalcysts3.Calcificationsinprostategland", "large": [], "small": [], "tier3": []}, {"no": "8f922b63", "user": "Delywy", "q": "2/20因為反胃、沒什麼胃口，去腸胃科給醫生看診，他說我這是胃食道逆流的症狀，大概2、3年前我有給同一位醫生照過胃鏡，那時候醫生說沒什麼問題只是輕微胃食道逆流。目前吃醫生開給我的泰克胃通和艾胃逆服，症狀是有稍微緩解，但偶爾還是會脹氣和覺得反胃，想請問吃這兩種胃藥，還能夠吃暢快人生嗎？摩舒胃清錠能夠磨成粉服用嗎？如果容易緊張是不是胃食道逆流就不太好根治？", "large": [], "small": [], "tier3": []}, {"no": "4a03d73e", "user": "豆", "q": "副院長好本人長期有右肋骨下微悶痛的困擾，幾年前去有照了X光醫生說無異樣，說可能是筋膜或是拉傷，開了肌肉鬆弛和止痛等藥，好了一陣子，又常常開始悶痛，過１．２年做了健康檢查，發現有點輕微脂肪肝和膽結石，但醫生只說持續追蹤即可，後來還是一樣開始悶痛，做了胃鏡說胃接12指腸處有一個小破皮(一個小紅點)和有點胃食道逆流，後來開了藥治療了一陣子，但還是常常持續性悶痛，不管空腹或吃飽，悶痛的位子是在右肋骨下緣，肋骨最邊緣往內壓會些微悶痛但壓著不放幾秒又不痛了放開又會輕微感到悶痛，本身常脹氣，我發現我吃很飽都不太會打嗝，只會想吐，我每次就會返嘔出氣，氣嗝出來又好多了，但那邊還是一樣為悶痛，請問我該再做哪些檢查或是甚麼原因導致呢，謝謝", "large": [], "small": [], "tier3": []}, {"no": "68f01625", "user": "倪", "q": "醫生您好，我因為胃食道逆流照胃鏡得知幽門桿菌後，目前正在服用抗生素，包含：Ulicin500mg、Amoxicillin500mg兩顆、Bismuthsubcarbonate324、Pantyl40mg，早晚飯前。吃到第五天開始有想噁心嘔感，第六天半夜睡覺到一半醒來發現想吐加身體發抖，隔天就再去看醫生，醫生有開D.M.P10mg止吐藥及Lactam500mg給我，吃第一天就沒有想嘔的感覺，也沒有發抖但大腿仍然會隱隱震動，隔天也就是今天嘔感加重，一直想嘔吐想請問醫生：1.幽門桿菌抗生素會造成噁心嘔感嗎？2.身體發抖或是腿部震顫有可能是因為身體不適或是副作用造成的嗎？3.吃了止吐藥之後可是還是很想嘔，是因為醫生開的抗生素對我來說藥效太強嗎？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "de2198da", "user": "匿名", "q": "胃食道逆流7年了胃鏡也照過無數次沒有橫膈膜疝氣沒有賁門鬆弛找過好幾家腸胃科照胃鏡都說沒問題胃鏡照片一看確實賁門也是好的但躺下睡覺就是會逆流人站起來的時候似乎也會感覺胃酸從食道流下去吃了制酸劑H2阻斷劑艾胃逆服PPI中藥半夏瀉心湯吃了確實都有用但一停藥就是復發(或者說根本就沒好只是靠藥物壓制病情)請問我是否需要改往自律神經去醫治?自律神經這東西是有儀器能檢測出來的嗎?", "large": [], "small": [], "tier3": []}, {"no": "4d27f532", "user": "ff-Ufo", "q": "醫師您好：想請問一下我有時會有腹痛，且尿液呈現茶色，已停吃中藥，去肝膽腸胃科看之後檢測了肝功能腎功能都說正常，但目前還是有以上的困擾（茶色尿、偶爾腹痛），且大便又出現了透明血絲+一點黃色黏稠物，味道是臭雞蛋味，目前出現過三次，都是隔約一個月才排出一次，一開始以為是肝炎（尿液茶色糨糊味、偶腹痛、腸鳴、屁臭、皮膚壓力疹），還一起看了婦科，但今天很明顯是從屁股排出的血絲狀黏液（已經遺忘了又出現這個症狀），請問我要再次掛肝膽腸胃科還是大腸直腸外科，分不太清楚是哪一種符合我的需求，症狀都打出來想問問醫生是否都有關聯，因上次肝膽腸胃科醫生沒有給我解答⋯且我沒有提到血絲狀黏液的問題。在此謝謝醫生抽空回覆，感恩", "large": [], "small": [], "tier3": []}, {"no": "e3aeb28b", "user": "Wesley", "q": "您好我近期完成胃幽門螺旋桿菌的三週吃藥療程後，常常會覺得肚子餓，有時吃飽飯沒多久就又餓了，常常有肚子餓的感覺，但沒有疼痛感，這和胃幽門螺旋桿菌治療有關嗎？要怎麼檢查或是知道是不是身體出了什麼狀況？謝謝您的回覆", "large": [], "small": [], "tier3": []}, {"no": "68f09420", "user": "啊哈哈哈", "q": "醫生您好，我是個不愛吃菜&水果和水一天喝不到600ml的人，最近上完廁所感覺肛門那邊好像有一顆東西，然後上完廁所還會痛&癢，目前沒有脫出，請問要怎麼辦？好像有一點點血附著在大便上面是因為我上廁所幾乎都要半小時起跳嗎？有哪些不用看醫生的方法呢？家人也有痔瘡會遺傳嗎？", "large": [], "small": [], "tier3": []}, {"no": "fcedfc68", "user": "林林", "q": "您好，我最近三次排便（約兩三天一次），糞便很粗長，且有鮮紅色的血液在大便上，擦拭的時候也有，但只有排便時出血，其他時候完全沒有出血的現象，基本上沒有痛感，但排便後會有點不舒服，像沒有排乾淨的感覺，在上廁所前膀胱附近有短暫的刺痛，另外我有胃潰瘍的病史，有上網搜尋了一下出血呈鮮紅色可能是痔瘡或肛裂，不確定我的情況是哪種，因為我的糞便很粗長，想詢問有沒有可能只是因為糞便粗長且稍微有點硬而導致出血（但血量不少）以及我應該如何判斷什麼程度需要就醫？", "large": [], "small": [], "tier3": []}, {"no": "e628e47a", "user": "匿名", "q": "我想問一下醫生，為什麼屁股有洗乾淨但是椅子或是褲子屁股那面都會有一股味道（不像屎味，是騷騷的那種，類似狐臭味）？是不是腸子或是肛門有問題呢？", "large": [], "small": [], "tier3": []}, {"no": "f6e83669", "user": "楊", "q": "醫師您好家裡奶奶已85歲了，最近膝蓋已經痛到無法走路需要更換人工關節，又做了一系列的全身檢查發現肺部有兩個腫瘤但因為不確定是良性還是惡性，需要做抹片檢查，但奶奶年紀已經很大了想問醫師醫生不敢確定是不是不好的瘤他說要做切片才知道是不是不好的但是做切片就是要開腳如果吃鏢靶藥物控制會好嗎還是有什麼建議呢如果不開刀病情會惡化嗎不開刀的話大概還有多久的時間", "large": [], "small": [], "tier3": []}, {"no": "c484c219", "user": "黃小姐", "q": "醫生您好：我在去年11月確診左側乳癌（位置12/5），11月中進行局切，前哨淋巴切片2顆，未感染，一顆浸潤癌1.5cm，一顆原位癌0.5cmEr:95Pr:50Her2:2+Fish:陰性Ki-67:3%跟主治醫生商量後決定全切重建而且患側乳暈處又發現2顆腫瘤當時並未確定是否惡性今年1月進行乳頭乳暈保留手術並植入擴張器手術後兩顆腫瘤化驗為浸潤癌大小為1.4cm及0.7cm及多顆原位癌最大為0.1mm距離乳頭安全距離為0.1mm乳頭未發現癌細胞其他切緣：乾淨，最接近的深部切>10mmEr:95Pr:75Her2:1+、2+Fish:陰性Ki-67:1%、2%未發現神經、淋巴、血管侵犯醫生說上次手術有驗過前哨淋巴了，所以這次就不用驗淋巴了請問我的醫生做這樣的判斷是合理的嗎？第二次手術後續回診有做超音波檢查結果也正常可是我還是有點擔心淋巴…後續腫瘤科醫生讓我選擇1.吃10年藥加打5年針，加放療20次，不包含腋下2.化療4次加吃藥5年我是不是該選擇化療呢？", "large": [], "small": [], "tier3": []}, {"no": "e8faedf3", "user": "芸", "q": "大約去年10、11月時發現耳下有一顆圓的硬塊，不會動、算硬、按壓大力一點會痛，後來這幾個月不知道是不是心裡作用有時候就會痛一下，偶爾想到也會去摸，但前一個月就沒有再太去注意了，不過這幾天想到又去摸了感覺好像有比之前大一點、位置好像也比較往下？（有點忘記當時的大小及位置）現在直徑摸起來是比一個指截長一點的大小。而今天洗澡的時候突然發現私密處下方與大腿連結處有一小顆，不過是軟的可以滑動，不知道是不是之前就有只是沒注意到。1.想請問這樣的話是因為感冒感染後遺症造成的淋巴腫嗎？因為去年九月多的時候有感冒一次，十月附近就發先頸部有一些淋巴腫，不過除了耳下的那顆硬塊其他的都是可滑動的而且變小了，目前是比較擔心耳下那顆。2.耳下的硬塊有可能會是惡性的嗎？大概要怎麼判斷？因為網路上都說硬的不會動有可能會是不良的，所以很焦慮。謝謝回答！", "large": [], "small": [], "tier3": []}, {"no": "a61f01e8", "user": "jack", "q": "我現在醫生是給我Xeljanz捷抑炎持續性藥效錠11毫克想問一下如果有感冒症狀是不是能夠吃感冒藥(喉嚨有痰跟流鼻涕)還有就是我想知道如果說用針劑跟口服的副作用哪個比較強因為醫生有讓我選但是我不知道哪個最好副作用最低所以我先選口服感謝協助", "large": [], "small": [], "tier3": []}, {"no": "f41b4167", "user": "K", "q": "請問醫師，患者在長期服用「彌可保膠囊500微公克」（Mecobalamin500mcg）的情況下，可以同時服用一般市售B群嗎？e.g.,武田合利他命EXPlus。感謝您的回答！", "large": [], "small": [], "tier3": []}, {"no": "0dcabe26", "user": "歆珈", "q": "施醫師您好：我媽雙大腿後側與屁股下方會痛，走路會酸軟無力，較難行走，請問這是哪裡有問題？勞煩施醫師您解答，謝謝！", "large": [], "small": [], "tier3": []}, {"no": "9928c8a3", "user": "甄", "q": "醫師您好：在一天的起床過後，發現肩頸出現酸痛的症狀，但是就當作睡覺落枕，所以也沒有特別去處理。但後面兩天起床後，雖然主要不再是肩部的酸痛，可是當抬起或低下頭部時，都會因為脖子的移動而導致背部、肋骨、脊椎附近的肌肉酸痛。我平常會有長時間坐於桌前辦公的情形，但不確定是睡眠姿勢不良，或是日間的久坐影響較大。想請問醫師此類情況較有可能跟哪一種身體狀況或平日的生活習慣較有關係，應該如何緩解，還有確切可能需要到哪一個診室類別看醫生。謝謝醫師！", "large": [], "small": [], "tier3": []}, {"no": "d5de0e66", "user": "甄", "q": "醫師您好：在一天的起床過後，發現肩頸出現酸痛的症狀，但是就當作睡覺落枕，所以也沒有特別去處理。但後面兩天起床後，雖然主要不再是肩部的酸痛，可是當抬起或低下頭部時，都會因為脖子的移動而導致背部、肋骨、脊椎附近的肌肉酸痛。我平常會有長時間坐於桌前辦公的情形，但不確定是睡眠姿勢不良，或是日間的久坐影響較大。想請問醫師此類情況較有可能跟哪一種身體狀況或平日的生活習慣較有關係，應該如何緩解，還有確切可能需要到哪一個診室類別看醫生。謝謝醫師！", "large": [], "small": [], "tier3": []}, {"no": "2329b567", "user": "班尼先生", "q": "提問(2025/02/06)：我在2023年10月打球灌籃時摔傷導致左手肘橈骨頭(Radialhead)和橈骨頸(Neck)骨折，於2023/10/4進行手術並使用自費骨釘，術後我也十分配合復健。在2024/10/15回診時，醫生表示我恢復狀況良好，可以考慮拆除骨釘。不過目前我在長時間工作打字時，左手肘會有痠脹感，同時也影響到肩膀造成代償性痠痛。醫生有提到如果拆骨釘時碰到神經，手肘可能會有點難舉起來（但機率低）。考慮到我使用的是自費骨釘，想請問拆除骨釘後，我的症狀是否有機會改善？還是可能會更嚴重？", "large": [], "small": [], "tier3": []}, {"no": "7f37c251", "user": "沈先生", "q": "醫師您好，背痛問題請教我這兩三年有背痛的問題，尤其在最近幾個月天天都在疼痛，主要在中背到上背的區域，就像是痛在胸椎裡面，躺在床上或坐在有椅背靠的椅子或沙發就可以有一些緩解。本月到大醫院腦神經外科求診，照了X光醫生說我的背部骨頭脊椎一切正常很好，只開了點止痛藥跟放鬆藥給我，並囑咐後續做物理治療。請問我需要到骨科求診嗎？不知道是不是脊椎有發炎的關係，或是心臟等器官轉移到背部的問題？因為物理治療電療熱敷過去也曾做過，只是沒什麼效果，也想問看看注射治療是不是更有效果。謝謝", "large": [], "small": [], "tier3": []}, {"no": "4ee15fd7", "user": "sharon", "q": "醫生您好：家父75歲，在1/23騎車跌倒造成右邊大腿髖關節骨折+胸骨也右邊也骨裂456根，但因急診的當下發現他有肺炎問題必須先處理才能處理骨折，故在2/5感染科醫生認為穩定並會診骨科醫生評估，骨科醫生評估家父覺得發炎指數還是太高（發炎指數11）+肺炎並未完全好，所以告知家屬若強行開刀會有很大風險（可能感染問題）說要等發炎指數到5以下才行開刀，當天下午感染科醫生就問我們要不要轉院？！（也不願意為家屬再會診其他骨科的意見，說是因為醫師倫理，如果為我們去詢問其他骨科醫生，等於打了第一位骨科醫生的臉）想請問醫生：1.一定要發炎指數五以下才能開刀嗎？2.目前肺炎問題已經好了大半，是否可以要求醫生若後續開刀處理，只要針對要開刀的那條腿來麻醉即可？3.大腿髖骨移位，是否只有換髖關節一條路？不能只是固定好即可嗎？（若只能換髖關節，請問有建議的材質嗎？）感恩醫生的回覆，祝福平安順心", "large": [], "small": [], "tier3": []}, {"no": "58ad9688", "user": "motoray", "q": "因意外致右側股骨頸粉碎性骨折、轉子間骨折有移位，開放式復位及內固定手術，股骨頸有補骨粉，等待癒合中，對於創傷性股骨缺血性壞死的擔憂，欲請教院長：1.股骨頸粉碎性骨折有補骨粉，日後有創傷性股骨頸缺血性壞死機率高嗎？2.對於股骨頸缺血性壞死需注意些什麼來預防?多運動有幫助血液循環嗎？3.需多久才能確定股骨頸血流循環正常？謝謝您", "large": [], "small": [], "tier3": []}, {"no": "df341a68", "user": "呂先生", "q": "醫師您好，想要向您請教我在24年8/28發生車禍造成大腿骨骨折，至今已經即將滿6個月了想詢問幾個問題1.為什麼到現在我的膝蓋後面的筋還是會覺得緊繃以及些許的疼痛這是正常的嗎？2.有看到許多人提問放掉拐杖後會一拐一拐的走路，目前我還沒放拐杖有什麼運動是能夠提升我的肌耐力並且不傷到骨頭的呢？3.平時有在吃鈣片、喝高蛋白飲食也都有多攝取營養，但回診時醫生都說我恢復的沒有很快，會是什麼原因呢？提出了三個問題，再麻煩醫師回覆了", "large": [], "small": [], "tier3": []}, {"no": "6d90e8cc", "user": "芬", "q": "請問醫師，我的媽媽今年71歲，於去年11月22日先開了雙膝全人工關節置換手術，術後復原情況很順利，但是12/18於家中上廁所時因未使用輔助杖起身，導致當下聽到左膝有啪啪的聲音後軟腳，隔天回診檢查發現是髕骨骨折，橫斷為上下兩塊，緊急於12/20開刀做內固定手術，但在術後一個月回診照X光時發現上方髕骨位移了，不在正確位置，但是媽媽是沒有任何疼痛及不適感，主治醫生告知往後如果不影響走路及凹角度的情形是可以不用再次開刀，說那塊髕骨就是影響外觀凸出，但是我有疑問是那往上移的髕骨還會再往上跑嗎，下方那塊髕骨就在那個位置是可以的嗎?", "large": [], "small": [], "tier3": []}, {"no": "72de8d87", "user": "yuan", "q": "2023/2月份因車禍導致左手食指第三節骨折,開刀自費鋼板2024/2月份拆除鋼板,持續復健有照過X光,骨頭恢復良好但是有一個問題是,當我手指彎曲時,我的食指會靠近中指,微微彎曲功能算是正常,但是有一種不舒適感看過針灸說我上方肌肉太緊繃導致看過骨科說當初骨頭復位旋轉角度偏1~5度請問還有甚麼方法可以矯正嗎?我才30歲,不希望困擾我一輩子...", "large": [], "small": [], "tier3": []}, {"no": "a22d28c5", "user": "華仔", "q": "醫師:您好我經過MRI檢查之後,有椎弓解離合併椎間盤突出病症.我諮詢過的醫師,它們的建議如下:1.A醫師建議我先做\"硬脊膜外注射神經阻斷術\"若效果不好,再加做\"高頻熱凝療法\".2.B醫師建議我直接在椎間盤注入PRP+神經阻斷術我的疑問如下:1.若椎間盤突出是由椎弓解離所引起,而沒有對椎弓解離進行治療,這樣是否為治標而不治本呢?因聽起來以上兩種治療都是針對神經做處理.2.上述A.B醫師的治療意見,您會比較建議採用哪位呢?哪種安全又有效呢?且聽說若直接在椎間盤注射PRP,會有感染的問題。若日後椎弓不穩定,會再引起腰部,大腿,小腿,及腳底,痠痛麻的症狀嗎?麻煩醫師解惑了....非常感謝", "large": [], "small": [], "tier3": []}, {"no": "0b0602ed", "user": "阿妹", "q": "之前出車禍骨折有打鋼釘跟鋼板，想詢問鋼釘跟鋼板取出的費用以及恢復期股骨幹裝鈦合金髓內釘恢復期跟費用？近端脛骨鈦合金鎖定式鋼板、迷你型鎖定式鋼板恢復期跟費用？膝蓋外側關節支持帶破裂恢復期？", "large": [], "small": [], "tier3": []}, {"no": "a15bbb09", "user": "小陳", "q": "醫生您好，我今年26歲，之前因為車禍髖骨骨折，有在髖骨裝了骨板和大腿裝了兩個骨釘，已經過了快兩年我是想骨板骨釘都拿出來，但上次醫生說骨釘可以拿骨板就不建議拿因為裝的比較深可能會用到神經並且拿出來可能會造成骨壞死，但想到骨板不拆至少要待在體內40年加上今年不拆以後可能也沒時間和體力可以拆就覺得很猶豫。", "large": [], "small": [], "tier3": []}, {"no": "aa06b98a", "user": "妍妍", "q": "請問拇指外翻術後不小心碰到水,除了趕快擦藥更換紗布繃帶還需要怎麼處理,因為很怕會傷口感染", "large": [], "small": [], "tier3": []}, {"no": "0bb2929f", "user": "簡先生", "q": "醫師您好:因爬水塔樓梯不慎，從3公尺左右高度跌坐地上，經X光檢查，腰椎第一、四節有壓迫性骨折，第四節較嚴重，經測骨密達到標準，骨科醫生請我打骨泥，我怕失敗，不知如何決擇，該打骨泥或自然癒合較好，煩請醫師指點。", "large": [], "small": [], "tier3": []}, {"no": "4089e631", "user": "XC", "q": "醫生您好，我因右腳內側腓韌帶斷裂及腓骨粉碎性骨折有進行韌帶修復手術（使用羊膜）術後約20日左右，韌帶處在沒戴護具朝上時會傳來些微酸痛感，有點害怕是否韌帶又斷開或是二次受傷。請問這個酸痛感是否是因為韌帶受傷或是斷裂而產生？韌帶如果二次斷裂是否會有明顯的疼痛感而不是些微酸痛？此外術後執刀醫生說縫合手術是成功的，只是不能再讓韌帶二次斷裂，不然會韌帶可能就沒辦法恢復成原樣，請問醫生有什麼休養上的建議嗎？", "large": [], "small": [], "tier3": []}, {"no": "9d256608", "user": "陳先生", "q": "最近坐在椅子上腳容易發麻手靠在桌上手容易發麻頭往後靠在椅背上連後腦也容易發麻每次發麻都是揉一揉就好這是頸椎病嗎？", "large": [], "small": [], "tier3": []}, {"no": "ba1e875a", "user": "一個人", "q": "左側遠端肱骨骨折算是粉碎性骨折嗎？疾病分類S42412A左側肱骨單純性髁上移位性骨折未伴有課間閉鎖性骨折之初期照護處置名稱OPSD04Z/開放性左側肱骨頭復位術,使用內固器。手術名稱：開放性或閉鎖性肱骨粗隆或骨幹或踝部骨折,開放性復位術同一個開刀手術這些醫學名稱有什麼差別還有這都算是粉碎性骨折了嗎？在請問現在左肩膀脖子一直疼痛有照X光醫生說明退化嚴重撞擊後會提早退化或是老化嗎？", "large": [], "small": [], "tier3": []}, {"no": "f5a57353", "user": "Ting", "q": "我再1/4車禍股骨有骨折，有放髓內釘，有請教過主治醫生需要掛復健科科做復健嗎？主治醫生回答：再家練走路即可主治醫生在我未滿ㄧ個月就叫我可以練站，兩個月可以練走路，我這幾天走路走較遠，晚上大腿都會酸痛，請問正常嗎？另外真的不用看復健科復健嗎？我擔心長不好，而且我也不太明白腳走路要負重多少", "large": [], "small": [], "tier3": []}, {"no": "644d631e", "user": "佩甄", "q": "請問醫生車禍或造成左側遠端肱骨骨折外觀嚴重變形在急診時骨科解釋講了一很多的醫學名詞因為聽不太懂後來醫生簡單說左側遠端肱骨粉碎性骨折之後對方產險打來問動什麼手術身體狀況如何我也是說肱骨粉碎性骨折。前天骨科開診斷證明寫（左側遠端肱骨骨折）我想請問左側遠端肱骨骨折跟左側遠端肱骨粉碎性骨折在醫學名詞有差別嗎？還有經過嚴重撞擊會影響骨頭退化或是老化嗎？", "large": [], "small": [], "tier3": []}, {"no": "64ff2c76", "user": "Mandy", "q": "X光照如下受傷第一天https://imgur.com/vkLDekQ受傷兩個月https://imgur.com/ZtljdaU第五蹠骨骨折未開刀，目前是打了兩個月的石膏，要再等一個月才要拆石膏1.請問到時候拆完石膏，可直接踩地走路嗎？那時會有移位風險嗎？縫隙變大？2.請問目前骨頭都沒長是正常的嗎？大約多久會長呢", "large": [], "small": [], "tier3": []}, {"no": "74ccab7c", "user": "張先生", "q": "醫生您好，不好意思想請問一下。我之前都是側睡，往左側，睡了一段時間，肩膀有點壓到。後來想說應該改一下，睡在右側，往右側睡。結果十多天後，突然有一些狀況：刷牙或洗頭的時候，會覺得脖子後面、或是右邊的下顎、或是脖子的右側邊會好像 迣媩苳@聲，或是有彈一下。　如果左右轉頭，有時候會覺得脖子兩邊好像有小小聲的 迣媩苤A或是 衁瘓苳@聲。有先在住家附近的骨科和中醫診所看過。中醫是認為，因姿勢改變，身體出現調整的情況，有針灸，當下還不錯，後來就還好。　有看西醫，醫生認為是有點輕微退化，有開藥、並有電療、熱敷、拉脖子。也是當下還不錯，但是後來好像還是會有。因為和原本不大一樣，我也不大懂，有點擔心。想請教醫生：　這個脖子的喀喀或是彈一下，到底是甚麼問題呢？　是網路上所謂的椎間盤的問題嗎？這個狀況有可能治好康復嗎？　還是說只能做到避免惡化？此外，因為我有良性的甲狀腺結節，如果頸椎照X光片，是否會有影響呢？　還是要避免照呢？　不好意思想向您請教，謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "aa55b0c2", "user": "Bo", "q": "醫師您好，我113年12月9日的時候診斷出舟月韌帶及三角軟骨損傷，治療前的狀況是平常沒有動就很痛。之後去醫院打PRP到現在狀況是平常不會痛，轉手腕也不會痛，但是如果輕輕做手撐牆壁的動作活動度沒有另一隻手好而且會有點酸痛，因為工作很需要鍛鍊體能(重訓），希望能快點恢復。想請問是還沒復原需要繼續休息還是需要做復健治療呢？或是請教醫生有沒有建議幫助恢復的方法？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "0474f300", "user": "110", "q": "2020年因左腳髖骨缺血性骨頭壞死，所以到醫院開刀進行人工髖關節置換手術。從手術完到出院前拍的x光片，都證明手術成功，傷口也恢復良好。回家後開始半年靠著輔助器走路，慢慢的讓左腳支撐自己的體重，髖骨決不能低於自己的膝蓋，睡覺時兩腳中間也要夾著與肩膀同寛的枕頭以防關節變形。就這樣復健了一年擺脫了輔具。但是，2022年，發現右腳髖骨抽痛，經檢查後確定右腳也是因為缺血性造成骨頭壞死。立即安排開刀手術。一樣的手術成功，傷口恢復良好。又回到家經歷了一年的復健之路。 狳S注意到，專注在右腳的復健及恢復，卻忽略左腳關節也是假的。造成現在雙腳雖然都是假的髖骨，但是走路起來就很明顯的左低右高，雙腳長一樣，但是看起來就像長短腳。現在右腳髖關骨能單獨站立，坐著，躺著都能抬腿。但是左腳在使用時，只要出一點力量的話不管坐著，躺著，髖關骨會感覺很緊，也會痛。坐著左腳無法抬高翹腳，開車時右腳進門，左腳要收腳關車門時，左腳關節會痛，需要更大力氣才能把左腳跨進來。當運動時，雙腳輪流相互抬高，雙手要在腳下拍手時，連貫性的手腳運動，左腳很吃力，吃力到痛然後爆汗！身體也會往左傾斜。是左腳髖骨凹陷嗎？還是復健後缺乏運動？現在 var ann = {};
var currentIdx = null;
var filterMode = 'all';
var searchQuery = '';

// START FROM RECORD 267 (index 266)
var START_IDX = 266;

var STORAGE_KEY = 'ann_202502';
var LAST_KEY = 'ann_202502_lastIdx';

try{ var _s=localStorage.getItem(STORAGE_KEY); if(_s) ann=JSON.parse(_s); }catch(e){}

function saveLastIdx(i){ try{ localStorage.setItem(LAST_KEY, String(i)); }catch(e){} }
function loadLastIdx(){ try{ var v=localStorage.getItem(LAST_KEY); return v!==null?parseInt(v):null; }catch(e){ return null; } }

function resumeAnnotation(){
  var last = loadLastIdx();
  var nextIdx;
  if(last === null){
    nextIdx = START_IDX; // default: start from 267th record
  } else {
    nextIdx = Math.min(last + 1, RECORDS.length - 1);
  }
  filterMode = 'all';
  searchQuery = '';
  selectRec(nextIdx);
  showToast('從第 ' + (nextIdx+1) + ' 筆繼續');
}

function getAnn(i){ return ann[i]||{large:[],small:[],tier3:[],undecided:false}; }

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(ann)); }catch(e){}
  updateProgress();
  var el=document.getElementById('saveInd');
  if(el){ el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); },1400); }
}

function isDone(i){ var a=getAnn(i); return a.undecided||(a.large&&a.large.length>0); }

function updateProgress(){
  var done=RECORDS.filter(function(_,i){ return isDone(i); }).length;
  document.getElementById('progBar').style.width=(done/RECORDS.length*100)+'%';
  document.getElementById('progText').textContent=done+' / '+RECORDS.length;
}

function getFiltered(){
  var q=searchQuery.trim().toLowerCase();
  return RECORDS.map(function(r,i){ return {r:r,i:i}; }).filter(function(x){
    if(filterMode==='done'&&!isDone(x.i)) return false;
    if(filterMode==='todo'&&isDone(x.i)) return false;
    if(q) return x.r.no.toLowerCase().indexOf(q)>=0||x.r.q.toLowerCase().indexOf(q)>=0;
    return true;
  });
}

function setFilter(f,btn){
  filterMode=f;
  document.querySelectorAll('.flt').forEach(function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  if(currentIdx===null) showList();
}

// SEARCH
function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchBox').style.display='flex';
  setTimeout(function(){ document.getElementById('searchInput').focus(); },100);
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('show');
  document.getElementById('searchBox').style.display='none';
  if(!searchQuery && currentIdx!==null) renderContent(currentIdx);
  else if(!searchQuery) showList();
}
function onSearchInput(){
  searchQuery = document.getElementById('searchInput').value;
  if(searchQuery){ currentIdx=null; showList(); closeSearch(); }
}

// MENU
function showMenu(){ document.getElementById('menuModal').classList.add('show'); }
function closeMenu(){ document.getElementById('menuModal').classList.remove('show'); }

function showList(){
  document.getElementById('navBar').style.display='none';
  currentIdx=null;
  var list=getFiltered();
  if(!list.length){
    document.getElementById('content').innerHTML='<div class="empty-msg">找不到符合的題目</div>';
    return;
  }
  var html='<div class="filter-row">'
    +['all','todo','done'].map(function(f,i){ var labels=['全部','未標','已標']; return '<button class="flt'+(filterMode===f?' on':'')+'" onclick="setFilter(\''+f+'\',this)">'+labels[i]+'</button>'; }).join('')
    +'</div>'
    +'<div class="list-hd">共 '+list.length+' 筆，點擊開始標註</div>';
  html+=list.map(function(x){
    var a=getAnn(x.i);
    var labels=a.undecided?'待討論':(a.large&&a.large.length?a.large.join('・'):'');
    return '<div class="result-item" data-fn="sel" data-idx="'+x.i+'">'
      +'<div class="result-no">No. '+escH(x.r.no)+' &nbsp;·&nbsp; 第 '+(x.i+1)+' 筆</div>'
      +'<div class="result-preview">'+escH(x.r.q.slice(0,100))+'</div>'
      +(labels?'<div class="result-labels">'+escH(labels)+'</div>':'')
      +'</div>';
  }).join('');
  document.getElementById('content').innerHTML=html;
}

function selectRec(idx){
  currentIdx=idx;
  saveLastIdx(idx);
  searchQuery='';
  renderContent(idx);
}

function escH(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderContent(idx){
  var r=RECORDS[idx];
  var a=getAnn(idx);

  // Update nav bar
  var navBar=document.getElementById('navBar');
  navBar.style.display='flex';
  document.getElementById('prevBtn').disabled=(idx===0);
  document.getElementById('nextBtn').disabled=(idx===RECORDS.length-1);
  document.getElementById('navCenter').textContent=(idx+1)+'/'+RECORDS.length;

  // Stats
  var statsHtml='<div class="stats-row">'
    +'<div class="stat-pill">No. <b>'+escH(r.no)+'</b></div>'
    +(a.undecided?'<div class="stat-pill" style="background:#fef9f0;border-color:#e67e22;color:#c05a00">待討論</div>':'')
    +(!a.undecided&&a.large&&a.large.length?'<div class="stat-pill" style="background:#e8f4e0;border-color:#80b860;color:#2a6010">已標 ✓</div>':'')
    +'</div>';

  // Q card
  var qHtml='<div class="q-card">'
    +'<div class="q-card-hd"><span class="q-no">No. '+escH(r.no)+'</span>'+(r.user?'<span class="q-user">· '+escH(r.user)+'</span>':'')+'</div>'
    +'<div class="q-text">'+escH(r.q)+'</div>'
    +'</div>';

  // Label card
  var labelHtml='<div class="label-card">'
    +'<div class="label-hd">標註標籤<span id="saveInd" class="save-ind">儲存 ✓</span></div>'
    +'<div class="label-body">';

  labelHtml+='<div class="l1-grid">';
  L1_LIST.forEach(function(l1){
    var sel=a.large&&a.large.indexOf(l1.name)>=0;
    var c=l1.color;
    labelHtml+='<div class="l1-btn" style="background:'+c.bg+';border-color:'+(sel?c.accent:c.num_bg)+';border-width:'+(sel?'2':'1')+'px"'
      +' data-fn="l1" data-name="'+escH(l1.name)+'" data-idx="'+idx+'">'
      +'<div class="l1-num" style="color:'+c.num_text+'">'+escH(l1.code)+'</div>'
      +'<div class="l1-name" style="color:'+c.num_text+'">'+escH(l1.name)+'</div>'
      +'</div>';
  });
  labelHtml+='</div>';

  if(a.large&&a.large.length){
    a.large.forEach(function(l1name){
      var l1=L1_LIST.filter(function(x){ return x.name===l1name; })[0];
      if(!l1) return;
      var c=l1.color;
      var l2list=getL2List(l1.code);
      labelHtml+='<div class="l2-section">'
        +'<div class="l2-hd" style="background:'+c.bg+';color:'+c.num_text+'">'+escH(l1.code+' '+l1name)+'</div>'
        +'<div class="l2-grid">';
      l2list.forEach(function(l2){
        var sel2=a.small&&a.small.indexOf(l2.name)>=0;
        labelHtml+='<button class="l2-btn" style="'+(sel2?'background:'+c.bg+';border-color:'+c.accent+';color:'+c.accent+';font-weight:600':'')+'"'
          +' data-fn="l2" data-name="'+escH(l2.name)+'" data-l1="'+escH(l1.code)+'" data-idx="'+idx+'">'
          +escH(l2.code+' '+l2.name)+'</button>';
      });
      labelHtml+='</div>';
      l2list.forEach(function(l2){
        if(!(a.small&&a.small.indexOf(l2.name)>=0&&l2.t3&&l2.t3.length)) return;
        labelHtml+='<div class="l3-wrap"><div class="l3-label">'+escH(l2.code+' '+l2.name)+'・第三層（選填）</div><div class="l3-grid">';
        l2.t3.forEach(function(t3name){
          var sel3=a.tier3&&a.tier3.indexOf(t3name)>=0;
          labelHtml+='<button class="l3-btn" style="'+(sel3?'background:'+c.t3_bg+';border-color:'+c.accent+';color:'+c.t3_text+';font-weight:600':'')+'"'
            +' data-fn="l3" data-name="'+escH(t3name)+'" data-idx="'+idx+'">'+escH(t3name)+'</button>';
        });
        labelHtml+='</div></div>';
      });
      labelHtml+='</div>';
    });
  }

  labelHtml+='<div class="undecided-row"><button class="undecided-btn'+(a.undecided?' on':'')+'"'
    +' data-fn="und" data-idx="'+idx+'">'
    +(a.undecided?'✓ 已標記為「待討論」':'⚑  不確定，標記為「待討論」')
    +'</button></div>';
  labelHtml+='</div></div>';

  document.getElementById('content').innerHTML=statsHtml+qHtml+labelHtml;
  document.getElementById('content').scrollTop=0;
}

// Delegated click handler
document.getElementById('content').addEventListener('click',function(e){
  var el=e.target.closest('[data-fn]');
  if(!el) return;
  var fn=el.dataset.fn;
  var idx=parseInt(el.dataset.idx);
  if(fn==='l1') toggleL1(idx,el.dataset.name);
  else if(fn==='l2') toggleL2(idx,el.dataset.name,el.dataset.l1);
  else if(fn==='l3') toggleL3(idx,el.dataset.name);
  else if(fn==='und') toggleUndecided(idx);
  else if(fn==='sel') selectRec(parseInt(el.dataset.idx));
});

function toggleL1(idx,name){
  var a=JSON.parse(JSON.stringify(getAnn(idx)));
  a.undecided=false;
  var pos=a.large.indexOf(name);
  if(pos>=0){
    a.large.splice(pos,1);
    var l1=L1_LIST.filter(function(x){ return x.name===name; })[0];
    if(l1){
      var l2names=Object.values(l1.subs).map(function(s){ return s.name; });
      a.small=a.small.filter(function(s){ return l2names.indexOf(s)<0; });
      var t3all=[];
      Object.values(l1.subs).forEach(function(s){ t3all=t3all.concat(s.t3); });
      a.tier3=a.tier3.filter(function(t){ return t3all.indexOf(t)<0; });
    }
  } else { a.large.push(name); }
  ann[idx]=a; save(); renderContent(idx);
}

function toggleL2(idx,name,l1code){
  var a=JSON.parse(JSON.stringify(getAnn(idx)));
  var pos=a.small.indexOf(name);
  if(pos>=0){
    a.small.splice(pos,1);
    var sub=TX[l1code]&&TX[l1code].subs;
    if(sub){ var t3=[]; Object.keys(sub).forEach(function(k){ if(sub[k].name===name) t3=sub[k].t3; }); a.tier3=a.tier3.filter(function(t){ return t3.indexOf(t)<0; }); }
  } else { a.small.push(name); }
  ann[idx]=a; save(); renderContent(idx);
}

function toggleL3(idx,name){
  var a=JSON.parse(JSON.stringify(getAnn(idx)));
  var pos=a.tier3.indexOf(name);
  if(pos>=0) a.tier3.splice(pos,1); else a.tier3.push(name);
  ann[idx]=a; save(); renderContent(idx);
}

function toggleUndecided(idx){
  var a=JSON.parse(JSON.stringify(getAnn(idx)));
  a.undecided=!a.undecided;
  if(a.undecided){ a.large=[]; a.small=[]; a.tier3=[]; }
  ann[idx]=a; save(); renderContent(idx);
}

function navPrev(){ if(currentIdx>0) selectRec(currentIdx-1); }
function navNext(){ if(currentIdx<RECORDS.length-1) selectRec(currentIdx+1); }
function backToList(){ currentIdx=null; showList(); }

// SWIPE support
var touchStartX=0, touchStartY=0;
document.getElementById('content').addEventListener('touchstart',function(e){
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});
document.getElementById('content').addEventListener('touchend',function(e){
  if(currentIdx===null) return;
  var dx=e.changedTouches[0].clientX-touchStartX;
  var dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(dx<0) navNext();
    else navPrev();
  }
},{passive:true});

// Keyboard support
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'&&currentIdx!==null) navNext();
  if(e.key==='ArrowLeft'&&currentIdx!==null) navPrev();
});

function triggerLoad(){ document.getElementById('loadFile').click(); }

function loadProgress(ev){
  var file=ev.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var loaded=JSON.parse(e.target.result);
      var imported={};
      if(Array.isArray(loaded.data)){
        loaded.data.forEach(function(item){
          var idx=RECORDS.findIndex(function(r){ return r.no===item.no; });
          if(idx>=0) imported[idx]={large:item.large||[],small:item.small||[],tier3:item.tier3||[],undecided:item.undecided||false};
        });
      } else { imported=loaded; }
      var count=Object.keys(imported).filter(function(k){ var a=imported[k]; return a.undecided||(a.large&&a.large.length>0); }).length;
      Object.assign(ann,imported);
      save(); updateProgress();
      if(currentIdx!==null) renderContent(currentIdx); else showList();
      showToast('已載入 '+count+' 筆進度 ✓');
    }catch(err){ showToast('載入失敗：格式不正確',true); }
    ev.target.value='';
  };
  reader.readAsText(file,'utf-8');
}

function showExport(){
  var done=RECORDS.filter(function(_,i){ return isDone(i); }).length;
  document.getElementById('expNum').textContent=done;
  document.getElementById('expSub').textContent='筆已標註（共 '+RECORDS.length+' 筆）';
  document.getElementById('exportModal').classList.add('show');
}
function closeExport(){ document.getElementById('exportModal').classList.remove('show'); }
function doExport(){
  var out={meta:{exported_at:new Date().toISOString(),total:RECORDS.length,
    annotated:RECORDS.filter(function(_,i){ return isDone(i); }).length},
    data:RECORDS.map(function(r,i){ var a=getAnn(i); return {no:r.no,user:r.user,q:r.q,large:a.large,small:a.small,tier3:a.tier3,undecided:a.undecided}; })};
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='202502_標註結果_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); closeExport();
}

function showToast(msg,isError){
  var t=document.getElementById('_toast');
  if(!t){ t=document.createElement('div'); t.id='_toast';
    t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transition:opacity .3s;font-family:inherit;white-space:nowrap';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.background=isError?'#c0392b':'#1a1a18'; t.style.color='#fff'; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity='0'; },2400);
}

updateProgress();
</script>
