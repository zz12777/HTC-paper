<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>202502 標註工具（手機版）</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--card:#fff;--border:#e2dfd8;--text:#1a1a18;--muted:#6b6960;
  --soft:#f0eeea;--r:10px;--shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans TC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}

/* TOP BAR */
.topbar{background:#1a1a18;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:100}
.topbar-title{font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.prog-wrap{flex:1;min-width:0}
.prog-outer{height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-bottom:2px}
.prog-inner{height:100%;background:#a0d080;border-radius:2px;transition:width .3s}
.prog-text{font-size:10px;color:rgba(255,255,255,.6);white-space:nowrap}
.topbar-btns{display:flex;gap:5px;flex-shrink:0}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-family:inherit;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.tbtn:active{background:rgba(255,255,255,.25)}
.tbtn.green{background:rgba(160,208,128,.25);border-color:rgba(160,208,128,.5)}

/* MAIN LAYOUT */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* SCROLL AREA */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 4px}

/* NAVIGATION BAR at bottom */
.nav-bar{background:#fff;border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-btn{flex:1;padding:12px 6px;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);text-align:center;touch-action:manipulation}
.nav-btn:active{background:var(--bg)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.pri{background:#1a1a18;color:#fff;border-color:#1a1a18}
.nav-btn.pri:active{background:#333}
.nav-center{font-size:11px;color:var(--muted);text-align:center;min-width:48px;flex-shrink:0}

/* STATS */
.stats-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.stat-pill{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.stat-pill b{color:var(--text);font-weight:600}

/* Q CARD */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
.q-card-hd{padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-no{font-size:11px;font-weight:600;color:var(--muted)}
.q-user{font-size:11px;color:var(--muted)}
.q-text{font-size:14px;line-height:1.85;color:var(--text);max-height:220px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;padding:12px 13px;-webkit-overflow-scrolling:touch}

/* LABEL CARD */
.label-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
.label-hd{padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.label-body{padding:12px 13px}

/* L1 grid - 2 col on mobile */
.l1-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.l1-btn{padding:12px 8px;border-radius:9px;border:2px solid transparent;cursor:pointer;text-align:center;transition:all .1s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.l1-btn:active{opacity:.75}
.l1-num{font-size:11px;font-weight:700;margin-bottom:2px;pointer-events:none}
.l1-name{font-size:13px;font-weight:600;line-height:1.3;pointer-events:none}

/* L2 */
.l2-section{margin-bottom:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.l2-hd{padding:8px 13px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border)}
.l2-grid{padding:10px 11px;display:flex;flex-wrap:wrap;gap:7px}
.l2-btn{font-size:13px;padding:8px 14px;border-radius:18px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;transition:all .1s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.l2-btn:active{opacity:.75}

/* L3 */
.l3-wrap{padding:8px 11px 12px;border-top:1px solid var(--border);background:rgba(0,0,0,.015)}
.l3-label{font-size:11px;color:var(--muted);margin:6px 0 7px;font-weight:500}
.l3-grid{display:flex;flex-wrap:wrap;gap:6px}
.l3-btn{font-size:12px;padding:6px 13px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .1s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.l3-btn:active{opacity:.75}

/* UNDECIDED */
.undecided-row{margin-top:12px}
.undecided-btn{width:100%;padding:13px;border:1px dashed var(--border);border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer;touch-action:manipulation}
.undecided-btn:active{background:var(--bg)}
.undecided-btn.on{border-color:#e67e22;color:#e67e22;background:#fef9f0}

/* SAVE IND */
.save-ind{font-size:11px;color:var(--muted);opacity:0;transition:opacity .3s}
.save-ind.show{opacity:1}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center;padding:0}
.modal-ov.show{display:flex}
.modal{background:var(--card);border-radius:16px 16px 0 0;padding:24px 20px 32px;width:100%;max-width:500px}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.modal-num{font-size:28px;font-weight:700;color:#1a1a18;margin-bottom:3px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);touch-action:manipulation}
.modal-btn.pri{background:#1a1a18;color:#fff;border-color:#1a1a18}

/* LIST VIEW */
.list-wrap{padding:0}
.list-hd{font-size:12px;color:var(--muted);margin-bottom:10px;padding:0 2px}
.result-item{padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;touch-action:manipulation}
.result-item:active{background:var(--soft)}
.result-no{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.result-preview{font-size:13px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-labels{font-size:11px;color:#4a5a8a;margin-top:5px}
.empty-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* SEARCH MODAL */
.search-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}
.search-overlay.show{display:block}
.search-box{position:fixed;top:0;left:0;right:0;background:#1a1a18;padding:12px 14px;z-index:151;display:flex;gap:8px;align-items:center}
.search-box input{flex:1;font-size:14px;padding:9px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-family:inherit;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.4)}
.search-cancel{color:rgba(255,255,255,.8);font-size:13px;padding:6px 4px;cursor:pointer;flex-shrink:0}

/* FILTER ROW */
.filter-row{display:flex;gap:6px;margin-bottom:10px}
.flt{font-size:12px;padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:inherit;touch-action:manipulation}
.flt.on{background:#1a1a18;color:#fff;border-color:#1a1a18}

/* TOAST */
#_toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transition:opacity .3s;font-family:inherit;white-space:nowrap}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">標註工具</div>
  <div class="prog-wrap">
    <div class="prog-outer"><div class="prog-inner" id="progBar" style="width:0%"></div></div>
    <div class="prog-text" id="progText">0 / 684</div>
  </div>
  <div class="topbar-btns">
    <button class="tbtn" onclick="openSearch()">🔍</button>
    <button class="tbtn green" onclick="resumeAnnotation()">▶ 繼續</button>
    <button class="tbtn" onclick="showMenu()">⋯</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="scroll-area" id="content">
    <div class="empty-msg">點「▶ 繼續」從第267筆開始標註</div>
  </div>
  
  <!-- NAV BAR (only visible when viewing a record) -->
  <div class="nav-bar" id="navBar" style="display:none">
    <button class="nav-btn" id="prevBtn" onclick="navPrev()">←</button>
    <div class="nav-center" id="navCenter">-</div>
    <button class="nav-btn" id="listBtn" onclick="backToList()">列表</button>
    <button class="nav-btn pri" id="nextBtn" onclick="navNext()">→</button>
  </div>
</div>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="searchOverlay" onclick="closeSearch()"></div>
<div class="search-box" id="searchBox" style="display:none">
  <input type="text" id="searchInput" placeholder="搜尋 No 或關鍵字…" oninput="onSearchInput()" autocomplete="off">
  <span class="search-cancel" onclick="closeSearch()">取消</span>
</div>

<!-- MENU MODAL -->
<div class="modal-ov" id="menuModal" onclick="closeMenu()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>選單</h3>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <button class="modal-btn" onclick="triggerLoad();closeMenu()" style="text-align:left;padding:13px">📂 載入進度 (JSON)</button>
      <button class="modal-btn" onclick="showExport();closeMenu()" style="text-align:left;padding:13px">💾 匯出 JSON</button>
      <button class="modal-btn" onclick="closeMenu()" style="text-align:left;padding:13px;color:var(--muted)">✕ 關閉</button>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-ov" id="exportModal">
  <div class="modal">
    <div class="modal-num" id="expNum">0</div>
    <div class="modal-sub" id="expSub"></div>
    <h3>匯出標註結果</h3>
    <p>下載含所有標籤的 JSON 檔，可在任何裝置重新載入。</p>
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeExport()">取消</button>
      <button class="modal-btn pri" onclick="doExport()">下載 JSON</button>
    </div>
  </div>
</div>

<input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadProgress(event)">

var RECORDS = [{"no": "39723ee0", "user": "謝小姐", "q": "醫生您好：我從小很常便秘（平時大概三、四天一次有過一週一次感覺自己腸胃不是太好）。20歲後我常常月經不調（咖啡色分泌物都會持續一兩週停不了，就紅血下不來），正常的時候大概三天紅血其他天就咖啡色，經期前後都會有咖啡色，去看婦產科說我有多囊性卵巢症候群，平常也很會掉頭髮，不知道是否因為我內分泌失調的關係，我發現這兩年我變得很容易長痣.......另外一年多前眼科說我有遺傳視網膜色素病變，我的眼睛現在有飛蚊症跟很容易畏光目前身體就是有以上問題之前有多次去看中醫調快半年多，都說我虛寒脈象很弱身體沒有能量說我不能吃冰的，吃冰對我來說好像很容易讓月經亂掉，說我也很容易疲勞，大多都說就是身體沒有能量才會導致我氣血不足。我其實有為了眼睛去針灸中醫師好像也說我沒有能量所以我的眼睛也就不好說我平時可以泡枸杞菊花茶來明目。我平時月經結束後都會喝四物飲大概喝一個禮拜但最近又亂掉了.....因之前有去看中醫調了很久去年就還好也許是最近我常熬夜就2-3點睡然後這麼容易就亂掉了（我這種體質是否不能熬夜？）請問平時我可以吃什麼來補充能量來解決氣血不足的問題，醫生想問是不是可以去中藥堂買水藥如四物湯來吃呢謝謝", "large": [], "small": [], "tier3": []}, {"no": "8bea7fa6", "user": "Rachel", "q": "醫生您好本人身高156cm體重45.5kg偏瘦,平常有在運動,飲食也有注意,但高密度膽固醇跟三酸甘油脂一直偏高,有吃西藥控制,但一停藥數值就又飆上去,吃藥吃了4年多,期間因為血糖上升醫生懷疑是藥物引起的副作用,所以醫生換過一次藥,現在吃的藥,又懷疑跟最近出現的左腿無力有關所以想詢問,如果改吃中藥壽美降脂一號,建議嗎?中藥壽美降脂一號,中醫給藥方式是否跟西醫一樣?(西醫看診一次給一個月的藥,然後開兩個月的長期處方箋,讓我自己到外面的藥房拿,三個月再回診,開藥方式相同,連同開立檢驗單)西醫給藥後,半年會驗血追蹤一次,檢查項目有,飯前血糖,血脂肪,血清麩胺酸丙酮酸轉氨,高,低,總膽固醇,肌酸酐中醫給藥後,也會半年追蹤檢查一次嗎?檢查項目有哪些呢?謝謝回答", "large": [], "small": [], "tier3": []}, {"no": "a8d4e326", "user": "呆呆獸", "q": "先感謝醫生願意耐心回答近日看到有影片宣稱：「將食指及無名指固定，中指往下勾俗稱勾中指，可治失眠相關問題，並冠以痛則不通，通則不痛等名號」自己試了幾次發現左手可正常勾中指下去，右指勾會痛，並可感覺到手臂內側有一條經在拉扯想問醫師該影片宣傳內容是否正確以及我的狀況是否正常", "large": [], "small": [], "tier3": []}, {"no": "f04d9145", "user": "陳先生", "q": "醫生您好，我最近嘴唇都腫腫的，舌苔白厚舌根還有裂紋，請問是為什麼，還有有什麼動作或是穴道按摩可以改善嗎", "large": [], "small": [], "tier3": []}, {"no": "75ec7bbf", "user": "光", "q": "我男生44歲前一天去油壓按摩隔天晚上洗完澡發現左側乳頭長了一個很像痘痘有白白的小凸起偶爾覺得癢癢按壓乳頭沒有特別覺得痛用手按壓乳暈乳房也還好後來第二天去一間有乳房外科的診所看醫師醫師說是乳頭阻塞發炎導致的先觀察就好不用緊張有幫我做乳房超音波都正常這星期那個突起變小了剩白白點點那喔我這個是不是就不是惡性的變化？", "large": [], "small": [], "tier3": []}, {"no": "5cd52357", "user": "小粉", "q": "請問我有一個0.6cm的甲狀腺結節,但是甲狀腺球蛋白抽血是15.8，TSH是1.35（這兩個抽血值好像都正常）請問有可能甲狀腺球蛋白和TSH抽血值是正常,但又長出一般正常良性的甲狀腺結節嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "d99d2322", "user": "匿名", "q": "幾年前已經發現的乳房纖維瘤變大了，在2020年，當時超音波顯示1.1cm，它因為比較高，邊界有點模糊，所以當時抽了粗針，是良性纖維瘤。然後，在2021年我又抽了一次粗針，也是說是良性纖維瘤。到2023年6月追蹤，大小一直維持1.1cm，醫師當時說穩定沒什麼變化。但直到今年2月再做超音波，它突然長到1.6cm。雖然醫師說可以6個月後再觀察，但我很擔心，我又沒有懷孕或是吃避孕藥，為什麼會突然變大了？", "large": [], "small": [], "tier3": []}, {"no": "750e9e92", "user": "Vince", "q": "寶寶目前7週，從月子中心出來後，晚上9點∼半夜1點之間經常哭鬧，幾乎每天都會發生，而且哭聲淒厲無法安撫，哭的時候雙腳狂踢，頭往後仰已確認喝過奶，尿布有更換，沒有發燒，寶寶喝配方奶加母奶，有換過配方奶和益生菌，也試過塗脹氣膏、騎腳踏車按摩，但都沒什麼改善白天活力很好，食慾也不錯，上網查感覺是腸絞痛症狀，但又不太確定，請問還有什麼解決方法嗎？會需要冒著感染病毒的風險到診所或醫院做進一步的檢查嗎？", "large": [], "small": [], "tier3": []}, {"no": "ac5a53b7", "user": "孩子的媽媽", "q": "醫生您好我女兒今年6月滿13歲（國一），目前身高已到168公分，月經還沒有來（最近幾個月已有分泌物），爸爸身高174公分，媽媽身高173公分，女兒從小一到小五平均每年長高5∼6公分，小五∼國一每年長高6∼7公分，長高速度比同齡高很多，而且從小ㄧ到現在右手或右腳會有成長痛（已排除是其他問題），請問這樣是正常的嗎？請問有什麼方法可以停止再長高，媽媽擔心長太高會很異類。", "large": [], "small": [], "tier3": []}, {"no": "34222866", "user": "0206", "q": "醫生你好本人之前感冒（1月的時候）好了，但是到現在喉嚨還是很痛和耳朵會痛，可是不會咳嗽，這要怎麼樣才會好", "large": [], "small": [], "tier3": []}, {"no": "cd23591b", "user": "Kevin", "q": "醫師好想請教小孩在3/1（滿四個月）時會接種第二劑五合一疫苗和第二劑口服輪狀病毒疫苗，如果想在4/1（滿五個月）前單獨接種第一劑腸病毒疫苗，大概什麼時間點接種比較安全適合？另外也想請問第一劑腸病毒疫苗可以同時跟卡介苗一起接種嗎？兩個問題再麻煩醫師解惑，非常感謝醫師", "large": [], "small": [], "tier3": []}, {"no": "2871ab68", "user": "擔心的人", "q": "醫師好，想請教有蠶豆症的小孩，從出生起接種各種健保給付的常規疫苗，有沒有哪一種是不能接種要避開的呢？另外也想請教腸病毒疫苗與口服輪狀病毒疫苗（不論廠牌），蠶豆症孩子可以安全接種嗎，謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "541d2d35", "user": "黃", "q": "您好，今年暑假要帶家中小孩去印度旅遊大約十幾天，請問小孩需要先打哪些預防的疫苗？小朋友年齡最小為2歲、最大11歲。謝謝", "large": [], "small": [], "tier3": []}, {"no": "113cedf6", "user": "筱", "q": "我想請問我的小孩目前一個月過10天一個禮拜前有看到大便有血的狀況那天有去打疫苗順便問醫生醫生說如果再有的話要回去回診但回家之後過一兩天又沒有後續都是大概過個兩三天會看到大便有血的情形但一天也就只會出現一次他目前是喝亞培的親護水解的奶粉了大便也都很軟幾乎天天都會大兩到三次左右這樣的狀況會是因為肛裂嗎還是其他原因", "large": [], "small": [], "tier3": []}, {"no": "ce57cfb4", "user": "小鐵", "q": "醫生您好\r我於113.07.20給性工作者服務，\r無套口交有套陰道交\r因理解感染性病的風險後對於上述的經歷深感後悔\r於是做了下列檢查\r113.10.12(第84天)Hivag/abcombo陰性0.05INDEX\r梅毒RPR與TPPA皆陰性\r114.01.20(第184天)Hivag/abcombo陰性0.22INDEX\r梅毒RPR與TPPA皆陰性\r期間內再無與他人性行為\r1.請問我可以排除Hiv與梅毒的感染了嗎?\r2.為何HIV的數值會有變化呢？我需要擔心嗎？\r3.另外我於113.04.15/113.06.18/113.10.18有施打HPV九價疫苗\r至今114.02.03（198天)至今觀察身體皮膚並無奇怪的疣狀物\r但因近期陰囊有搔癢的狀況\r通常是泡熱水澡或熱水沖洗時會癢起來\r要抓才會癢不抓就感覺還好\r有仔細觀察陰囊的皮膚\r有兩處紅紅的但無明顯突起\r我感覺是搔癢的中心\r請問這是菜花的感染嗎？", "large": [], "small": [], "tier3": []}, {"no": "4a51ae74", "user": "Zz", "q": "醫師您好，今天晚上使用公司的公共坐廁擦拭時發現衛生紙上有血跡，因為懷疑是生理期於是反覆擦了幾遍，有沒有使用有血跡的那面我有點忘記了，應該是沒有，後來確定不是經血就離開了，但是幾個小時後發現馬桶坐圈下有一整圈看上去是蓄意塗抹的血跡，想請問新鮮的血液碰觸到私密處有感染愛滋的疑慮嗎？目前非常的恐慌與暴怒。", "large": [], "small": [], "tier3": []}, {"no": "857f27b1", "user": "佳緯", "q": "小時候摔車時頭撞到水泥地到現在頭部仍然有一個腫塊在那未消感覺有點軟軟的請問醫師這個會對身體有影響或有什麼潛藏的風險嗎如果想把它清除應該看什麼科", "large": [], "small": [], "tier3": []}, {"no": "f11bcf01", "user": "jason", "q": "醫師您好請教您，我是個洗腎多年患者，最近因血磷飆高，造成副甲線指數居高不下，在醫師建議下進行副甲線全部切除，順便發現甲狀腺瘤，所以一併切除次甲狀腺。我的問題是我在手術前血壓都在150/90以上，手術後血壓卻變成100/70，變成容易掉壓，運動時變成體力差人容易疲勞1、請問您這是手術副作用嗎？可逆性嗎？日後身體能調整回來？2、醫師建議停本來吃的耐比洛血壓藥停掉，平均心跳74/分鐘跳高到85/分鐘，運動時容易喘，請問您這是剛停藥的關係？還是我不能停，以免心臟衰竭感謝您耐心回答", "large": [], "small": [], "tier3": []}, {"no": "369747e9", "user": "Kiki", "q": "醫生你好，我2天前在越南富國島去了海邊游泳，游泳當下覺得右手刺痛才發現有一個小傷口（因為我有富貴手所以常常手上會脫皮長小水泡）跟當天早上上廁所時後可以屁股有點擦破皮出血，後來看到一篇報導有關海洋弧菌我又有點擔心不知道我的傷口會不會感染，目前傷口沒有腫脹也沒有潰瘍（可是有脫皮跟紅紅的跟摸起來有一點硬皮感不會痛）也沒有發燒畏寒，想請問一下醫生，如果感染了海洋弧菌多久會發作？如果到目前都沒有症狀是不是可以排除被感染呢？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "61398366", "user": "Kiki", "q": "醫生你好，我2天前在越南富國島去了海邊游泳，游泳當下覺得右手刺痛才發現有一個小傷口（因為我有富貴手所以常常手上會脫皮長小水泡）跟當天早上上廁所時後可以屁股有點擦破皮出血，後來看到一篇報導有關海洋弧菌我又有點擔心不知道我的傷口會不會感染，目前傷口沒有腫脹也沒有潰瘍（可是有脫皮跟紅紅的跟摸起來有一點硬皮感不會痛）也沒有發燒畏寒，想請問一下醫生，如果感染了海洋弧菌多久會發作？如果到目前都沒有症狀是不是可以排除被感染呢？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "710ec3ed", "user": "陳", "q": "昨天（2/2）洗澡的時候鼻子不小心吸到水了，但是我有即時呼出，沒有嗆到。但是我之前在網路上看到一種會生活在溫水裡的「內格里阿米巴原蟲」，牠的感染途徑恰恰是透過鼻子的嗅覺神經感染，我怕我會因為吸到水而感染阿米巴腦膜炎，求醫生為我解惑「洗澡時鼻子吸到水會不會感染阿米巴腦膜炎」", "large": [], "small": [], "tier3": []}, {"no": "be0b81cc", "user": "陳陳", "q": "醫師您好:大概在去年8-9月，我發現家母在一些情境下會出現頭部搖晃(類似輕微點頭)的情形，但動作都不是很大第一次發現的時候是我們坐車時，家母的頭部未靠著椅背，所以出現此症狀，我當時以為是因為車子晃動造成，但後來看點頭的狀況比較不像是因為車子晃動造成；然後偶爾在家看電視的時，家母如果也是一般的坐著，頭一樣未靠在椅背上，就會出現一樣的狀況；另外還有煮菜時，看鍋中內的菜，也會出現此狀況；有時在專注聽別人說話的時候，也會出現類似症狀；以上是我目前發現家母發生此症狀的情境，除此症狀之外，沒有其他症狀或不適情形。因為我外婆本身有帕金森氏症，所以我有點擔心是否為一樣的疾病，因為家母沒有自覺自己有此情況發生，所以就醫檢查意願不高，所以才在此詢問，再麻煩醫師您了，謝謝！", "large": [], "small": [], "tier3": []}, {"no": "2c5a4417", "user": "匿名", "q": "醫師您好，日前搭乘飛機時我是坐在走道側，隔壁的乘客在將垃圾傳遞給空服員時將垃圾掉到我的褲子上，當下因為剛睡醒就徒手將垃圾撿起來丟進垃圾袋，也沒有仔細看是什麼東西，而後使用手機約3-5分鐘後才驚覺應該要去洗手。後來雖然也有將手機和褲子使用酒精噴灑，但心裡還是覺得怪怪的1.詢問醫師徒手抓垃圾的行為是否會有傳染疾病的風險。2.因為天氣乾燥，當下手上其實有一些裂開或是類似輕微灼傷的傷口，是否會有感染風險3.滑手機期間不確定身上物品是否有間接接觸，是否有必要全面進行清消（噴酒精）比較安全？", "large": [], "small": [], "tier3": []}, {"no": "56001680", "user": "Rachel", "q": "醫生您好我本人體重很輕(身高156cm,體重45.5kg),也有運動,飲食也有注意,但是低密度膽固醇跟三酸甘油脂一直超標,約四年前開始依醫生的建議吃藥控制.一開始醫生開給我Lipitor,一天兩顆,後來慢慢減藥到一天一顆,但血糖出現偏高(偏高但還沒超標)醫生怕是降血脂藥引起的,所以幫我換藥,換成必抑脂,一天半顆,慢慢減量到現在一天1/4顆必抑脂吃了約7個多月後,兩個月前左腳凌晨起床前偶爾出現無力感,後來連白天都那種無力感也偶爾會出現,有一次起床,單腳踩到左腳,竟完全無力支撐,趕快扶旁邊的牆請問這會是必抑脂的副作用嗎?謝謝回答", "large": [], "small": [], "tier3": []}, {"no": "666ab2bd", "user": "張小姐", "q": "醫生您好我沒有抽菸也很少下廚，平常會戴口罩，體重偏瘦，不知道從什麼時候開始，有時候右胸裡面，會突然性抽痛，不是表面皮膚是內部。因為抽痛的時間不固定，大概幾個禮拜或幾個月抽一次，也沒有其他症狀，平常不會痛，呼吸也沒有問題，可能走在路上突然毫無預警就一陣抽痛，大概幾十秒左右，之後又沒事了。不過最近這兩天突然抽痛頻繁，兩三天內抽了四五次，而且其中一次抽得比較痛也比較久，會想停下手上的事緩一緩的程度，也是抓不到規律性。因為我從小有便秘，也有一點胃食道逆流問題，但不確定是否是腸胃問題或體內濕氣重導致的？因為右側沒有其他灼熱或疼痛症狀。（也有長期濕疹）請問這一開始要掛神經內科還是骨科或肝膽腸胃科？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "9926a472", "user": "Tony", "q": "醫生你好！我今天早上十點在處理冷凍蝦子的時候被蝦子的尖刺刺到大拇指指甲，因為感覺被刺到後手很快速的抽回所以我不確定那時候尖刺有沒有斷掉插到指甲裡面的肉，被刺到一陣子之後指甲內部開始有出血但很少，傷口很小所以血塊被卡在指甲裡，用酒精消毒但酒精進不去傷口，我目測看了很久確定指甲表面沒有尖刺殘留，但不確定指甲下面的肉裡有沒有，目前沒有感覺腫脹、疼痛或是發熱的現象，但用力壓到還是有疼痛感，不過我怕因為傷口是在指甲內部所以感覺不到感染海洋弧菌的症狀，請問我該怎麼辦？要馬上去醫院打消炎藥或抗生素嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "fbc404f0", "user": "阿政", "q": "WBC20.75RBC4.78RDW16.3HB9HCT31.1MCV65.1血紅素量18.8血紅素濃28.9Plateletcount血571PDW9.4MPV9.1以上這些數值我會需要補鐵或者回到醫院在檢查嗎?", "large": [], "small": [], "tier3": []}, {"no": "09e8dea6", "user": "M", "q": "我是#415242的提問者，想再請教醫師幾個問題請問口腔潰瘍是不會導致傳染愛滋病的嗎?還是體液混入其他液體後就不具有傳染力?", "large": [], "small": [], "tier3": []}, {"no": "83211424", "user": "林", "q": "江主任您好我有些問題想與您聊聊我左邊眉毛有時候會抽蓄有時候會有時不會然後偶爾會偏頭痛從眼窩延伸到額頭到後頸一開始我以為是眼科的問題我跑了1.2家眼科檢查檢查結果都沒有眼睛方面的問題視神經眼壓都正常眼科醫師把問題診斷為疲勞偏頭痛方向起初我是有飛蚊症然後出現閃光型偏頭痛現在閃光症狀已經很少發生但是頭痛還是會有時候是額頭眼部那邊會酸有時候是後腦延伸有時候又會像緊箍咒一樣頭兩側很緊有時候痛起來會感覺到輕微噁心有時候是左側頭頂抽痛但是有時候又會緩解我已經搞不清楚到底是眼睛問題還是偏頭痛了所以想請教主任另外這跟天氣冷有關係嗎?!以前我是沒發生過自從去年11月初突然頭頂抽痛就開始這樣了", "large": [], "small": [], "tier3": []}, {"no": "87eb57e9", "user": "匿名", "q": "醫生您好我去年10月突然左下牙齒跟關節劇痛，臉部跟臉頰內側麻痺，後來吃了抗癲癇藥控制住，而且做了瞬眼反應檢查正常，醫生只說可能是神經某部分有問題，但不知道切確，而我目前還在吃抗癲癇慢簽，前陣子有因為有顆牙齒牙周病發炎到骨頭而又有點引發臉僵硬，所以後來神內醫生有多開的立舒定的慢簽，目前也好了，之後也多做了AwakeEEG(Hsinchu)檢查是正常的，但牙周治療要2/20，所以想問醫生我這不明神經問題跟牙周病的問題可以打流感疫苗嗎？因為不方便再請假掛神經內科的診，所以想請教您，謝謝您", "large": [], "small": [], "tier3": []}, {"no": "a282b04e", "user": "AJ", "q": "您好，我想請問如果只照X光，沒有聽診或是檢驗痰液，是否可以確定是何種肺炎呢？", "large": [], "small": [], "tier3": []}, {"no": "1b3a5d21", "user": "Candy", "q": "醫生您好我在今年1/17有做政府補助免費的低劑量肺部斷層掃瞄，（本人有抽菸，抽菸史有30年）最近收到報告，上面寫肺部結節小於6mm,建議：胸腔科門診追蹤。請問是否需要馬上掛號門診呢？因為是政府補助的，所以結節大小，位置，型態都不知道。想請問醫生您幾個問題：1.請問需要馬上去掛號嗎？2.請問如果現在去門診，醫生是否可以用健保卡看到我做的斷層報告呢？3.請問小於6mm的結節（不確定大小），也不知結節的型態為何？我有打電話去醫院衛教室詢問過，護士說1-2年在追蹤，但對方沒看過我的報告，這樣1-2年在追蹤，會距離太久嗎？4.請問政府補助的斷層，是不是醫生都評斷過沒有危險性，所以才可以1-2年在追蹤。5.我在網路上有看到好像很多人有3-5mm的結節就需要3-6個月追蹤，或直接處理治療，因為我不知道我的結節大小和型態，但又很擔心，我該不該掛號門診，或其實政府補助的斷層沒電話直接通知，而是報告寄來，就表示可能是良性的，只要1-2年追蹤就好，（衛教室跟我說，有問題的話，會直接電話通，沒問題就等報告寄來）那是否就代表其實只要定期追蹤就好。不好意思，問題很多，但也很緊張肺結節有沒有什麼大問題，才會詢問那麼多的事，感謝醫生抽空閱讀，謝謝。", "large": [], "small": [], "tier3": []}, {"no": "53548b1e", "user": "陳小姐", "q": "高醫師您好，不好意思又來向您諮詢關節發炎問題。先前有提到我在去年9月施打疫苗後多處關節開始疼痛僵硬的情況，先後在去年9月及今年1月至風濕免疫科抽血，但血液檢查皆是正常的（包括CRP、ESR、C3、C4及RF指數等）由於1月底膝蓋及腳背腫脹明顯，甚至沒穿護具無法正常行走，因此近日有再至其他醫院的風濕免疫科看診。該醫師建議我再做一次驗血，並安排X光檢查，由於檢查都只有在平日上午可以進行，礙於近日較難請假看診的關係，所以我是先服用了該醫師開立的Meloxicam藥錠來看看效果，發現在服用7.5mg的錠劑以後，大約會持續一天的時間關節不適及全身疲倦的症狀皆消失了。但當我停止服用後，關節症狀又漸漸回來，雖然疼痛感受並沒有惡化，但這幾天有症狀的關節數量也開始漸漸增加了（例如：原本只有手指、肘、腕、膝蓋、腳趾有症狀，但這週開始肩頸、尾椎、上下顎都會比較酸疼無力）想請教醫師：1.我的症狀發作以來，除了膝蓋及腳背以外腫脹都不是非常明顯（雖然有感覺多處關節緊緊卡卡的，但我自己肉眼看不太出來）加上我兩次血液檢查正常，有點困惑這樣做X光檢查會有效益嗎？因為在我的認知上，輕微的關節炎症使用超音波檢查會比較看得出來。2.若是建議做超音波檢查的話，我能夠自行向我的風濕免疫科醫師提出要求嗎？還是我能夠先就近在復健科診所做檢查，確定關節真的有問題再將報告帶回去風濕免疫科看診。（主要是擔心若關節其實沒發炎，又會花費太多時間跟資源在複雜的檢查上）3.我的血液檢查都正常，會不會只是我想太多了或許關節真的沒有炎症的發生，而是其他的問題？可是膝蓋卻真的有發生過幾次的腫脹，且服用Meloxicam消炎藥會有很明顯的改善反應。4.此外，這個月以來我發現多雙原本穿起來適中的鞋子，都會開始出現擠腳的現象（覺得鞋頭變緊變窄會磨腳、甚至破皮）而這種感覺通常在早上最明顯，中午或稍微步行一陣子後會緩解，雖然我真的看不出來腳趾是否有腫脹，但這個現象是否暗示腳趾可能有些許變化？5.未來抽血或是照射超音波時，是不是應該要挑關節真的有劇烈疼痛時、或是真的有明顯的腫脹再去做檢查，會比較能夠看出病灶？雖然我現在仍是每天都有多處關節感到不適。真的非常感謝醫師耐心的閱讀與建議，謝謝！", "large": [], "small": [], "tier3": []}, {"no": "c9f5808b", "user": "怕感染的人", "q": "請教醫師網上有關HHV-8的資料甚少多數只提及會造成卡波西式肉瘤之前看過一篇文章提到台人HHV-8陽性率約20%且唾液飛沫即可傳播因此想請教1:請問目前哪裡有醫院或是醫檢所有在執行HHV-8的檢測?2:健康正常人(非HIV患者非自體免疫疾病非器官移植患者)感染到皰疹八型會怎樣嗎?感染後是否到老年免疫下降時就會演變成卡波西式肉瘤?煩請醫師解惑", "large": [], "small": [], "tier3": []}, {"no": "ee03a6ad", "user": "藍月", "q": "醫生請問一下我有血糖5.7跟尿蛋白｀腎絲什麼的，一天要喝很多水，早上起來就一次喝完500cc的水這樣可以嗎", "large": [], "small": [], "tier3": []}, {"no": "f1cc120c", "user": "Chang", "q": "醫師您好：我的右顴骨有一塊紅斑，偶爾會發癢，顏色有時淺有時深紅，到中國醫和南投基督教醫院看過免疫風濕科，也都做過抽血檢查並未發現是紅斑性狼瘡（所有驗血項目都正常），請教醫師是否要到大醫院做切片檢查？此症狀已一年左右吃藥和擦藥也未見好轉?心裡很著急，感謝您的回覆！", "large": [], "small": [], "tier3": []}, {"no": "30557c02", "user": "JOSE", "q": "醫師您好,想請教您一般性病篩檢是否可以檢測出除了陰部以外的性病?如口腔性病.未曾有過任何不安全性行為,但有被舔舐背部,和對方接吻,已經做了性病檢測,但擔心若因接吻被傳染口腔性病會不會無法檢驗出來,是否還需做口腔性病檢查(採樣口腔黏膜)?感謝您撥冗回覆!", "large": [], "small": [], "tier3": []}, {"no": "51dfacbf", "user": "匿名", "q": "醫師您好，我的問題情況有點複雜，敘述如下，先感謝您的耐心。前情1：因為過度清潔加上最近冬天天氣比較乾燥，我的兩隻手（含小手臂）很多地方都脫皮乾裂了，常常會發癢、被我抓到滲血（還蠻嚴重的，幾乎可以說皮膚上密布著被我摳破過的乾裂傷）。前情2：昨天我因為身體很不舒服去一家醫院急診，醫生讓我抽血檢查，護理師於是讓我把小手臂放在抽血用的小檯面上，我當時沒想太多就直接捲起袖子把小手臂放上去了，抽完之後去等候區，因為要按壓止血，也是捲著袖子直接把小手臂擺在座椅扶手上。後來小手臂的乾裂處發癢我下意識抓了一下，才覺得有些不妙...擔憂1：那家醫院抽血時讓患者擺放手臂的小檯面是深色的，每個患者抽血時手臂都擺在同個位置，而我看不出它上面是不是有血跡（印象中應該沒有濕濕的），可因為是在急診，那裡真的超多患者、超多人在抽血，所以那個小檯面絕對沒有時間消毒（正常情況下大概也沒必要消毒？），反正我就是在上一個患者離開後直接把手臂擺上去抽血的；而在我剛到急診區時，我有看到護理師沾到其他患者的血，跑去匆匆洗手。所以我就感到非常擔憂：我之前抓破皮、滲過血的小手臂及手背上的傷口（當下不確定還有沒有在滲血，我出門去醫院的路上有半小時左右一定是沒抓癢的，所以它們可能有稍微凝結了？但也不一定，有的順著皮膚紋理的乾裂傷就算不去抓撓好像也會滲血）在那個小檯面上擺放移動時有整個蹭過去蹭過來，如果要是那個檯面沾到過其他患者的血，我會不會因此感染什麼血液傳播類的疾病，比如愛滋、梅毒、C肝或者其它呀？我現在有需要像醫護人員進行針扎處理那樣，趕快去做個檢查追蹤嗎？擔憂2：等候看診的座位區病人來來往往，好多人都有在做抽血後的按壓止血（有些人的血都滲到酒精棉最外層了，清晰可見），等到按壓得差不多，他們沾過血的手到處碰，說不定就有人摸到過座位扶手，而我帶著傷口的小手臂也蹭過了它...擔憂3：我小手臂發癢，下意識抓了下小手臂時，忘了我當時人在醫院手不乾淨，雖然我當時只抓了一下就醒悟過來停止了這行為，好像沒有嚴重摳破什麼，但畢竟也碰到了小手臂上的傷，這會不會也有造成感染的可能呀...擔憂4：護理師為我抽血時，有用酒精棉消毒我要被抽血的位置，但是消毒完後她用沒消毒過的手摸了摸我要被抽血的位置（大概在找靜脈？），然後就直接抽血了（我確定她接觸完上個病人後真的沒消毒手），這樣我會不會有感染風險呀？擔憂5：護理師用酒精棉壓住抽血後的傷口後，讓我按壓止血，我的手沒消毒，她說沒關係直接壓，但酒精棉濕濕的，我手上如果有細菌病毒會不會滲進去造成感染風險呀？從小到大都沒去過大醫院急診，沒想到場面如此忙碌，我有些問題都不敢現場問，就只好來這裡拜託醫師幫我解答。據說早檢查早用藥，就算被某些病感染，也問題不大，所以我想請問醫師，按我上述的這些情況，我需要趕快去做那些血液感染類疾病的檢查追蹤嗎？", "large": [], "small": [], "tier3": []}, {"no": "71097018", "user": "森森", "q": "醫生您好，近期我的右上眼皮時常跳動且頻率為偶爾發生一次（兩三週）但每次都會連續跳個1-2天，而且是整天都跳的那種剛好右眼皮小時候長血管瘤，長大以後有提眼肌無力的狀況，約兩年前有動過醫美提眼肌手術，近1年覺得手術效果失效又開始呈現提眼肌無力的狀況不知道這之間是否有關建議看哪種科別比較好", "large": [], "small": [], "tier3": []}, {"no": "7d86a69a", "user": "森森", "q": "醫生您好，近期我的右上眼皮時常跳動且頻率為偶爾發生一次（兩三週）但每次都會連續跳個1-2天，而且是整天都跳的那種剛好右眼皮小時候長血管瘤，長大以後有提眼肌無力的狀況，約兩年前有動過醫美提眼肌手術，近1年覺得手術效果失效又開始呈現提眼肌無力的狀況不知道這之間是否有關建議看哪種科別比較好", "large": [], "small": [], "tier3": []}, {"no": "80d7000c", "user": "匿名", "q": "廖醫師您好，先感謝您的耐心閱讀及回覆，我的問題如下：今天我去一家醫院急診，在左手臂抽血並吊點滴，印象中護理師只有戳一個針進去，後來抽血、連上點滴瓶加藥的操作都是透過那個針連通的管路，拆掉的時候也只有一個地方需要按壓止血。但我回家拆掉黏著酒精棉的膠布準備洗澡時，發現手臂偏中央的地方額外多了一個像是針戳出來的滲血孔，不確定是怎麼出現的，覺得有點慌。唯一確定的是，在我抽血前這個孔並不存在，因為我記得護理師摸我手臂（大概在找靜脈？）時，那邊的皮膚沒有任何傷口。護理師讓我按壓止血的針孔，位在大小手臂接線處的左側下方一段距離，附近是那種有抽過血的青色；而那個莫名多出的血孔在大小手臂的接線處，靠近中央的位置，附近皮膚很正常，洗完澡之後血孔顏色就淡了，看起來就是只被戳過一下的那種傷。我清楚記得護理師為我抽血時，戳了一次針就戳好了，所以這個多出的血孔不可能來自於抽血時她多戳了幾次；我在想它最有可能的是，最後護理師在拆掉我手臂上連接吊瓶的管路線以及那根針時不知怎麼戳傷了我（那時醫生在跟我講話，所以我沒有在看）。問題在於急診區患者很多，護理師很忙，在幫不同病人抽血、弄吊瓶管路線時手都沒有時間消毒，我親眼看見她在好多不同病人間連軸轉且未消毒手。我在想，如果她真的是不小心在拆掉管路及針時戳傷了我，若是戳傷我的是原本就扎在我手臂裡的那根針那還好，至少能確定是乾淨的（但我皮膚在被護理師碰過後，在被戳傷時沒消毒好像也有點可怕）；但若其實是管路線的其他部分在她拆的時候哪裡刺刺的刺傷了我，那就真的是沒消毒過的，且因為護理師手沒消毒的關係，完全有機率沾到過其他患者的血；之後我這個被戳到滲血的傷口，又在沒有消毒癒合的情況下，被粘了被護理師摸過的膠布條（護理師用來固定讓我按壓止血的酒精棉的膠布條很長，剛好有貼到多出的這個傷口的位置），膠布條中央可能是乾淨的，但正好黏在我傷口上的末端處就未必了...甚至護理師的手有沒有直接摸到我這個被戳到滲血的傷口我都不清楚...我有點擔憂，想請問醫師，這些情況，會不會造成什麼血液傳播疾病的感染風險呢？（比如愛滋、梅毒、BC肝...）畢竟那麼多病人在那邊抽血打針...另外我自己的手上有許多乾裂傷，在我去醫院時可能沒在滲血，但也沒有結痂，處於一種有點晶瑩的凝結狀態（有些傷口可能有小滲血）而這種傷口有接觸到急診抽血區讓患者擺放手的位置，以及護理師給我的東西等等，我在那些位置、那些東西上頭沒有看見明顯的血液，但後來想想，它們其實都有可能沾有少量的其他患者的血（因為病人接續不斷，護理師真的沒有時間消毒），想請問醫師，這會不會讓我有血液傳播疾病的感染風險呢？最後，我想起來護理師為我抽血時，用酒精棉消毒我的皮膚後，才用她未消毒的手摸我的皮膚找靜脈，然後就直接扎針了，這會造成風險嗎？以及她後來讓我按壓酒精棉止血時，我的手也沒消毒就按上去了，酒精棉是濕的，我手上如果髒髒會不會滲透呢？因為莫名多出了那個血孔，我變得很擔心，後來越想越窒息...上網查資料，據說72小時內投藥的話，連愛滋都可以預防，所以想拜託醫師評估一下，像我這種情況，有需要吃預防的藥嗎？或者有需要去做一個類似醫護人員針扎處理流程的抽血檢查嗎？（我其實不想去做這種檢查，現在想到又要去醫院抽血就眼前一黑，好怕去了又出現新疑慮.. , "large": [], "small": [], "tier3": []}, {"no": "7832080c", "user": "匿名", "q": "醫師您好，我想請問一下假如有人欲透過在食物裡頭添加愛滋病毒下毒，這樣有可能會感染HIV會得到愛滋病嗎？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "b3982cc5", "user": "阿葉", "q": "巫醫師你好，關於近期檢查結果有些問題想要詢問，以下為經過:身高:167公分，體重約:66~67公斤，有重量訓練習慣，血壓約12X~13X/7X~8X，無高蛋白飲食2021年時健康檢查發現肌酸酐數值為1.04，換算egfr約為86，為紅字，無尿蛋白。但因報告寫說低於90以下只要無合併尿蛋白就無大礙，故當時沒有特別在意。2024年8月再次健康檢查，肌酸酐數值1.1，換算egfr為79，無尿蛋白。因數值下降，當月有掛腎臟科就診，醫師表示egfr部分醫師自己說他們的醫院公式計算會比一般的還低，並且在我面前使用另一公式計算給我看，該公式有計入身高及體重。計算結果egfr為90分以上，醫師告知此數值看起來沒有問題，但與臨床經驗一般人相比較低，故建議半年追蹤，表示此時無須腎臟科介入治療，只說多喝水多運動。2025年1月再度回診追蹤，檢查結果肌酸酐數值1.2，無尿蛋白。醫師表示短時間下降太多建議一個月後安排超音波檢查，兩個月後再次抽血觀察數值。但這時我忘記跟醫師說明回診前幾天為感冒，有服用感冒藥及止咳噴霧成藥，故自己擔心是否為藥物影響。2025年1月底，因擔心是否為藥物影響，並且覺得等待2個月太久，所以決定距回診約2周時自行去檢驗所檢驗，順便額外檢查胱蛋白C，因本身有重量訓練，想了解肌酸酐數值偏高時否跟肌肉量有關，故加測。檢查結果肌酸酐數值降回1.1，胱蛋白C數值0.68。有上網查詢使用兩項數值來計算egfr的公式網站，估算結果egfr:114，此時想說那這樣腎臟應該就沒問題了，有稍微放心。2025年2月進行超音波檢查，醫師表示超音波顯示腎臟大小無異常，但內部質地有慢性的病變。因檢查醫師同時是上次回診的醫師，故告知自行至檢驗所檢查的結果，醫師表示肌酸酐有降回來是好事，但他還是覺得肌酸酐數值還是較同齡人略高，加上超音波結果也確實有慢性變化。結論他還是覺得我的腎臟較一般人差，建議半年定期追蹤。關於肌酸酐及胱蛋白C估算egfr的差異醫師無特別解釋。以上為檢查過程，不好意思稍長。接下來是我消化完資訊後當時來不及詢問醫師，後來產生的疑問。1.以慢性腎臟疾病的定義，請問我目前是否有符合?我知道egfr小於90要同時有腎臟實質損傷才算CKD，但使用肌酸酐計算egfr，跟使用胱蛋白C計算。一個好像符合定義(以院方的公式)，另一個egfr會大於90，會不符合定義。2.關於肌酸酐數值略高，是可以認為因肌肉量稍高導致的還是如超音波檢查是因慢性腎病便導致的?3.未來要追蹤腎臟功能也就是egfr，我是要使用肌酸酐估算，還是胱蛋白C進行估算會比較符合我的腎功能?以及關於肌酸酐及胱蛋白C估算egfr的差異為何會差那麼多?4.就算超音波表示腎臟有慢性問題，但是否只要egfr數值穩定不下降(以胱蛋白C估算egfr:114)，是否為腎功能正常?5.以巫醫師的觀點，我目前腎臟的狀態為何?是跟我就診醫師一樣是腎臟有慢性損傷，腎功能略差嗎?以及有任何建議?以上問題，不好意思內容有點多，再麻煩醫師解惑，感謝醫師。題外話，感覺我看診的醫師還是傾向以肌酸酐來評估腎功能，對於胱蛋白C好像比較不注重其估算結果。所以才未對兩項數值估算egfr有另外解釋。", "large": [], "small": [], "tier3": []}, {"no": "d571b44d", "user": "吳", "q": "請問醫師：1、我走路很慢，而且2/3000步就累了、2、行動很慢，很像中風或失智的人、也很像帕金氏症、尤其彎腰撿東。的時候3、沙發坐乆了、不容易站起來、即使。站起來、有幾秒鐘幾乎不能動。要走十幾步以後、才會正常如2、所述Ps:1,這些突然發生在一年多前、我因為做了內視鏡手術（右膝、縫補半月板）、一年多、一階樓梯都不能上2,我的脊椎一向不好、幾乎沒有間隙（看過骨科說不是僵直性脊椎炎）3，去過健身房、說我右膝需加強肌力訓練、但是半年下來、我覺得比以前還不靈活請問就以上所述、可能是哪裡有問題？", "large": [], "small": [], "tier3": []}, {"no": "cb0d1bc0", "user": "羅", "q": "醫師您好：我兩週前懷疑自己有乾燥症(sjogren's症候群）),後經風濕免疫科血液檢測,數值顯示確認我無乾燥症(Anti-SSA<0.3Andti-SSB<0.3),只有極輕微急性胰臟炎未伴有壞死或感染(igG4=212).但風濕免疫科醫師卻說還是需要藥物長期治療,於是開了共28日數的1)瘡寧膜衣錠200毫克;2)複方酵素的錠;3)愛克痰發泡顆粒600毫克我想諮詢醫師的是,這種檢查結果,我真的需要先服用甚至長期服用\"瘡寧膜衣錠200毫克\"這樣的藥物來抑制我的免疫系統嗎？感覺服用這樣與我的極輕微急性胰臟炎未伴有壞死或感染沒有相關性.感謝", "large": [], "small": [], "tier3": []}, {"no": "1a8daad1", "user": "Willy lee", "q": "您好，醫師我的腳汗流的很多，夏天時穿著拖鞋時，我的腳會從前面滑出去，冬天時，早上穿的襪直到下午感覺就變濕了，沖熱水or冰水可以暫時的緩解，這是什麼情況可以怎麼治療我的手也是", "large": [], "small": [], "tier3": []}, {"no": "bd41476a", "user": "Liean", "q": "醫生您好，今天帶小孩出門去咖啡廳吃飯，帶兒子去洗手的時候，沒注意到洗手台下面可能是放洗廁所的刷子跟夾子，兒子的鞋子不小心踢到夾廁所垃圾桶的夾子的感覺，雖然手應該是沒有去亂摸，想請教醫生，當下有趕快幫小孩洗手，並告知他以後不能亂摸那個是夾馬桶垃圾桶的東西不是玩具…想請問醫生兒子鞋子踢到夾子這樣有可能被傳染什麼疾病或是性病愛滋嗎…因為好不容易才有這個小孩真的很擔心也很自責。雖然老公說我太誇張了，沒有傷口而且病毒應該不太可能活在夾子上面，不知道是不是安撫我。所以希望醫生給予專業的建議，有需要帶小孩去小兒科抽血檢查嗎等等的嗎，不好意思打擾醫生了。謝謝醫生🙏", "large": [], "small": [], "tier3": []}, {"no": "0270c149", "user": "被餐廳洗碗機電到的員工", "q": "被洗碗機電到後身體各處不定時有電流感被電當時手衣服鞋子都是濕的昨天被電到今天還沒好有什麼方法解決或是要看醫生嗎", "large": [], "small": [], "tier3": []}, {"no": "0e0cecd4", "user": "Chein", "q": "去餐廳用餐，餐盤裡有一大盤生菜，吃到一半嘴巴有被吸住的感覺，吐出來發現疑似蛞蝓的一部分，其他部分不確定是不是吞到肚子裡了。請問是否需要去感染科檢查寄生蟲的風險，有沒有預防投藥可以處理這類情況？謝謝", "large": [], "small": [], "tier3": []}, {"no": "60f53ced", "user": "Helon", "q": "醫師你好，因為上禮拜四跟客人去吃飯，感覺他好像性經驗很豐富，我是坐在他旁邊，他講話又很大聲口水感覺都會噴到我的飲料…想請問醫生一般這樣會被傳染性病或是愛滋嗎…因為不知道為什麼昨天稍微感覺喉嚨會怪怪的痰也是有一點點黃黃的，量體溫是36度跟35.6，雖然問了在讀醫學的哥哥他說一般也不會馬上有症狀應該也是一兩周後，而且根本沒有這種傳播方式，他說我可能倒是被客人的飛沫傳染感冒機率很大，希望聽聽醫生的建議，謝謝。另外想請問醫生，我好像之前有打A肝炎疫苗，但是第二針忘了去打，隔了快要1年多還是兩年這樣還可以打第二針嗎，謝謝。", "large": [], "small": [], "tier3": []}, {"no": "f677a5b3", "user": "張照片", "q": "我昨天晚上因為太熱可能那個那種裡面裝冷凍液的冰塊然後我有漱口只吞到一點點或有什麼事嗎(誤食)", "large": [], "small": [], "tier3": []}, {"no": "25ebe034", "user": "Linda", "q": "請問醫師：舌頭常不自主的顫動、有長期服用普憂寧、克癲平及永康緒藥物、是哪種藥物的副作用嗎？", "large": [], "small": [], "tier3": []}, {"no": "b2921c2e", "user": "吳小姐", "q": "醫生您好近日覺得胸口疼痛、呼吸不順、會喘去醫院看胸腔內科顯示左肺有感染，醫生認為是感冒造成的可不需藥物治療，不過目前還是不太舒服，請問肺部感染是會自行痊癒的嗎?還是要吃抗生素比較好呢?如果不需藥物就能痊癒的話，大概要多久的時間呢？", "large": [], "small": [], "tier3": []}, {"no": "902d283e", "user": "匿名", "q": "醫師您好，我是問「假如有人欲透過在食物裡頭添加愛滋病毒下毒，這樣吃到的人，有可能會感染HIV，或得到愛滋病嗎？」問題的先生，你的回答是「不會喔!愛滋病毒離開人體數分鐘內就會死亡，而且要藉由體液或血液直接接觸才會傳染。口水裡是沒有愛滋病毒的，所以接吻本身不會傳染愛滋，更別說透過食物了。」，那我想續問，假如下毒的那個人就是加有愛滋病毒的血液或體液到食物裡，這樣吃的人會感染&得病嗎？謝謝醫師🙏", "large": [], "small": [], "tier3": []}, {"no": "a9960e2e", "user": "migraine", "q": "醫師您好，我本身以前大學就讀OT(職能治療)，有偏頭痛及長期的panicdisorder與焦慮症病史。前年於大醫院因頭痛及VisualAura的問題就診神經內科時有做過MRI，當時醫師只跟我說除了腦部有些小白點一切正常，因此可以當成偏頭痛治療。但是醫師有說他也不知道為何我這麼年輕腦袋會有小白點，當時醫師開給我的藥物是propranolol10mgTID還有欣坦膜衣錠，控制約八個月後狀況穩定，神內醫師將我的propranolol10mg改成BID。後來該神內主治醫師離職，而我因為偏頭痛與aura的發作均穩定，因此選擇就近尋找家醫科請她繼續開propranolol10mgBID給我控制，欣坦則因我的精神科醫師說可吃可不吃因此沒有繼續請家醫科醫師續開，目前頭痛狀況到現在都十分穩定。最近打開健保快易通查看當時的MRI結果後，發現報告當中有提到1.AfewhyperintensefocionFLAIRatbilateralcerebralwhitematter.2.Minimalleukoaraiosis.Noothersignificantorganiclesionisfoundinthisstudy.兩項，其餘皆正常。我有三個問題第一個問題，第一項應該就是以前我的主治醫師提到的小白點(WhiteMatterHyperintensity)，自行上網查詢一些資料與研究後發現這好像通常出現在無症狀的缺血性中風或腦血管病變(CSVD)的殘留痕跡，而出現在中老年人居多。但是也有查到相關文獻說偏頭痛患者與焦慮症／憂鬱症／恐慌症患者腦中的WhiteMatterHyperintensity有增加的趨勢。請問這是否表示WhiteMatterHyperintensity出現在年輕人是不正常的？這表示我曾經有過腦血管中風但沒有症狀？又或者是因為偏頭痛或恐慌症／焦慮症的影響？第二個問題，第二項我完全沒有聽我的神經內科醫師提到，請問從字面上來解釋，是表示我有腦白質疏鬆(leukoaraiosis)，只是程度輕微嗎？請問這是否也不應該是像我一樣的年輕人MRI應該會出現的finding？第三個問題是題外話，我也有看到有資料說有VisualAura的偏頭痛患者未來罹患CVA的機率會比一般人高，請問這是否也跟我的檢查結果有關？我適合繼續維持propranolol10mgBID來預防我的偏頭痛嗎？或者有無其他更積極的預防／治療方式？綜上所述，請問醫師建議我應該帶著我的MRI報告，另尋專門的神經內科醫師進行進一步的追蹤檢查嗎？不好意思麻煩醫師看這麼多字，由於是焦慮症患者的關係，會對自己身體的不舒服十分敏感，會去查閱許多資料胡思亂想。希望醫師能夠有空回答我的問題，十分感謝。敬祝順心平安", "large": [], "small": [], "tier3": []}, {"no": "cddebeb2", "user": "徐", "q": "醫師您好，前陣子因腹痛疲憊至醫院就診，檢查了腹部超音波，報告如下：Echo:Normalliversize,heterogeneousparenchyma,smoothsurface,normalvasculaturedistribution.Normalspleen.;asscore5.Noascites.Normalgallbladder.Normalbiliarytree.Patentportalvein.Patenthepaticveins.Nolivermass.Bothkidneysarenormalincontour.Pancreaticheadandbodyarenormalinthickness.Thepancreatictailisnotdemonstratedduetobowelair.Theretroperitonealstructureincludingaortaandextrahepaticportionofinferiorvenacavaisnotdemonstratedduetobowelair.Impression:Parenchymalliverdisease(score5).normalbiliarytrees 顯關節腫脹，免疫疾病指標檢查亦無異常。想請教醫師：1.這些症狀是否可能與神經系統相關？2.是否建議進一步至神經內科檢查？或仍應持續觀察？", "large": [], "small": [], "tier3": []}, {"no": "ab6660ca", "user": "Wen", "q": "醫生好，想請問因為不小心指甲剪比較短好像有一點點小傷口雖然沒流血，我在擦皮膚科醫生開給我的fisticacid藥的時候,不小心瓶子直接接觸到傷口…突然想到瓶子上如果有什麼奇怪的細菌或病毒，我會因此感染嗎例如愛滋或是什麼奇怪的細菌？想一想就覺得越來越恐慌，想請問醫生的看法的看法，謝謝。指甲圖片https://ibb.co/tPJw8C78", "large": [], "small": [], "tier3": []}, {"no": "af52486d", "user": "延", "q": "先生去年10月甲狀腺亢進,有在服藥治療,12月開始手指.手腕關節痛,痛到連綁塑膠袋都沒辦法並影響工作,後來轉診到風濕免疫科,第一次抽血的指數是ANA1:80X(+),SSA抗體106,CRP0.71,類風濕指數都正常,醫生有開類固醇跟滅殺除炎,目前關節不痛了,沒有眼睛乾跟口乾的症狀,醫生說比較像是乾燥症跟紅斑狼蒼,但症狀不明顯,所以無法確診是什麼疾病,目前已停吃類固醇,滅殺除的部分醫生說繼續服用,想請問醫生這是什麼病?,還有為什麼甲狀腺亢進沒多久又引發關節痛有相關嗎?滅殺除炎要吃多久?", "large": [], "small": [], "tier3": []}, {"no": "b644a7a2", "user": "霓", "q": "醫生您好，我目前正在服用幽門桿菌抗生素，包含：Ulicin500mg、Amoxicillin500mg兩顆、Bismuthsubcarbonate324、Pantyl40mg，早晚飯前。然後吃藥過程某天半夜醒來發現身體發抖（像畏寒那種），後來隔天開始雖然沒有發抖了，但反而變成是肌肉震顫感，尤其是大腿感覺特別明顯，偶爾上半身也會有，都是震顫感，外觀看不出來摸也不太摸的出來想請問是我吃的藥副作用造成的嗎？謝謝醫生∼", "large": [], "small": [], "tier3": []}, {"no": "e6413528", "user": "食道不好", "q": "醫師您好：昨天睡前吃了一顆抗生素，今天起床食道痛，查了一下應該是潰瘍我看建議的治療方法就是停藥，但因為我吃的是抗生素，一般衛教都是說不能停目前就只吃了昨天第一顆，請問這樣停有差嗎？還是要繼續吃完", "large": [], "small": [], "tier3": []}, {"no": "f747d6a2", "user": "霓", "q": "醫生您好∼我是上篇詢問關於幽門桿菌的藥和身體震顫感的人，先謝謝醫生耐心詳細的回覆！然後想再詢問，醫生您說的「因為神經遞質、線粒體功能障礙、氧化壓力增加或神經發炎，而產生神經症狀」的部分，這些是需要特別再去治療的嗎？還是有可能只是短暫的，停藥後就不會有了呢？有看到這個藥可能會造成不安感，會不會也是有可能因為這樣造成身體不自覺震顫呢？因為目前快要結束療程了，想說忍耐到走完療程再看看還有沒有症狀謝謝醫生耐心地回覆∼", "large": [], "small": [], "tier3": []}, {"no": "310b7b8f", "user": "NS", "q": "因急性胃炎做胃鏡檢查，而空腹就順便做了檢驗，結果飯前血糖103mg/dl、糖化血色素5.5%；當下醫師告知空腹血糖超過100，糖化血色素接近臨界值已經即將進入糖尿病了，請問：(1)空腹血糖這樣已經太高需要定期追蹤並治療嗎?(2)糖化血色素雖然在5.7%以下，但5.5%的數值已經具有糖尿病風險嗎?", "large": [], "small": [], "tier3": []}, {"no": "406594d1", "user": "K", "q": "醫生您好，我媽媽目前54歲，身體常常莫名痠痛(肩頸、下背、臀部、整隻腳、腳腕)，沒有摔或撞過，但一爬完樓梯或是做完伸展運動就會痠痛，手指也會無力發抖，這樣的情況已持續快半年，每天熱敷電療、固定打葡萄糖但效果不彰，因此有憂鬱症(服用贊安諾等)最近一個月每周於臀部施打短效類固醇，前幾天打了長效(一個月)類固醇，測量空腹血糖皆於120-130，不知是否跟類固醇有關，因此想去新陳代謝科檢驗，另外想了解身體的痠痛是否與新陳代謝有關?可以做哪些血液指標檢查項目?", "large": [], "small": [], "tier3": []}, {"no": "4f6e8279", "user": "鄭先生", "q": "醫師好:最近臉部右上區接近右眼側位置會有螞蟻爬的感覺不定時出現不頻繁。之前病史曾有小中風發生現在有每日規律服用抗血栓藥物(保栓通)一次。請問您的指導，非常謝謝。", "large": [], "small": [], "tier3": []}, {"no": "3abeeec6", "user": "李小姐", "q": "近半年左下腹頻繁痛，痛起來會持續好幾天，痛的過程會分大痛跟小痛，大痛會痛到半夜被痛醒睡不著，躺著也還是痛到受不了，小痛就是感覺悶悶的，但還可以忍受，之前看過在腸胃科照過超音波也做過大腸鏡，醫師都說腸道很通順沒有異樣，也看過婦產科做過陰道及腹部超音波都沒有什麼異樣，我本身有兩顆子宮肌瘤。最近頻繁疼痛的非常影響生活，吃止痛藥也是沒有效果，真的已經不知道該看哪科了？", "large": [], "small": [], "tier3": []}, {"no": "653580ce", "user": "小明", "q": "請問醫師..父親因快喘不過氣送急診本身有心臟衰竭攝護腺肥大高血壓輕微糖尿病因有輕微血尿喘不過氣送急診當下被裝葉克膜洗腎機治療期間說過肺部細菌感染攝護腺肥大完全堵住切片化驗初步斷攝護腺肥大但加護病房躺了20天可自主呼吸一直仍有痰藥抽轉普通病房普通病房一星期左右後又呼吸急促插管天天早上發燒退燒發燒退燒四肢顫抖後來有給予癲癇藥控制就近一星期像植物人般全身無法動彈眼睛能開闔但詢問無反應也無法再利用眨眼回應腦波檢查無癲癇心房顫抖曾小中風右腦有大面積神經白霧核磁共振腦橋急性小栓塞至今已又過3日仍全身無法動彈無回應如植物人般正常眨眼但不能利用眨眼回應請問該如何治療?醫生說腦橋很小栓塞小中風無太大影響不該如此完全無反應因為在腦橋似乎說不能動脈取栓如今只能抗凝血維持嗎?還是能低周波高壓氧B12..等或其他方式治療?另外為何會變成四肢顫抖間斷性發燒然後檢查腦橋栓塞小中風目前四肢無顫抖不知是否藥物控制　仍全身像植物人般無法動彈反應之前指甲刺激腳趾頭還有些微反應如今完全沒只能眨眼也不能用眨眼回應身體狀況似乎在普通病房肺又二次發炎至今一星期", "large": [], "small": [], "tier3": []}, {"no": "97ac53fe", "user": "匿名", "q": "醫師您好，我想請問，如果一隻蚊子叮了愛滋病患，吸了他的血很飽肚子很多血，然後我剛好不知情情況下用雙手打死牠，手上有很多那個病患的血（打死蚊子爆出來的血很多），我再例如手有伸進嘴巴裡吃到（嘴巴裡可能有傷口）或去摸到身上傷口，然後假如又更誇張我打了好幾隻，血都是同一個人的，這樣會感染HIV、得到愛滋病嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "d216b666", "user": ".....", "q": "本人於2/8開始感冒...也去看了醫生其中咳嗽都非常大力，直到2/9日下午在家看電視後，很想睡打個很大的哈欠也流眼淚後，發現視覺有問題眼球往右看會特別模糊與缺陷然後很不舒服，一直想要聚焦也聚焦不了，大概過了一兩個小時，這其間有睡覺有上廁所，後來拼命聚焦後來自己就好了，我也沒太注意，一直到2/13日中午上班吃完飯，突然就一樣的狀況出現，我一樣稍作休息晚上實在受不了，去看眼科，眼科說這樣要去大醫院才轉診到大醫院眼科，2/14看完結果轉急診照核磁等了很久晚上也在醫院等病床準備住院，印象晚上有給我吃三顆通血路的藥，2/15早上才轉進去病房，住了七天，走路講話力氣均都正常，抽血、血壓、血糖也都正常，後來做經食道超音波發現心臟有個洞，查了一下要做卵圓孔手術，醫師說這是可能的原因要補起來，後續安排在做手術，我想問的是我2/22出院至今已七天，眼睛看得清楚但於快速轉動頭部或行走時向右或右後看會很不舒服或模糊(會覺得聚焦比較慢)，但如果定格久一點可以看得很清楚，本人有近視都是戴隱形眼鏡，現在頭部向前眼球往左看某些角度也會有複視的情形，然後感覺頭都是暈的走動時較明顯，請問我能做些甚麼眼睛運動來改善嗎?或者就是漸漸等神經恢復就會慢慢正常，我實在很緊張，已心理建設好多次了..........另外能吃些甚麼保健食品來增進恢復及修復嗎。", "large": [], "small": [], "tier3": []}, {"no": "a1ae7211", "user": "浣熊", "q": "請問摔倒時耳朵上方靠近太陽穴重重撞到木頭沙發把手，當下頭暈噁心，嘴巴無法張很開吃東西咀嚼都會痛。隔天又因為騎車摔倒，因為是泥濘地所以沒有明顯外傷。因為過年期間沒有就醫只有多休息，目前離撞到頭部大約過五天了，還是有點頭暈，撞擊的部位還腫腫的未全消，右手有些動作偶爾會感覺麻麻的跟稍微刺痛感，這樣還需要就醫檢查嗎？", "large": [], "small": [], "tier3": []}, {"no": "9960d93f", "user": "汝汝", "q": "今天發現乳房側邊靠近副乳附近有一點紅紅的我以為是痘痘就擠了有跑出白白的之後有濃擦掉之後在擠就是血請問這邊長痘痘是正常嗎？", "large": [], "small": [], "tier3": []}, {"no": "c0491733", "user": "陳先生", "q": "醫師您好我於兩個月前做了複雜型廔管切除手術，原本表面傷口已癒合，但這幾天發現最後癒合處又有傷口，並且按壓會有組織液/上廁所擦拭會有輕微血漬/平時偶有黃綠色分泌物(https://drive.google.com/file/d/1ZKkaFF5jWvzkHqzlbmWS4VXNN10R00yS/view?usp=sharing)，並且傷口皮下有硬塊。醫生表示可能是廔管復發需要做雷射手術(有排MRI確認狀況)。請教張醫生：1.目前看來有可能在這麼短時間就復發嗎？還是說應該再等一個月觀察看看2.如果真需要再動手術，除了雷射還有別的建議方式嗎(以最不傷害括約肌)？掛線法？3.在沒有新的膿瘍產生前提，目前狀況放著不管會讓他惡化或是更不好處理嗎4.廔管復發是因為傷口癒合過程不完全，或是有其他原因呢5.照片上肛門旁的痔瘡醫生只叫我持續坐浴，但是我不知道還能如何處裡抱歉問題可能有點多，感謝醫師回覆與任何建議，謝謝", "large": [], "small": [], "tier3": []}, {"no": "9a79d993", "user": "陳先生", "q": "醫師您好我於兩個月前做了複雜型廔管切除手術，原本表面傷口已癒合，但這幾天發現最後癒合處又有傷口，並且按壓會有組織液/上廁所擦拭會有輕微血漬/平時偶有黃綠色分泌物(https://drive.google.com/file/d/1ZKkaFF5jWvzkHqzlbmWS4VXNN10R00yS/view?usp=sharing)，並且傷口皮下有硬塊。醫生表示可能是廔管復發需要做雷射手術(有排MRI確認狀況)。請教張醫生：1.目前看來有可能在這麼短時間就復發嗎？還是說應該再等一個月觀察看看2.如果真需要再動手術，除了雷射還有別的建議方式嗎(以最不傷害括約肌)？掛線法？3.在沒有新的膿瘍產生前提，目前狀況放著不管會讓他惡化或是更不好處理嗎4.廔管復發是因為傷口癒合過程不完全，或是有其他原因呢5.照片上肛門旁的痔瘡醫生只叫我持續坐浴，但是我不知道還能如何處裡抱歉問題可能有點多，感謝醫師回覆與任何建議，謝謝", "large": [], "small": [], "tier3": []}, {"no": "8b10165d", "user": "陳先生", "q": "醫師您好我於兩個月前做了複雜型廔管切除手術，原本表面傷口已癒合，但這幾天發現最後癒合處又有傷口，並且按壓會有組織液/上廁所擦拭會有輕微血漬/平時偶有黃綠色分泌物(https://drive.google.com/file/d/1ZKkaFF5jWvzkHqzlbmWS4VXNN10R00yS/view?usp=sharing)，並且傷口皮下有硬塊。醫生表示可能是廔管復發需要做雷射手術(有排MRI確認狀況)。請教張醫生：1.目前看來有可能在這麼短時間就復發嗎？還是說應該再等一個月觀察看看2.如果真需要再動手術，除了雷射還有別的建議方式嗎(以最不傷害括約肌)？掛線法？3.在沒有新的膿瘍產生前提，目前狀況放著不管會讓他惡化或是更不好處理嗎4.廔管復發是因為傷口癒合過程不完全，或是有其他原因呢5.照片上肛門旁的痔瘡醫生只叫我持續坐浴，但是我不知道還能如何處裡抱歉問題可能有點多，感謝醫師回覆與任何建議，謝謝", "large": [], "small": [], "tier3": []}, {"no": "6a98c958", "user": "Agnes", "q": "主任您好,前二週幫女兒吹頭髮時，意外看到約圓形直徑約1~2公分的頭皮腫腫的，有點帶淺淺紅的顏色，跟頭皮顏色不一樣，且上面沒有毛髮，小朋友有說是2週前撞到的地方，但大人沒有立即確認，所以不確定是否屬實?壓起來硬硬的，幫她用力揉才會痛，痛到會想閃避，輕揉則無感覺，有擦喜療ㄩ，但好像沒什麼改善，揉過之後隔天好像看起來會紅紅的，我好害怕是不是不好的東西.因為我女兒的後腦本身就比較突，在洗頭的時候不易察覺，不確定到底是不是撞到引起，還是有其他問題，請問我該如何走下一步?", "large": [], "small": [], "tier3": []}, {"no": "d6b425f6", "user": "JT", "q": "因為MRI檢查出腦動脈瘤，日前主治醫生安排做CTA，但兩年前因短暫腦血管栓塞一直持續服用阿斯匹靈，想請問：1.施作CTA前需要停用阿斯匹靈嗎？如果需要，多久前就要停用呢？2.停用阿斯匹靈是否會造成風險？謝謝", "large": [], "small": [], "tier3": []}, {"no": "d83d8b4c", "user": "米米", "q": "醫生您好！本人在1/23做左邊乳房切片穿刺手術，到目前已過二個星期傷口付近還好痛，還有瘀青，摸到還有硬塊會痛，請問正常嗎？這幾天還有冰敷不知道可以嗎？感謝醫師回覆", "large": [], "small": [], "tier3": []}, {"no": "e0d42e92", "user": "Bill", "q": "家母64歲，因為近一個月有便秘和上大號時有出血（鮮血），已排除痔瘡問題，所以做了大腸鏡檢查，檢查結果是沒有息肉，但有一處做病理切片，由於距離看報告還有段時間，想詢問醫生，這個狀況下，需要做切片，有可能是什麼病症呢？", "large": [], "small": [], "tier3": []}, {"no": "e2065af6", "user": "林先生", "q": "主任您好~我想問一下就是關於我左半邊的後腦勺那裡有凹陷但是我平常也沒有做什麼會傷到那裡的事也不知道是不是睡姿問題或是飲食問題還是其他才造成左半邊後腦勺直的凹一塊但目前這個對我來說是沒有什麼不適症狀但讓我有點慌張也不知道要怎麼看診還有要修復會不會有什麼風險", "large": [], "small": [], "tier3": []}, {"no": "323ec4fa", "user": "Max", "q": "請教醫師我在12/21開刀進行切除外痔與內痔的一般微創手術術後三週後，傷口雖然大致復元，但一直會小程度的痛癢但直到這幾天，某種固定坐姿，壓到會有強烈刺痛感，我就翻開看，大約距離在肛門口的1.5cm~2cm深處內部，看到一顆約直徑0.2cm的黃色肉球，請問這個會是肛門膿瘡嗎？需要怎麼治療呢？圖如下：https://myppt.cc/M6fTy", "large": [], "small": [], "tier3": []}, {"no": "8bc83173", "user": "憲", "q": "柯醫師您好，我原先於111年有肛門膿瘍發作的症狀伴隨著發高燒，後來醫院幫我打完抗生素的點滴後便自己消掉了（住院一個禮拜，但都是硬塊，無法切開引流）後來在去年（113年）7月份時復發，去了大醫院看確診為肛門膿瘍併壞死性筋膜炎，進行大規模清創後休養了兩個月，回去綠島工作，但在114年2月7日左右再次復發，跟第一次時一樣腫痛、大硬塊發高燒而且伴有搔癢的情況。目前衛生所有先開口服抗生素藥物跟消炎藥給我，想請問柯醫師：1.現在的情況（沒有開口、用溫水坐浴是能治療腫痛的嗎？2.如果一個禮拜後仍然無法消腫，是否要盡快去大醫院就醫？", "large": [], "small": [], "tier3": []}, {"no": "b1aa4812", "user": "王先生", "q": "張醫師你好醫生診斷我痔瘡4級，開刀前上廁所後會有一塊肉跑出來，我自己上完廁所後要把跑出來的肉推回去，不然就會在夾缸的時候很痛。2/5號開了痔瘡手術以後，第二天我發現跑出來的肉還是跑出來，我想推回去但打電話問護士，他說不能推回去，但是真的非常痛，然後因為不能推回去所以跑出來的肉越來越多，大約3公分左右吧。我想知道可以怎麼做？因為回診還有6天，我現在痛到不太能走路。麻煩請解惑。謝謝。", "large": [], "small": [], "tier3": []}, {"no": "25dee30d", "user": "AG", "q": "請教醫師：我於12/21開刀進行切除外痔與內痔的一般微創手術。術後三週1/10，開始發燒，且患部會壓痛，便吃抗生素五天，不再燒也不痛。術後約六週半2/7，大約距離在肛門口約1cm~1.5cm深處，發現一顆約直徑0.2cm的黃色肉芽(或膿包？)，但或許較小，尚沒有明顯痛感。僅偶爾微癢微痛。圖、影片如下，請問，這個會是痔瘡術後引起的感染或肛門膿瘡嗎？需要怎麼治療呢？影片：https://myppt.cc/hnzwp圖：https://myppt.cc/jZNuP", "large": [], "small": [], "tier3": []}, {"no": "6c9fb69e", "user": "May", "q": "許醫師：您好！請問切片良性後，醫師還是建議將腫瘤切除，整個拿去做化驗，術後化驗結果是良性纖維腺瘤，但由於手術一共取了2顆腫瘤，範圍是3.5*3*2cm，導致目前術後2週乳房還是有凹陷，且傷口還蠻長有6-7公分，請問這樣是否就算是部分乳房切除手術了？要不然乳房怎麼會凹陷的如此明顯，該如何做改善呢？謝謝您！另外，當時是門診手術（局部麻醉）且非主治醫師開刀，進手術房才告知我是哪位醫師操刀，所以來開刀的醫師還打手機去問主治醫師手術範圍要取多少，更誇張的是實際執刀的醫師又是另一位住院醫師，邊開刀邊教學，請問這樣是正常的嗎？", "large": [], "small": [], "tier3": []}, {"no": "898151d3", "user": "雨諾", "q": "您好：我大概是2025/01/15時，摔車受傷，左腳有三處擦傷，膝蓋上的兩處分別時小於五公分和十公分，腳背上的是大約二十公分在看診之後，採用的是生理食鹽水與全鵬傷口清潔抗菌液，搭配棉棒清傷口，接著擠上健鑫含銀凝膠傷口敷料後，貼上泡棉敷料處理，一天換藥一次目前(2/10)，膝蓋上的傷口已經好了，剩下腳背上已經從二十公分縮成大概四公分的傷口，但是這幾天傷口的恢復速度好像不像之前那麼快換藥的方式都是一樣的，唯一的差別是，最後一次2/3回診時，診所說不需要再吃藥，就沒再開抗生素給我，所以只有換藥沒有口服目前每晚拆開看傷口時，周遭是粉色的肉，傷口在清洗過後是紅色的，一部份上面有點白白的想問一下，這樣的傷口是正常的嗎?正常一般大概多久會好呢?先謝謝醫生的撥冗回答", "large": [], "small": [], "tier3": []}, {"no": "08197435", "user": "30歲男", "q": "請問醫生。前陣子肛周有長菜花。但已經清除至少4個月沒長病灶，但近期在肛門深處有摸到突起物，請問是要如何處理，手邊還有樂得美跟酚瑞淨，也有鬼臼毒素。請問這三種藥可以擦直腸嗎，還是只能去冷凍跟電燒", "large": [], "small": [], "tier3": []}, {"no": "76ebccff", "user": "Max", "q": "您好承#215448的問題我上一篇沒有表達清楚，醫師您可能誤解我的意思。實際應該是痔瘡術後‘七週後’，長了一顆膿包或肉芽，約0.3cm我附上更新的影片及照片（如下）再幫忙看看是肛門膿瘡還是增生肉芽？謝謝影片：https://myppt.cc/yW8wi圖：https://myppt.cc/xsLRM", "large": [], "small": [], "tier3": []}, {"no": "b04bef09", "user": "林老爹", "q": "請問一下，2／8手術廔管切除，出院後有帶藥回家，但沒有抹傷口的藥膏，只有口服藥品，需要自己去買藥膏塗抹傷口嗎？", "large": [], "small": [], "tier3": []}, {"no": "e34af1a6", "user": "不知道叫什麼", "q": "醫生你好，前幾個月開始我只要兩天沒排便或是糞便粗大的時候排便就會出血，鮮紅色，血量不到半張衛生紙，幾個禮拜之後我的肛門外摸起來有個軟軟的東西，照鏡子看是個小腫塊，本來不在意，但是近期幾乎每次排便都有撕裂感，會感覺痛，擦屁股有鮮紅色的血，血量也是不到半張衛生紙，請問這是什麼原因？如果是痔瘡的話要怎麼處理，需要開刀嗎？還沒做好心理準備，可以告訴我看醫生會不會痛嗎💔謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "a407558d", "user": "許先生", "q": "醫生你好1.四天前開完外痔切除手術應該是傳統的且有縫針，我看網路上很多人都有擦抗生素藥膏，可是幫我開刀的醫生只開給我吃的止痛藥，那我需要而外再去買藥膏擦嗎？2.這幾天屁股沖完溫水後都會換紗布夾貼在肛門處，想請問如果後續沒出血或分泌物了，是不是就不用夾紗布在患處了呢？", "large": [], "small": [], "tier3": []}, {"no": "ddf4f918", "user": "浩浩", "q": "醫師您好，最近2-3天發現肛門前方與陰囊中間的繫帶旁腫痛，離肛門口約1cm，不近也不遠，用手摸的話感覺裡面有一顆硬硬的約0.5cm腫塊，但外觀平滑無破洞，只是稍微鼓起而已。基本上平時坐的時候某些角度會痛，站著則不會。不清楚到底是痘痘？粉瘤？還是毛囊炎？目前有在擦之前家裡剩的Neomycin抗生素藥膏，想請問醫師這樣會不會影響到肛門甚至變成肛門膿瘍？", "large": [], "small": [], "tier3": []}, {"no": "f83cadd1", "us r": "妮妮", "q": "醫生您好，這一兩天大便偏粗大且硬，大便過程會有撕裂痛的感覺，擦屁股也有一些淡淡紅色的血，大便是咖啡色且沒有血、馬桶裡也都沒有血，只有衛生紙上有些血，且大完之後還是有一點點撕裂痛的感覺，請問這是肛裂還是痔瘡呢？坐著也只是感受到傷口刺刺的感覺如果有去買藥局的痔瘡藥膏，大概幾天會好呢∼謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "025c642d", "user": "羊", "q": "前一陣子有開子宮息肉手術住院期間有打針止咳在手臂上出院到現在目前兩週左右左手臂上摸起來很像硬塊而且會痛想詢問這個可能是血塊嗎？或是打針的關係？", "large": [], "small": [], "tier3": []}, {"no": "20c6166e", "user": "林", "q": "1/23做完內外痔切除手術，如今已經27天，目前是排便痛，傷口微腫，時不時刺痛（但頻率低，一天約5次，不知道外用抗生素藥膏還要繼續擦嗎？如果要繼續擦，大約要擦到什麼程度可以停止？", "large": [], "small": [], "tier3": []}, {"no": "aad1a23b", "user": "匿名", "q": "醫生您好，我想詢問關於菜花的術後照顧，目前長在外陰部跟肛門口，最近要去手術1.常腹瀉會不會影響肛門傷口痊癒？有什麼方式能改善？2.經期期間要怎麼顧傷口？3.排便後如果沒辦法沖洗肛門，是否能拿濕紙巾擦拭再拿衛生紙擦乾？4.大概多久可以做拉筋之類的運動？5.術後流血會建議墊衛生棉還是紗布？6.肛門沖洗是直接拿蓮蓬頭對著肛門沖嗎？7.目前已有施打HPV疫苗第一劑，術後復發的機率還會很高嗎？8.術後會建議一天坐浴幾次？謝謝醫生回答∼", "large": [], "small": [], "tier3": []}, {"no": "f7605b87", "user": "湯小姐", "q": "2/17去醫院抽血時發生了暈針反應，過沒多久就暈倒，但因暈針當下意識不清，不確定自己是怎麼倒的，只大概確定自己應該是坐著暈倒，左太陽穴附近著地（這部分疼痛），當下有立即冰敷，不過沒有做任何檢查。因本人有在吃洛寧錠治療雄性禿，也有用外用落建生髮液，這幾天也都停止使用。直至今日2/19偶爾該部位會隱約作痛，並且吃需咀嚼的食物與睜大眼睛時會疼痛。想請問：1.如何確認自己沒有腦出血等等內部挫傷的可能性2.該觀察多久才能確保沒事3.生髮藥物及外用藥何時才能食用4.3/31有一場需舒眠麻醉的手術是否可如期進行非常感謝醫師的回覆，辛苦了∼", "large": [], "small": [], "tier3": []}, {"no": "927ac9d6", "user": "Huang Hsi Ting", "q": "醫師您好，我於去年八月中下時，開車等紅燈靜止狀態時遭後車推撞、推撞後被往前去推撞前車，我的車子引擎蓋都凹陷了，嘴巴敲到方向盤流血、後頸拉傷，下背痛，當天急診便有左手、左腳麻木的狀況，直到現在半年多了左半側上下肢仍然是有麻木感，當天想下車就有被電到縮回去的情形...現在根本沒辦法從事原本的工作(需要體力負荷)後來照磁振攝影後發現C4.5.6、及L5-S1有椎間盤突出，壓迫到神經的狀況經過半年的吃藥及復健治療仍然沒有改善，目前NCV檢查結果是上肢F波有延遲，EMG做出來是雙下肢肌力偏弱...想請教醫師，我是不是只能開刀治療了呢？...但是脖子又很怕很不敢開，腰多年前也已經開過一次刀，實在不想同一個部位再受一次刀....另外想請教醫師幾個問題:1.醫學上，頸/腰椎間盤突出併神經病變的【可能致病原因】包含哪些呢?2.醫學上，有可能完全排除我上述的病症是【車禍撞擊】所造成嗎?3.如果我本身已有【C6頸椎退化性骨刺】以及【L5-S1經手術減壓治療】，這起車禍撞擊有可能使我【更容易造成】頸/腰椎間盤再次突出或【症狀加劇】嗎?我不知道該怎麼附上影像資料好，車禍的影片、車輛受損的情形、檢傷的過程及檢查、治療的經過，目前有遇上請求保險理賠上的困難，不知道該怎麼應對才好...我的L5-S1減壓手術是八年前開的刀了，開完刀已後均無任何再就醫的紀錄，頸椎的退化性骨刺也是這次MRI才發現有的；我也長年盡量保持良好姿勢/運動習慣，但還是再次陷入這個病灶的痛苦，工作也是，生活也是，保險也是...", "large": [], "small": [], "tier3": []}, {"no": "3f5aed94", "user": "匿名", "q": "醫生您好，我想詢問關於菜花的術後照顧，目前長在外陰部跟肛門口，最近要去手術1.常腹瀉會不會影響肛門傷口痊癒？有什麼方式能改善？2.經期期間要怎麼顧傷口？3.排便後如果沒辦法沖洗肛門，是否能拿濕紙巾擦拭再拿衛生紙擦乾？4.大概多久可以做拉筋之類的運動？5.術後流血會建議墊衛生棉還是紗布？6.肛門沖洗是直接拿蓮蓬頭對著肛門沖嗎？7.目前已有施打HPV疫苗第一劑，術後復發的機率還會很高嗎？8.術後會建議一天坐浴幾次？謝謝醫生回答∼", "large": [], "small": [], "tier3": []}, {"no": "ad4f1f68", "user": "劉冠瑋", "q": "醫師您好，請教一下，左手大拇指被工業用的玻璃纖維刺到，比頭髮絲還細，肉眼與放大鏡已不可見，碰到就像觸電一樣有鑽心刺痛感，請問是否可以做軟組織超音波，實在很不想整塊肉削掉，因為我有蟹足腫體質，謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "fc400874", "user": "林老爹", "q": "張醫師你好，2初作廔管切除手術，已經快3週了，每天坐浴3次，藥都按時服用，傷口還沒癒合，請問一下大約要幾週傷口才會癒合?還有請問一下皮下廔管和肛門廔管有何不同因為有親友去就醫，醫生說是皮下廔管。只需將其中膿劃開再消毒包紮抹藥膏即可，正確嗎？麻煩張醫師。", "large": [], "small": [], "tier3": []}, {"no": "63ffa70a", "user": "陳", "q": "醫師您好，最近發現閉眼單腳站立不是很穩，不跳動的話只能堅持最高16秒，但是睜眼單腳站完全沒問題，可以到快兩分鐘，很擔心是什麼病，然後肩頸痠痛動作有點卡卡的，也會心悸肚子痛什麼的，後來有去身心科檢查說是焦慮導致自律神經失調，想問自律神經失調也會影響到平衡感嗎，尤其是閉眼平衡？", "large": [], "small": [], "tier3": []}, {"no": "fd2cf8f1", "user": "菲", "q": "車禍膝蓋擦傷，有點深度，因擦藥膏周圍過敏傷口難癒合，有在診所換藥，但因週日未看診，請問我的傷口可以包到周一再換嗎如果需每天換，可以食鹽水消毒後，不擦藥直接用紗布蓋著嗎（因現在去診所換藥先擦治過敏的藥膏，但診所沒開藥膏給我）", "large": [], "small": [], "tier3": []}, {"no": "5ca777cf", "user": "翔", "q": "一直有肛裂問題，去年也把內痔都處理掉，這2個月來有發生2次大號完衛生紙上有血但不會痛，2月初那次發生後有在回去看醫生，醫生說肛裂傷口復原不錯，有地方有一點破皮，繼續開4週的藥吃氧化鎂及塞藥劑，醫生說沒有見血可以不用再塞藥劑，所以我回診完沒多久就停塞藥劑只吃氧化鎂，但自從那次回診後至今約2週的時間，肛門口漲漲的感覺會時有時無，上完大號更明顯漲甚至有點痛想請問這樣的狀況我應該繼續吃氧化鎂、塞藥劑？還是提早回診給醫生看看？感謝回答", "large": [], "small": [], "tier3": []}, {"no": "ad6245da", "user": "廖心萍", "q": "我於約4個月前，忽然發現左手拇指無法比“讚”、食指無力，無法伸直、手掌些微麻木，感覺在異常、於是便網絡預約雙和醫院門診、醫師表示他也不行動怎麼了？也沒看過這種病？於是花了快2個月的時間一直不停的在做許許多多不同的檢查、回診看報告中浪費了！最後跟我說是腕隧道症候群！問我是否要考慮是否要微創開刀呢？然後我花了半個多月近一個月的時間去雙和調病歷資料、拿資料去掛長庚醫院的診、再做不停的重複做好幾項檢查，直到做了核磁共振，才終於確定我是因為頸動脈狹窄造成的腦中風！而且腦中風受損的面積還蠻大的耶：額葉，頂葉，顳葉，都受損了、腦外科醫生建議說要住院,做頸動脈內膜切除術來治療但是從開始出現症狀到現在、我有感覺到左手的狀況有變嚴重的趨勢了！我現在左手感覺非常麻木，手腕與肩膀好像開始沾黏似的，會感覺卡卡的、頓感明顯，手指似乎出現張力，感覺食手指更加難以控制了！原先跟醫師是討論時是預計在半個月去前先住院、隔天早上再進行手術治療！結果每當一到住院日當天，醫院便會通知說醫院沒有病床可以讓我住院、因此住院與手術的日期便一延再延....現在還不確定到底什麼時後才能住院進行手術治療、並且趕快進行復健呢？由於腦傷是不可逆的，而且會越拖越糟糕、因此我現在不曉得該如何做才能趕快住院，儘速接受手術治療？也害怕再一直拖下去，會對日後的復健造成困難與留下後遺症....如果長庚醫院近期都無法順利安排到病房可以住院的話、是否能請醫師幫我詢問看看其他醫院，看是不是需要轉院或什麼的？不知道怎樣的方式，才能用最快的速度安排、讓我能以盡快住院接受治療呢？不曉得是該繼續呆在長庚等待病房、還是請醫師幫忙打電話到其他醫院詢問，那個方式能比較快有病床讓我可以解接受手術治療呢？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "109b44f3", "user": "匿名", "q": "肛門膿瘍手術完，過了一個月，傷口已經癒合，且診所醫生說沒有瘻管，傷口本身沒有流血流膿也癒合了，但最近發現癒合的傷口附近有長水泡呈現紅色，且越來越大也很癢，這是瘻管的症狀嗎？還是只是最近太常摩擦傷口導致的？", "large": [], "small": [], "tier3": []}, {"no": "c33600f1", "user": "阿霖", "q": "張醫師你好：請問我有做內痔結紮手術三次，大便糞便前面都會有血是正常的嗎？有時糞便前面比較顆粒後面都是軟的，然後大便完都會感覺肛門漲漲的，過一下就會比較舒緩，最後一次結紮完到現在三週了，這會是裡面的傷口還沒好嗎？", "large": [], "small": [], "tier3": []}, {"no": "5afed30a", "user": "芬", "q": "醫生您好：我服用異位寧1年多了，效果非常好，這幾天出去玩未帶藥2天沒吃，第三天補吃，藥效會不會降低？", "large": [], "small": [], "tier3": []}, {"no": "87a63bfb", "user": "小可", "q": "排卵期前四天（懷孕紀錄：中）穿著內褲蹭蹭大概5分鐘女友內褲裡面還有衛生棉沒有射用完後也馬上用濕紙巾跟水沖掉這樣會懷孕嗎", "large": [], "small": [], "tier3": []}, {"no": "8beb55f4", "user": "米", "q": "醫生您好，我前三個月經期是：11/11∼11/17、12/11∼12/17、1/10∼1/17APP寫排卵日在1/26，但在1/24時與男友發生性行為射精後保險套不小心滑落，也在一個小時內吃了事後避孕藥安立婷錠。1）APP寫2/10才會來經期，但1/31今天提前來，也沒有經前的症狀，但來之後會肚子痛、腰痠，請問這樣的懷孕機率大嗎？2）為什麼經期會提前這麼多天來？", "large": [], "small": [], "tier3": []}, {"no": "902793ed", "user": "陳", "q": "吃第一劑的時候他只有給一顆我爬文看都3顆這是正常的嗎會怎麼樣嗎如果第一劑吃完後三天回診去吃第二劑會怎麼樣嗎影響大嗎", "large": [], "small": [], "tier3": []}, {"no": "afc20713", "user": "Apple", "q": "醫師您好，因為本身服用事前避孕藥造成不正常出血，就診後醫生開了7天份的諾莉娜錠（早晚一顆），想請問此藥跟事前藥（悅姿）會互相影響嗎？或是同一日內需要間隔多久服用？感謝協助解惑", "large": [], "small": [], "tier3": []}, {"no": "d9a8f6b6", "user": "慶", "q": "請問他開第一劑給一顆吃是正常的嗎爬文上都2-3顆會怎麼樣嗎？", "large": [], "small": [], "tier3": []}, {"no": "25d9be03", "user": "秀", "q": "我今年46歲，先生在排卵期無套性行為，沒有內射，而是我高潮後請我幫他弄出來，請問這樣懷孕機率高嗎？", "large": [], "small": [], "tier3": []}, {"no": "286819a8", "user": "小可", "q": "排卵期前四天（懷孕紀錄：中）穿著內褲蹭蹭大概5分鐘女友內褲裡面還有衛生棉沒有射用完後也馬上用濕紙巾跟水沖掉這樣會懷孕嗎", "large": [], "small": [], "tier3": []}, {"no": "2f4fd74d", "user": "Tsen", "q": "醫師您好，本人上次的月經是2024/12/31-2025/1/5，於2025/1/5、1/6各一次體外射精，月經應於2025/1/29來，但到今天2025/2/1都還沒來，有漲奶，下腹悶痛的感覺，但都沒有見紅，於2025/2/2有服用一顆優潔通軟膠囊100mg，想問這樣有可能懷孕嗎，優潔通要吃幾天才有辦法催經？謝謝🙏", "large": [], "small": [], "tier3": []}, {"no": "6c3d89a6", "user": "胡小姐", "q": "醫生您好，我本身有腦下垂體瘤，定期追蹤。生理期一直都很晚來，會自行去診所拿催經藥或是打針。上一次的生理期是2024/10/9，在2024/12/27打催經針，生理期沒來。醫生表示我的子宮內膜有0.5cm，請我吃欣娜調經，從1/10開始吃，到1/29吃完第21錠，但是到現在生理期還沒來，不知道怎麼辦？", "large": [], "small": [], "tier3": []}, {"no": "8c77f3eb", "user": "匿名", "q": "醫師你好，目前是第二個月服用優悅避孕藥，過往有試過多次服用和停藥，平時經期也不是非常固定的日子到來。這次服用第二個月時，前面3-4天的經血較少和深色(應該因為在排出之前的月經)，第5天開始呈現鮮紅色的血，但目前已是第18天有血(鮮紅色)，是否該停止服用才能止血？該服用其他藥物嗎？", "large": [], "small": [], "tier3": []}, {"no": "986167e6", "user": "匿名", "q": "您好，性行為後保險套疑似有漏出來，已吃事後避孕藥，想問如果想同時使用避孕環那使用的時機要在什麼時候？一樣是月經第1~5天內嗎？這樣避孕效果能加乘(更保險)嗎？(沒有使用除了保險套之外的避孕產品)感謝醫生!", "large": [], "small": [], "tier3": []}, {"no": "119f8fe5", "user": "匿名", "q": "想請問醫生，如果只是在洞口摩擦並未射精，女友也在危險期，想請問這樣懷孕的機率是多少？", "large": [], "small": [], "tier3": []}, {"no": "329ffa36", "user": "張's", "q": "不好意思想詢問醫師之前月經週期約34∼35天左右但近兩個月變成29∼30會來若依近期預測的話2/9或10會來依之前週期的話2/13或14來若2/13~18出國會有水上活動應該從幾號開始吃美婷娜會比較保險", "large": [], "small": [], "tier3": []}, {"no": "4238efed", "user": "小紫", "q": "醫生您好:我想詢問年紀己43-44歲了,請問吃事前避孕藥是否會對身體不好呢?因為爬文有說年紀大於35歲就不要吃事前避孕藥了,會很多副作用,但男方說戴套又沒有感覺,也不去結紮,還有其他方法嗎?還是有男性避孕藥?", "large": [], "small": [], "tier3": []}, {"no": "bf8a5fd5", "user": "吳小姐", "q": "我吃黛麗安一年多了，但因為藥是21天，我的月經會在停藥後第五天來，然後我都會在月經週期第五天在服用下一包藥想請問：1.這樣停藥10天會影響避孕效果嗎2.我這樣的狀況應該在什麼時候服用下一包3.吃避孕藥的第一天會有效果嗎？還是在第幾天才會有效果？4.停藥那五天跟月經來的五天可以無套內射嗎，還是需要別的避孕措施", "large": [], "small": [], "tier3": []}, {"no": "c39b8e62", "user": "呱呱", "q": "跟女友行房事最後是以女上位的方式結束有戴套沒有吃事前事後戴套射裡面後約5秒內有拔出拔出後才將套子拿出因光線昏暗不確定是否有無戴反套子無破損液都在套子裡但是因為最後是女上位方式結束女方擔心說結束那幾秒液體會順著小兄弟一路往下滑留在女方陰脣開口處假設真留到開口處會懷孕嗎還有帶反的話效果有差嗎以及那五秒至十秒會有懷孕風險嗎", "large": [], "small": [], "tier3": []}, {"no": "f03031f8", "user": "匿名", "q": "之前男友射的時候有不小心射到內褲較右邊靠近腰部的地方其餘地方皆是乾的且沒沾到請問精子有可能在布料中移動造成懷孕嗎", "large": [], "small": [], "tier3": []}, {"no": "09d4525a", "user": "匿名", "q": "看app當天是排卵日，5次有3次沒有戴套，都沒有射在裡面，隔天有黃綠色液體（但之前就有感染有吃藥），這樣會懷孕嗎？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "262ca366", "user": "喬安", "q": "您好，目前懷孕8~9週，耳鼻喉科開了以下的藥，有些上網查不到分級，不知道是否安全，煩請醫師幫忙看看。1.CARBOCYSTEINE(=S-CACABOTINTABLETS375MG(CARBOCY2.OXY100MG止咳3.ACETAMINOPHEN(=PARACETAANLITONTABLETS500MG(ACETAMI4.LOMIDINE10MG抗過敏", "large": [], "small": [], "tier3": []}, {"no": "31825086", "user": "匿名", "q": "醫師您好我長時間重複感染念珠菌，陰道內會有很多白偏黃豆腐渣有就醫看診也是開塞劑而已，也有從無套改為戴保險套，但還是會有微微的黃色稠稠分泌物主要想詢問，假設未來想要備孕的話一定是無套，這樣就會一直反覆感染有什麼更好的方法，或是伴侶也需要就醫檢查呢？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "343c54c5", "user": "匿名", "q": "看app當天是排卵日，5次有3次沒有戴套，都沒有射在裡面，隔天有黃綠色液體（但之前就有感染有吃藥），這樣會懷孕嗎？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "59ed6fd7", "user": "小安", "q": "Q1:想請問有可能子宮內6W自然流產後流血一週已無出血,但又再次出血伴隨腹部疼痛檢查是輸卵管子宮外孕嗎?Q2:想請問我這樣多久才有機會再次懷孕呢?Q3:再次發生機會有多高?需要改做人工或試管嗎?真的是非常想當媽媽,只希望能生一個健康的孩子怎麼這麼難..", "large": [], "small": [], "tier3": []}, {"no": "c09d941a", "user": "社畜", "q": "醫師您好，我的月經週期近兩年來約在27-33天，10月生理期於10/28來，11月中旬有吃延經藥，11月生理期於11/30來，12月生理期於12/30來，於1/8及1/24均有無套體外射精之行為，1月月經還沒來，預期來的日期是1/29，至今已遲到快1週，於2/3使用晨尿自行驗孕為陰性，當天至婦產科門診就診也有驗孕，也是為陰性，請問有懷孕的可能性嗎？", "large": [], "small": [], "tier3": []}, {"no": "e1edc243", "user": "陳", "q": "醫生您好：目前吃事前（悅己）已經吃了7個月了，這個月停藥第五天，月經還沒來，以往經期在停藥後4-5天就會來，這次卻到了第五天都沒來。平常是晚上九點吃，有一兩天會晚30分鐘到兩個小時補吃。想請問：1.如果月經還是沒來要繼續吃新的一盒事前嗎？2.因為放假有熬夜是因為熬夜原因導致月經沒來嗎？3.晚30分鐘-2個小時會影響藥物效果嗎？4.平常都很準時吃，這次月經沒來是懷孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "f868ee8a", "user": "吉祥", "q": "醫師您好：先前因為陰道異常出血醫師開立美得能三個月經週期療程藥物用法為每次月經週期第16天開始吃美得能Provera至月經週期22天停藥（共吃七天，每天10mg)後等月經來時間軸如下：2024/12/18月經來2025/1/2到2025/1/8吃了七天美得能Medrone（Provera)，每天10mg，七天共吃70mg2025/1/27發現懷孕且胎兒有心跳了請教您此次用藥對於胎兒的風險是如何？若想生下來的話可以繼續妊娠嗎？非常擔憂胎兒的健康..再麻煩醫師撥冗詳解，謝謝！", "large": [], "small": [], "tier3": []}, {"no": "f9fca893", "user": "張先生", "q": "請問吃24+4的事前避孕藥，🍽️完第一包後開始吃第二包也需要吃七天才有避孕效果嗎，還是避孕效果會延續", "large": [], "small": [], "tier3": []}, {"no": "43564e72", "user": "77", "q": "您好醫生想問您問題我在1/31跟男友發生了第一次性行為當時因為衝動答應他沒有戴套後來他無套外射當下很緊張過了早上我下午就去買事後藥服用（大約過了15個小時吃的）我吃的是后保寧，接下來都沒有什麼症狀，我當時太緊張我2/2號跑去買驗孕棒（感覺是太快驗了但是是一條線）但2/3號我們當天發生了兩次性行為都有戴套也都是外射事後都有灌水檢查都沒有破洞然後我的生理期是在1/7號來的原本預計昨天生理期第一天結果現在遲來一天了然後剛剛發現內褲上殘有淺咖啡色的分泌物這是正常的嗎？這樣會懷孕嗎機率大嗎？如果過幾天流血了那這樣算是月經嗎？還是是藥物副作用？那流血了還需要驗孕嗎？謝謝醫生麻煩您了", "large": [], "small": [], "tier3": []}, {"no": "5d152f0e", "user": "小紫", "q": "醫師您好我的月經週期差不多在25-26天,若我排卵期在1/24,下次月經在2/7要來,1/29有發生關係但是前面有戴套後面無套體外這樣懷孕機會大嗎?另外我年紀在43-44歲懷孕的機率大嗎?是不是要邁向更年期,男生在46歲左右,在那個日期驗孕會比較準呢?發生關係後10天或者經期慢來?若真的懷孕生產會有問題嗎?寶寶是不是會有較大基因上的問題?另外想詢問44歲若在吃事前避孕藥可以嗎?因為我爬文說35歲後不要吃事前避孕藥怕會有血栓等之類的問題~~不好意思謝謝醫生的解答~~", "large": [], "small": [], "tier3": []}, {"no": "90005170", "user": "林小姐", "q": "醫生你好，我想請問一下，我自慰是用玩具幫助的，但我自慰完後,玩具拿出來後，卻發現有血，但之前沒有發生過這種情況，這次卻發生，想問一下是因為什麼原因造成的？", "large": [], "small": [], "tier3": []}, {"no": "b4f0f65b", "user": "abc", "q": "張主任您好我今年19歲，去年（2024年）大約9月初或8月底的時候男友的前列腺液疑似在未乾狀態下用手指伸進到我這邊，但中間月經都還是有來，可是本來月經都是來7天左右，但從那之後開始都變4天最多5天了。（本人有長期熬夜習慣都過1、2點才睡）最近接著就是，肚子開始變為胖（過去很瘦，肚子完全平），平躺用力時，肚臍以下到肚臍上方會凸一整塊，用力壓著還能摸到有心跳的感覺。今年（2025）的1/23也有一次，但同樣都是前列腺液，也許在未乾的狀態下可能碰到了，不是很確定。中途在9/14曾經用驗孕棒驗孕一次（結果為一條線），再後面11、12月驗孕棒的結果也都為一條線。請問張主任，1.這樣肚子這樣異常凸和動是否正常？2.月經來的日子突然變少是正常的嗎？3.假如中途月經都有來是否說明未懷孕？4.假設本月（2月）月經來了是否就不用擔心了？5.前列腺液能導致懷孕嗎？機率是否高？6.真的十分擔心⋯還需要再驗孕一次嗎？", "large": [], "small": [], "tier3": []}, {"no": "e185cec3", "user": "吳小姐", "q": "我吃黛麗安一年多了，但因為藥是21天，我的月經會在停藥後第五天來，然後我都會在月經週期第五天在服用下一包藥想請問：1.這樣停藥10天會影響避孕效果嗎2.我這樣的狀況應該在什麼時候服用下一包3.吃避孕藥的第一天會有效果嗎？還是在第幾天才會有效果？4.停藥那五天跟月經來的五天可以無套內射嗎，還是需要別的避孕措施", "large": [], "small": [], "tier3": []}, {"no": "3be5d9e8", "user": "人", "q": "在危險期無套插了不到10下拔出來，之後女友就去廁所沖了一下，應該沒流出前列腺液，請問這樣會懷孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "773d4362", "user": "匿名", "q": "您好因為酒糟皮膚問題醫師開了Doxycycline和Denosin等口服藥，外用藥為主要成分是metronidazole的益膚康藥膏。想請問：1.使用以上抗生素及抗組織胺等藥物是否會影響Hpv疫苗注射？要避開等吃完後隔多少天再打嗎？2.皮膚科醫師開7天的藥要全部吃完嗎？", "large": [], "small": [], "tier3": []}, {"no": "7bbf46ee", "user": "昕", "q": "醫生您好，1/6下午檢查出寶寶約6周，1/10吃第一劑，1/12吃第二劑（當天確認胚胎已流出），後續持續出血到1/21左右變少，但在1/23突然血量增多，1/25回診婦產科表示還有殘留，開了藥並買了生化湯，但因為當周為過年期間不便吃藥，期間也是有出血，到2/1才開始沒有出血，所以延到2/3才開始吃，吃了卻只是腹痛並沒有任何出血，但2/4驗孕依然是兩條線。我的問題是：1.吃了藥有可能都沒有出血嗎？2.驗孕兩條線代表還沒有乾淨嗎？感謝醫生撥空回覆。", "large": [], "small": [], "tier3": []}, {"no": "8afe56ae", "user": "匿名", "q": "上個月月經來的第一天是1/2號但是這個月的月經已經推遲第6天了在1/21的時候有性行為但都有全程做好安全措施事後也有檢查保險套沒有破掉請問這樣子需要去看醫生嗎？", "large": [], "small": [], "tier3": []}, {"no": "935626d6", "user": "小惠", "q": "進行子宮內膜刮搔術，病理切片顯示分泌期子宮內膜組織，由細長的子宮內膜腺體組成，具有亞核空泡。請問這是表示有病變嗎？煩請醫生解惑，謝謝", "large": [], "small": [], "tier3": []}, {"no": "94ffeeeb", "user": "匿名", "q": "醫師您好我服用事前避孕藥悅姿已經滿一年，昨天牙醫拔智齒後開了amoxicillin三天份，剛好今天開始四天是無效藥，網路上資訊amoxicillin會影響事前避孕藥的效果，amoxicillin三天吃完，剛好下週一會開始新的一盒避孕藥。請問1.amoxicillin會影響事前避孕藥(悅姿)效果嗎？2.新的一盒若未吃滿7日就發生性行為，還有避孕效果嗎？會不會有懷孕可能？謝謝您", "large": [], "small": [], "tier3": []}, {"no": "edd03ae1", "user": "Lily", "q": "醫師您好：我的月經週期算規律，約30天。固定會用排卵試紙，驗到強陽性後約12-14日月經就會來。我上次月經是1/20，今天照超音波醫師表示看起來卵已經排掉了。想請問醫師，這是否代表我至多過48小時（等卵子失去受精能力），就進入安全期了呢？感謝醫師的回覆。", "large": [], "small": [], "tier3": []}, {"no": "fc687a0d", "user": "溫", "q": "醫師您好請問我1/2-1/8的時候月經來但1/16我不知道是不是排卵期然後性行為有避孕措施但射後套子掉在裡面之後我們馬上去買了事後吃1/23-1/29我生理期就來了應該是吃事後導致的排卵期顯示是2/6就是今天但我剛剛發現有像血塊一坨但並沒有經血他就是掉一個很像血塊的東西下來稠稠紅紅粉粉的一顆請問這是什麼東西是因為吃事後的關係嗎是否該去婦科檢查呢麻煩醫師解惑感謝🙏", "large": [], "small": [], "tier3": []}, {"no": "2a7aa539", "user": "🤔", "q": "如主題，我的經期長期不規律，過去月經到來時身體皆無任何不適，但最近兩次在經期時卻常會感覺頻繁地想要放屁，若氣體排不出來，就會導致我難以坐下，連日常的走動都會覺得不舒服，這樣是正常的生理期現象嗎？", "large": [], "small": [], "tier3": []}, {"no": "6a9cbdf3", "user": "喬喬", "q": "醫師您好：請問您我在1/31與男友發生性行為，後續發現保險套破掉因此當天有服用事後避孕藥。買藥的時候藥局醫師有告知服用後大約7日月經就會來，但截至今日2/7月經都沒有來。請問我有需要去看婦產科嗎？是否是事後避孕藥沒有發揮效果？", "large": [], "small": [], "tier3": []}, {"no": "7e5b0ea1", "user": "匿名", "q": "醫師您好，我5／8∼5／12會前往日本旅遊，我個人平常有使用悅姿避孕（24+4），現在開始算剛好5／8會吃完第24顆有效錠，月經會在5／12來，怕會影響到行程，想請問的是：Q1：5／9號可以直接開新的一包吃一顆有效錠，再補吃上一包的四顆無效錠這樣會有影響嗎？（變成25+4，下一個週期23+4）或是28+4，下一個週期20+4呢？Q2：還是直接接著吃下一包有效錠即可呢？（48+4）Q3：想請問醫生您推薦怎麼樣的方式呢？謝謝醫生！", "large": [], "small": [], "tier3": []}, {"no": "93c38344", "user": "星星", "q": "醫生你好我想問一下1/16是月經來的時候我的月經週期差不多都是32-34天左右壓力大的時候可能會到40天基本上都會來7天2/3我的app顯示這天是排卵日，但當時不知道這天是排卵日，是知道是排卵期，而男友知道，但因為他之前沒有試過，是想說無套看看，有放進去，動了兩下，但因為我覺得痛，他就趕快拔出來，當時他說沒有感覺，也沒有射進去，拔出後沒幾秒鐘因為之前沒有試過，太敏感就直接射了，直接射在他手上，當時也離我有段距離，並沒有用到，想問會懷孕嗎？有需要吃事後嗎？（但因為已經超過三天了，會沒有什麼效果）", "large": [], "small": [], "tier3": []}, {"no": "97bffb83", "user": "許", "q": "昨日女方接近生理期（對方安全期？）跟女友有插入一下（無套、無射），有頂到底好幾下（約三到五分鐘）中間斷斷續續的。在之前有用衛生紙擦拭過前列腺液，對方下體分泌液也很多。未吃避孕藥。請問這樣懷孕機率高嗎？", "large": [], "small": [], "tier3": []}, {"no": "9de68de7", "user": "Anna", "q": "醫師您好：2/3（月經後第14天）排卵試紙呈現強陽性。今天已經2/7日了，排卵試紙仍是弱陽性，有淡淡的線。請問這樣正常嗎？是不是我的荷爾蒙有問題呢？因為有發生性行為的打算，請問這樣會增加懷孕機會嗎？（會戴套，只是仍想避開懷孕機會高的區間）感謝醫師。", "large": [], "small": [], "tier3": []}, {"no": "d452a848", "user": "cc", "q": "醫生你好我想問一下我的月經週期基本上32-35壓力大時會到40不太規律，平常也比較晚睡月經會來7天App上顯示1/29-2/4為排卵期2/3為排卵日但當時不知道2/3是排卵日事後才知道的所以有跟男友無套，因男友第一次動了兩下，我覺得痛，所以就拔出來，他自己說是在沒感覺前就拔出來了，過了幾秒鐘，有了感覺就射出來（射在手上），當時離我有段距離，並沒有用到我，我們也有做事後的清潔處理，當天隔了差不多快一個小時有在第二次，第二次就有戴套，檢查過沒有問題，男友後來有射，是射在套子裡面的，套子我們也有檢查，並沒有破洞跟漏出。因事後才發現那天是排卵日，已經超過時間，而且也有上網查過排卵期吃事後不會有什麼效果了，所以就沒有吃！想問在沒有吃事後的情況下第一次無套但沒有射在裡面，第二次就有戴套了，懷孕機率大嗎？", "large": [], "small": [], "tier3": []}, {"no": "fd3c2224", "user": "彭", "q": "醫師您好🙏從上個月開始都有規律吃事前避孕藥但今天是排卵期並且無套內射想問吃了事前避孕藥排卵期內射還是會懷孕嗎還是得趕快吃事後避孕藥謝謝", "large": [], "small": [], "tier3": []}, {"no": "2011c74c", "user": "小花", "q": "醫師您好上一次的性行為時間是1/25，沒有保護措施，但是是體外射精，下一次經期來潮是2/15，在性行為後的15天（2/8）有進行驗孕，結果為陰性，這樣能確定沒有懷孕了嗎？要在性行為後18天（2/11）再驗一次嗎？還是要等2/15生理期來才能確定沒有懷孕呢？謝謝醫師辛苦了！", "large": [], "small": [], "tier3": []}, {"no": "2d058ed2", "user": "YYL", "q": "醫生您好:目前已服用第六盒事前避孕藥(2/8是第六盒的第17顆)，中午廁所完擦拭時，有褐色分泌物(就這一次有褐色分泌物，之後擦拭都沒有)，我以為是月經提早來，但以往都是停藥的第3天來(這個月應該要在2/15來月經)，想請問醫生幾個問題:1.因為睡眠的關係，從1/27號開始晚上睡前有服用焦慮藥物(Alprazolam贊安諾)及肌肉鬆弛劑(弛刻達膠囊)，我都是在每天早上7點吃事前避孕藥(準時吃，無漏吃)，這兩種藥物是否會影響事前避孕藥?另外吃這兩種藥物會影響月經週期嗎?2.1/23(上次月經為1/18-1/22)及2/2有行房，1/23那次無戴套但沒有內射，2/2那次全程戴保險套，請問有可能懷孕嗎?(會怕褐色分泌物是著床出血)。3.目前剩下的4顆避孕藥，是否正常吃完，7天停藥期不管月經有沒有來，都在第8天吃下一盒嗎?", "large": [], "small": [], "tier3": []}, {"no": "882f56b3", "user": "Ken", "q": "醫生您好，請問一下男性採取站立式貼合在女性背後，全程生殖器只在女性體外的兩大腿內側受夾緊，前後持續磨擦至完全射精，因大腿內側靠近女性陰部，若不慎精液噴灑到女性私處外陰部，且女性正處排卵期間，此狀況會導致懷孕嗎？謝謝您的回覆🙏", "large": [], "small": [], "tier3": []}, {"no": "95943c65", "user": "匿名", "q": "上個月1/15月經來，平均週期28天，app顯示危險期為1/29。2/2第一次發生性行為，顯示危險期，懷孕機率中。插入前戴套，過程沒射，事後灌水檢查沒露，但沒有再次擠壓確認。請問這樣懷孕機率高嗎？以及如果下次月經有正常來，還需要驗孕嗎？最早適合驗孕的時間點是？謝謝🙏🏻", "large": [], "small": [], "tier3": []}, {"no": "f17dc73f", "user": "yo", "q": "醫生您好！我於1個半月前做了腹腔鏡手術各切除1顆消融1顆子宮肌瘤術後恢復感覺也良好術後的第一次生理期也正常大概昨天生理期結束但從3天前有便意時下腹三角區就會劇烈疼痛（類似很痛的經痛）排便後疼痛感就消失了今早一樣有劇烈疼痛感但無法順利排便疼痛感持續一整天不知道跟腹腔鏡術後有無關聯需不需要立即就醫檢查呢？在麻煩您回覆了謝謝您", "large": [], "small": [], "tier3": []}, {"no": "6856ef24", "user": "千", "q": "醫生好，我今年18歲。以往的月經雖然都不太規律（約37∼39天），但這一次週期特別不一樣，因為在1/4來了，1/3寫週期第29天，整個提早了，但最怪的不是這個，是我在大約1/18開始排卵期，而且當天有出血的情況，不過從1/20到2/4整整16天一直有流血，血量大概是月經結束最後一天的量，到了2/7週期第35天，有流了一個咖啡色鼻涕狀的分泌物，以往我都將這個視為月經前兆，但今天2/9週期第37天月經還是沒有來。我跟男友有在1/23也就是開始不正常流血的第四天愛撫，但全程都貼衛生棉，他也沒有脫褲子，所以照理講不會懷孕才對。因此想請教醫生，請問我那16天出血真的是排卵出血嗎？還是說那其實要當作月經呢？怕醫生時間混亂我在這裡整理一下：1/3上個週期第29天（過早）1/4∼1/9月經1/18週期第15天分泌物蛋清狀+點狀出血1/20∼2/4週期第17∼32天少量到微量出血（越來越少）1/23週期第20天愛撫行為2/7週期第35天咖啡色鼻涕狀分泌物出現真的很謝謝醫生回覆，我一直好怕其實我懷孕月經才沒有來...", "large": [], "small": [], "tier3": []}, {"no": "9175a359", "user": "YY", "q": "醫生你好想詢問一下我1月來兩次月經7號來一次19號來一次量好像都差不多12個月是月中來的可能因為12月吃了兩次事後藥現在在擔心2月會不會來", "large": [], "small": [], "tier3": []}, {"no": "38bf78ac", "user": "喵", "q": "醫師你好，這幾個月月經不是很正常，最近1-2個月是經量變少但也不至於用護墊就可以，時間為十幾天才走，搞得我很混亂；而這次的月經也是這樣在來之前有五天的褐色（以往正常都是1-2天）然後月經就來了，量明顯與以往剛來的1-3天減少很多但時間延長也不怎麼痛經（以往正常都是第1、2天痛經）想問問醫生是否與我體重增加或是自慰或其他問題有關係呢", "large": [], "small": [], "tier3": []}, {"no": "3bcf242d", "user": "蘇", "q": "想請問女友1/1結束月經，但她月經失調她說2個月後沒意外應該是3/1左右會來2/9號11.多發生無套性行為然後2/10號11.多吃事後避孕藥（韻停錠）那這樣月經會提早來嗎這樣還會懷孕嗎", "large": [], "small": [], "tier3": []}, {"no": "d38b2be0", "user": "哲", "q": "請問醫師，我女朋友排卵期第5天，有發生無套性行為，也有體內射精，但是有馬上吃避孕藥了，這樣能有效避孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "dcc0a26a", "user": "匿名", "q": "女友上次月經是1/11走的我們在1/15無套然後1/16吃ella那這次是2/9號月經走然後2/10無套外射這樣懷孕機率大嗎？請問有必要吃事後嗎？", "large": [], "small": [], "tier3": []}, {"no": "df6a385a", "user": "天", "q": "在2/8晚上10點時，和男友從事性行為時不知道保險套破掉的情況下在陰道內射精了，2/9早上9點去大醫院之婦產科掛號詢問事後藥的事宜（不確定是不是可以直接去買事後藥）也有跟醫師說我上次月經來的第一天是1/24，醫生開了一張單子要我去藥局買“美適儂”，早晚各吃一顆連續吃五天即可。但因為之前稍微查過，知道此藥為事前藥，所以買完藥後有再回到診間詢問醫師這是否可以當事後藥，醫師說是可以的，但內心還是有點不安，故來詢問這樣是否有避孕效果？以及成功率為多少？如果這樣沒用的話我是否需再去看一次診，或是要吃常見的事後藥？", "large": [], "small": [], "tier3": []}, {"no": "f2c52570", "user": "K", "q": "您好謝謝您抽空回覆！平均月經週期是29天，經期約7天上次月經開始日是2/12/10時
