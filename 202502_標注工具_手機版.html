{"no": "47014f66", "user": "喬", "q": "醫師您好我於1/1開始服用第一錠，1/27月經來潮，吃完無效錠後沒有馬上吃新的，直到月經來潮第四天(1/30)才開始服用第二盒，2/2有無套性行為，請問這樣是否有避孕效果?懷孕機率高嗎?另因之前經期不穩定擔心懷孕，2/2有吃事後避孕藥，2/12-13這幾天有些咖啡色分泌物，目前仍持續服用事前避孕藥，請問這有可能是懷孕初期出血嗎?另請問醫師，若想達到持續性的避孕效果，悅姿應該在4顆無效藥後接著服用?還是可在經期前5天服用即可?感謝醫師抽空回覆冗長的問題!", "large": [], "small": [], "tier3": []}, {"no": "91a526e9", "user": "匿名", "q": "醫生您好，我今天有咖啡色塊狀分泌物，大約長寬1.5公分，我從前天開始就有少量出血，血的顏色有時候是咖啡色，有時候是鮮紅色，去年12月的時候也有兩次非經期出血，12月初正常月經，12月中有一次非經期出血大概四天，12月底有一次非經期出血，持續九天，但每天都很少量，當時只有輕微的腹痛，但昨天的疼痛比12月更明顯，想知道可能的原因，謝謝", "large": [], "small": [], "tier3": []}, {"no": "dcc20e83", "user": "Jk", "q": "醫生你好請教一下如果精液射出來放在保險套半密封裡放8小時溫度大概10到20幾度，請問這個精液還有懷孕的能力嗎", "large": [], "small": [], "tier3": []}, {"no": "fbf1b04b", "user": "LT", "q": "有固定伴侶，性行為後過兩天小便就會開始刺痛及頻尿，之前看醫生大部分是開抗生素，吃完就好了，但下一次性行為有時又會再發生。性行為時有特別注意衛生，例如男友戴套前會用酒精消毒手部，性行為後也都會清洗陰部多喝水排尿，但常常還是會發生一樣的症狀導致有陰影。想請問原因及可以怎麼改善？另若發生刺痛感及頻尿有無藥物可以購買以減緩症狀？因有時候上班無法及時就醫又很不舒服。謝謝。", "large": [], "small": [], "tier3": []}, {"no": "0b7685cf", "user": "Jane", "q": "醫生您好，我因落髮問題前去大醫院皮膚科看診，醫生開立愛達信、波斯卡及洛寧給我，連續吃了一年的確有改善頭髮，但卻也剛好檢查到一顆4公分的子宮肌瘤，但因為前幾年每年都會到不同健檢中心健康檢查婦科超音波，都沒檢查出有肌瘤，而剛好這個吃完一年就檢查到，心裡又想說藥物跟賀爾蒙有關但又不確定是否為巧合，想請問醫師以上藥物是否會造成子宮肌瘤容易生成，謝謝您!", "large": [], "small": [], "tier3": []}, {"no": "31231b4e", "user": "沈沈", "q": "陰唇內側左右兩邊有明顯紅腫，摸的時候非常癢，陰道口下方也是超級癢，吃兩天抗生素，也有用塞劑沒有好轉實在很擔心，陰唇撥開裡看起來有一點一點紅紅，第一次如此嚴重。病發一週前有第一次無套內射，不知道是否有關聯。", "large": [], "small": [], "tier3": []}, {"no": "58fad272", "user": "小貓", "q": "醫師您好，我月經是1/15來的，1/16.17有吃健保的排卵藥。因副作用非常不適，所以只吃兩天藥。但1/19月經量就變很少，幾乎要沒了。1/25第10天用排卵試紙發現是強陽，當天有做功課，接著3天做一次，2/3回診照超音波醫生說看起來已經排完卵了！我想說下個月再努力，2/6想說再用排卵試紙看看，結果發現是強陽，就這樣持續了3天都強陽，2/9用驗孕棒發現很淡的兩條線，2/13去婦產科照音超，看到一個非常小的圈圈，也看到了黃體，然後醫生給我小白球（優潔通）早晚各2顆，吃兩週。我想請問：1.是因爲吃排卵藥所以經期變短提早排卵嗎？2.我沒有出血症狀，有需要吃小白球嗎？因我看副作用有陰道出血…有人分享他原本沒出血，但他吃了小白球出血，我不知該不該吃🥹我很怕藥物造成畸胎3.保養品可以用果酸，A醇嗎？我平常頭痛會吃普拿疼，懷孕可以吃嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "d53f4789", "user": "緊張的孕婦", "q": "醫師您好，目前懷孕約4周，會想吐+常常放屁+頻尿+偶爾肚子悶悶像月經的感覺，這是正常的嗎？因現在胚胎還很小，醫生有開2周小白球，叫我每天早晚各2顆，但我沒有出血也幾乎沒有不舒服，有需要吃嗎？得知懷孕後，我就不太敢再吃藥，怕影響寶寶，但我有時候會頭痛，可以吃普拿疼嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "2dd775b2", "user": "微笑", "q": "醫生您好：吃悅姿24+4避孕藥一段時間了，以前月經都正常來，這次第一次吃到白色最後一顆月經來一兩滴而已，然後隔天就沒有了，現在繼續吃新的一盒第一顆，請問這樣對嗎？然後為什麼會沒有月經？謝謝🙏🏻", "large": [], "small": [], "tier3": []}, {"no": "c3707df7", "user": "很害怕", "q": "女友2/1號月經來2/7後走2/9號發生性行為無套進去抽插不到3分鐘就拔出來沒有射在裡面事後口了大概5分鐘才射這樣會懷孕嗎", "large": [], "small": [], "tier3": []}, {"no": "f9cbaf7e", "user": "張安安", "q": "醫生你好，這2天剛開完巧克囊腫，左邊約15公分、右邊3公分，因為沾黏厲害，開刀時有出血，血紅素掉到6.6，術前10.9，原本就有地中海貧血症，無補充任何保健品，手術因血紅素太低有輸血，輸血完血壓都會偏低，建議之後要長期吃鐵劑嗎？或是買市售含鐵保養品就好了？因為囊腫太大、怕開完刀很快又長出來，術後藥物治療會使用柳培林，3個月號再打第2針，半年後開始就是口服藥使用，請問有什麼注意事項的嗎？", "large": [], "small": [], "tier3": []}, {"no": "fbb9455d", "user": "小Y", "q": "去年10月有在陰道口下方摸到一顆手感很像粉刺的東西，但只有從屁股往下摸才摸得到，到12月底時感覺好像變大顆，去診所看，醫生說感覺很像是，旁邊也感覺還有一顆，他說我的不像一般菜花，他有一個病人跟我症狀差不多，但後面也是確定是菜花，讓我去大醫院檢查比較準隔一天我去大醫院看，病灶很小，醫生也說看起來很像，但因為我10月就出現症狀，一般情況應該是長很快很多，不會只有那樣因為病灶太小，原本醫生想請我回去等症狀明顯一點再來，但是等太久很焦慮，問了有沒有其他方式可以確定，醫生才說可以做切片，那時候感覺好像醫生不太想做切片，雖然最後檢驗出來是顯示息肉，但最近摸那個位子感覺好像粗粗的，摳起來也好像那種好幾顆迷你球的感覺我想請問1.病灶如果小到只有0.1x0.1x0.1，做病理切片的準確率會不會因為太小而降低準確率2.病理切片結果是顯微鏡顯示出息肉質皮膚組織，我想請問菜花有可能長在息肉上嗎？因為就我所知病理切片是削成薄片再選出一個最適合的去看，那有沒有可能取到的薄片剛好避開菜花那部份而只剩下息肉呢3.如果切片之後一個多月，原本病灶處多了觸感像很多0.01的凸起密集叢，有可能是菜花的症狀嗎4.請問我現在應該再去掛號婦產科還是泌尿科呢，還是應該等病灶再大一點明顯一點再去呢", "large": [], "small": [], "tier3": []}, {"no": "04cd354e", "user": "Hegel", "q": "醫師你好，請問若保險套正確使用，可能在快速抽插與射精時從側面破掉麼？又此情況是否受陰道鬆緊影響？靜候回覆，感謝！", "large": [], "small": [], "tier3": []}, {"no": "5f57490b", "user": "Alan", "q": "醫生您好我和我女友2/3有過六次的愛愛然後都有帶保險套2/10時跟我說他肚子痛（一下會一下不會）但是她月經還有5天才來這是懷孕初期的症狀嗎？到了月經該來的那天也沒有來今天應該是月經來的第二天也沒有來請問這有可能是懷孕嗎？還是黃體囊腫破裂？我們現在的心情都很緊張請醫生幫我診斷一下謝謝您", "large": [], "small": [], "tier3": []}, {"no": "7049e027", "user": "王", "q": "想問醫師在月經前兩天跟女朋友愛撫沒有插入後面射在女朋友的肚子那邊若擦拭的時候有不小心碰到陰部這樣會懷孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "a5398100", "user": "蘇", "q": "之前問過的：想請問女友1/1結束月經，但她月經失調她說2個月後沒意外應該是3/1左右會來2/9號11.多發生無套性行為然後2/10號11.多吃事後避孕藥（韻停錠）那這樣月經會提早來嗎這樣還會懷孕嗎新的問題：無套那時候3次但都有擦乾淨才繼續這樣還會有懷孕的風險嗎我女朋友說他吃完都沒副作用應該也是正常的狀況吧目前他的月經已經來了2/16這天那這樣我要幾時用驗孕棒才會比較好", "large": [], "small": [], "tier3": []}, {"no": "da099ee7", "user": "小歲", "q": "2月3號有去看醫生吃崔經藥到現在還沒來月經？因為1月份的時候有跟人性行為有吃事後避孕藥兩次然後去醫院照超音波有抽血驗尿也沒懷孕現象那是什麼問題呢", "large": [], "small": [], "tier3": []}, {"no": "6190830e", "user": "木兆", "q": "醫生您好，自從第一次破處後，我就有以下問題，那個過後，陰道口下方然後肛門上方的皮膚，會痛，不知是否撕裂傷，尿液流到那邊總會痛，用手觸摸也會痛，日常生活並沒有什麼疼痛問題，但因為該情況總發生，我總是性致缺缺，想請問醫生這部分該怎麼改善，需要就診嗎？謝謝您", "large": [], "small": [], "tier3": []}, {"no": "b8f67b68", "user": "YY", "q": "醫師您好：2月(2/15-2/19)及3月(3/14-3/25)有出國的計畫。月經週期是33天，原本預計來的月經時間為2/16-2/22及3/21-3/27，去買了延經藥(SHITON）來吃，大概比經期提早了2天(2/14)開始吃，想請問會在2/19停藥後就來嗎?想請問這次月經結束之後，若以正常來說，下月是會正常月經週期(3/21-3/27)嗎?還是下個月仍需繼續吃延經藥?謝謝", "large": [], "small": [], "tier3": []}, {"no": "4085f4ef", "user": "Ss", "q": "醫師您好平常就有在吃喉糖的習慣，是吃六鵬草本潤喉錠，每天會吃5-6顆以上，睡覺也會含著睡，只要喉嚨覺得乾就會吃。應該吃有半年以上了！直到懷孕六週，偶然聽到藥師說不建議吃，我很緊張很擔心，因爲我不曉得孕婦不能吃喉糖…查了很多資料每一個成份孕婦都不能吃，否則生下來可能會有過動、智能障礙的狀況，想請問醫生我這樣吃算是過量嗎？胎兒是不是不要留下來比較好？成份：（每顆）甘草217.53mg糊精60.48mg米澱粉12.09mg薄荷腦6mg桉葉精油3mg蜂蜜0.3mg鼠尾草0.3mg樂蜀葵0.3mg", "large": [], "small": [], "tier3": []}, {"no": "75d52f4a", "user": "tina", "q": "醫生您好，第一胎12/30生產大概在產後2-3週惡露逐漸轉為黃色甚至快沒了，但在產後一個月左右又突然有鮮紅色血液流出但量不多，到現在已經產後50天仍然有血，沒有任何不適只哺乳(瓶餵)一個月就退奶(因為沒有奶水)，想請問這樣是有異常嗎？產後一個月有回診但沒有照超音波，只有內診檢查傷口、做抹片檢查。", "large": [], "small": [], "tier3": []}, {"no": "86373980", "user": "Sheng", "q": "想請問一下1.射精完後手如果有沾到精液，然後在用手去插入女生的陰道裡面這樣會懷孕嗎∼(插蠻深的)2.印象中,手有用衛生紙大概擦拭，但不是很確定手上還有沒有殘留精液，且過一分鐘以上，在用手去插入女生的陰道，這樣有可能會懷孕嗎？3.以上這兩種狀況，有需要吃事後避孕藥嗎？", "large": [], "small": [], "tier3": []}, {"no": "8752113f", "user": "沈沈", "q": "陰唇內側左右兩邊有明顯紅腫，摸的時候非常癢，陰道口下方也是超級癢，吃兩天抗生素，也有用塞劑沒有好轉實在很擔心，陰唇撥開裡看起來有一點一點紅紅，第一次如此嚴重。病發一週前有第一次無套內射，不知道是否有關聯。", "large": [], "small": [], "tier3": []}, {"no": "abe390b1", "user": "鳳梨", "q": "你好醫師我想請問我今天早上六點服用ru486副作用大概會持續多久", "large": [], "small": [], "tier3": []}, {"no": "08d4fcd2", "user": "怎麼辦", "q": "醫生好我的經期在2/2∼2/7號與男友在2/9號發生關係。這兩天陰道有流一點點血像月經的顏色，肚子酸酸痛痛的。2/9號無套插進去一下下（大概3分鐘）沒有射後來用嘴巴口出來的（5分鐘）今天是第10天請問這樣會懷孕嗎？週六還是週日可以驗孕？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "749b59fa", "user": "小紫", "q": "醫師您好由於男友不愛戴套，所以最近考慮服用事前避孕藥，但不知該選擇哪牌的才好。在40歲前有很長一段時間吃事前避孕藥，40歲後有爬文說年紀越大不要吃避孕藥用其他的方式避孕，所以目前都沒在吃避孕藥了改戴套(1)我想問醫生真的40歲後不要吃事前避孕藥嗎?真的有會血栓或乳癌那些風險或其他的副作用嗎?我有問過二間婦產科醫生，二間答案都不一樣，一間就還是可以吃，另外一間說超過40歲盡量不要吃改其他避孕方法~~(2)請問醫生吃事前避孕藥要吃那個牌子的劑量比較低和副作用比較低呢?我之前有吃過\"德國拜耳欣無妊\"還有\"黛麗安\"這二種避孕藥~~還有其他品牌的的避孕藥低劑量副作用低的嗎?可以給我做參考嗎?(3)另外因為有時會有黃色分泌物，但不會癢有去看婦產科醫生說是念珠菌感染有開塞劑給我，請問若沒有使用塞劑會自己好嗎?這個念珠菌感染會很嚴重嗎?因為有些微血絲醫生還說我有\"荷爾蒙不穩定\"造成的,這個會很嚴重嗎?因我年紀是否要更年期\"荷爾蒙不穩定\"跟更年期有關係嗎?想叫男方去結紮但目前男方不願意去~~但戴套也不能百分之百避孕", "large": [], "small": [], "tier3": []}, {"no": "bd906010", "user": "Josephine", "q": "欣黴素BiomycinOint可以搽陰道裡面嗎", "large": [], "small": [], "tier3": []}, {"no": "c064e39e", "user": "怎麼辦", "q": "醫生好我的經期在2/2∼2/7號與男友在2/9號發生關係。這兩天陰道有流一點點血像月經的顏色，肚子酸酸痛痛的。2/9號無套插進去一下下（大概3分鐘）沒有射後來用嘴巴口出來的（5分鐘）今天是第10天請問這樣會懷孕嗎？週六還是週日可以驗孕？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "f3c81177", "user": "Jane", "q": "請問醫生，子宮肌瘤不能攝取太多大豆異黃酮，知道可以適當喝豆漿及吃豆製品，但不要攝取該類營養品，請問植物性蛋白粉也不建議攝取嗎?謝謝您!", "large": [], "small": [], "tier3": []}, {"no": "055cc384", "user": "Vivi", "q": "近期3-4個月我的經期週期七天，前幾天量都穩定鮮紅色，第四-五天開始咖啡色分泌量少，但是到了第六天又開始出現鮮紅色，經期一樣會在七天結束，請問這樣是否需要就醫，或是調理即可？", "large": [], "small": [], "tier3": []}, {"no": "17e49d8e", "user": "Coco", "q": "有在服用安眠藥及抗焦慮藥物1、lorazepam2、sertraline3、zolpidem4、alprazolam想問這些藥物會跟祈麗安產生藥物交互作用使避孕藥效果下降嗎？", "large": [], "small": [], "tier3": []}, {"no": "27c128fc", "user": "憂慮者", "q": "醫師你好：我檢查過沒有子宮內膜癌，但增生較厚，所以醫生開了三個月的適位紓，開始吃還是有少少量分泌出血，吃了27天後開始有經期悶痛，且出血症狀更多，中間都沒漏掉吃藥💊不知道是什麼狀況，還要繼續吃嗎？感覺是經期要來的時間，被強壓住，但又壓不太住。謝謝您", "large": [], "small": [], "tier3": []}, {"no": "37616fa4", "user": "tina", "q": "醫生您好，第一胎12/30生產大概在產後2-3週惡露逐漸轉為黃色甚至快沒了，但在產後一個月左右又突然有鮮紅色血液流出但量不多，到現在已經產後50天仍然有血，沒有任何不適只哺乳(瓶餵)一個月就退奶(因為沒有奶水)，想請問這樣是有異常嗎？產後一個月有回診但沒有照超音波，只有內診檢查傷口、做抹片檢查。", "large": [], "small": [], "tier3": []}, {"no": "49d8f9c6", "user": "楊小姐", "q": "您好，請問因子宮內膜異位症治療，有健保給付的第四代避孕藥廠牌有哪些呢?(例如:黛麗安、愛斯麗安、悅己、悅姿)需另外加收藥費嗎?醫院、診所都可開處方箋嗎?避孕藥21+7天、24+4天，哪種在那7天或4天開始出現的經痛等不適情況的天數比較短及比較不會那麼痛呢?成份與劑量哪種對子宮肌瘤、肌腺瘤、巧克力囊腫增大域增加的影響比較小呢?哪種副作用較低呢?例如:體重增加、水腫、噁心、頭痛因為要長期服用，在經濟與健康之間的考量想慎重一點...還有服用多久需要回去醫院診所繼續追蹤檢查呢?謝謝!", "large": [], "small": [], "tier3": []}, {"no": "d1c05be1", "user": "Maymay", "q": "想請教醫生我在2/4進行leep手術2/12有回診出血量都算少2/17出血變很多伴隨脫落類似血塊的東西或是結痂2/18至診所打止血針診所醫生建議我還是回手術醫院檢查2/19手術醫生檢查後不排除是月經但也不確定內診有清出很多血塊以及用硝酸銀又塞了紗布讓我兩天後取出想請問1.紗布兩天後取出會不會太久怕感染2.出血量變多比較有可能是月經或是結痂脫落導致為何會有很多血塊", "large": [], "small": [], "tier3": []}, {"no": "e63b60a2", "user": "匿名", "q": "醫生您好，我1/6生理期來時吃了第一包事前避孕藥，我是吃悦己21天的。不過流血症狀持續到1/28左右，所以去看了婦產科，醫生有開給我止血藥並叫我繼續吃事前，原本預計2/3下次生理期來，但大概1/29後就沒有繼續少量出血，不過2/3生理期就沒有來，持續到現在都還沒來，中間有內射過，想詢問有可能因為血已經流光，或者生理期提早來了沒有血可以流了，而導致下個月生理期沒有來嗎？2/3也有繼續吃下一包事前避孕藥。這樣有可能懷孕嗎？麻煩了∼謝謝您", "large": [], "small": [], "tier3": []}, {"no": "f178158c", "user": "王先生", "q": "女朋友是2/3-2/7月經來在2/14有性行為結束時發現保險套有破一個小孔在中上方（非儲精袋）事後一小時有吃安立婷今天2/20女友說月經提早來這是正常的嗎？提早來了10天以上有可能懷孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "f79be3b4", "user": "簡", "q": "醫師您好：我有長期使用舞悠避孕環來進行避孕，每次都是很規律的三個禮拜後拔出，拔出後一個禮拜放入，且月經皆於拔出後第三天來經。然而在上個月應於1/22拔出避孕環，因某些原因導致提後一天1/23拔出，我在7日後的1/30有放入，1/30再往後三個禮拜的2/20也就是今日應該要拔出，但卻在還沒拔環的時候（環還在體內）就來經了，月經顏色呈現咖啡色的，有些許分泌物。有上網查詢過是因為避孕環效果消失了所以就直接來經。想請問，那麼我在4天前2/16跟男友有過性行為且有內射的行為，是否有很大的懷孕機率呢？有查到關於使用避孕環後想懷孕，需拔掉避孕環過12天（或等到下次月經來潮）才恢復正常生育能力。另外也想請問有關避孕環突然失效導致來經是否跟延後取出&放入有關聯呢？感謝醫師的閲讀跟解答！", "large": [], "small": [], "tier3": []}, {"no": "2a9f6862", "user": "匿名", "q": "經期第四跟第五天有無套外射，請問懷孕機率高嗎？(週期大概28∼30，經期長度7天)", "large": [], "small": [], "tier3": []}, {"no": "706aea63", "user": "AT", "q": "請問醫生：以剖腹方式切除子宮(次子宮切除)，日後有可能會出現器官往下掉的狀況出現嗎？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "7eed7985", "user": "1", "q": "女友上一次月經來潮是在1/12~171/21有做過一次，前面龜頭有碰到陰部，沒有放進去，之後就全程戴套射精後有在體內停留了一段時間才拔出(保險套沒有掉，也有灌水檢查)APP顯示這個月月經應該是2/5要來，但到現在都還沒有來在2/14、17、20有無套內射，後續都有在24小時內吃避孕藥想請問醫師懷孕機率大嗎", "large": [], "small": [], "tier3": []}, {"no": "92a4bcc3", "user": "芮芮", "q": "醫師您好，我目前事前藥已經連續服用快2年，但因昨天去急診被診斷突然有急性肝炎並且打了抗生素還帶回了口服抗生素服用，除了擔心抗生素的問題以外也想讓肝的負擔變小，因此想臨時停藥不知道這樣是否是可以的？（目前新的一包才吃到第五天）另外三天前有從事性行為，所以也擔心如果停藥是否會有機率懷孕🥺再麻煩醫師解答，感恩", "large": [], "small": [], "tier3": []}, {"no": "95d27707", "user": "匿名", "q": "我女朋友吃了RU486結果醫生說還沒完全排感覺又開了Ergonovine現在已經吃了一天吃三次現在吃了第二天還沒流血是正常的嗎", "large": [], "small": [], "tier3": []}, {"no": "28a96ba9", "user": "小李", "q": "抱歉醫師我想請問一下。同房的時候只有用手互相幫對方，沒有真正的性行為。但是怕會有前列腺液跑進去，在事後兩小時內有去看醫生吃了事後避孕，醫生說卵泡變少了，前幾天就排完卵了。2/3號吃完2/9號來了6天的月經，跟平常完全一樣，前一兩天也有血塊。上一次的月經是在1/9號。我們在吃完事後藥19天（2/22）到診所看。照了超音波跟驗孕都是陰性。醫生說可以100%確認沒有懷孕。這樣子機率還大嗎。謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "522ce1a7", "user": "阿真", "q": "您好前幾天跟男朋友性愛，前面先幫他打手槍然後成功射精，再來戴保險套然後戴反，重新帶，最後成功插入，我是安全期，請問懷孕的機率大概是多少，謝謝", "large": [], "small": [], "tier3": []}, {"no": "8aea5404", "user": "小來穴", "q": "吃完ru486多久後可以進行房事！謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "ab15155c", "user": "11", "q": "醫生您好：目前已吃完悅己第一盒，停了七天，但在第七天時就先吃了第二盒的第一顆，才想到要第八天才吃，這樣會影響避孕效果嗎嗎？那可以繼續吃完之後一樣停八天在吃第三盒嗎？在服用第二盒期間分泌物很多，（服用避孕藥沒有漏掉過，只有在第二盒提早一天吃）有點怕是不是在排卵，第二盒也沒有第一盒的副作用，比較擔心第二盒因為提早吃一天效果不好", "large": [], "small": [], "tier3": []}, {"no": "b6762c98", "user": "Cherry", "q": "請問FSH濾泡激素指數100.69就確定更年期嗎？月經就不會在來？去年8月抽血檢查出來，後來吃荷爾蒙藥ㄧ個月月經有來之後又沒來，就改吃中藥調經一個月有來ㄧ點像是幾滴這樣也沒用護墊，後來在吃2個月中藥調經就來正常量，到現在又沒來今天有來一樣幾滴血，中藥已經有2個月沒吃了，月經也快2個月沒來，1/25抹片檢查正常，請問這樣出血正常嗎？需要看醫生嗎？還有這期間會懷孕？", "large": [], "small": [], "tier3": []}, {"no": "d89b6382", "user": "Yu", "q": "醫師好我在2/4驗出懷孕後就診發現已懷孕五週當天服用Ru486第一劑隔兩天回診服用第二劑2/10回診已確認排出至今仍有微微出血2/22與男友行房無套採體外射精想問有無懷孕可能？可否吃事後避孕藥？以及之前都有吃事前避孕藥（愛己）調經若想吃什麼時候能夠再服用呢∼謝謝！", "large": [], "small": [], "tier3": []}, {"no": "e0f59bb0", "user": "小新", "q": "由於發現月經延期尚未來，去診所看完後驗過尿確定沒有懷孕，醫生開了norinatablets5mg(諾莉娜錠)的藥給我，請我一天三餐飯後吃，原本醫生是說在吃的過程月經應該不會來，請我吃完後月經來再回診，但我目前只吃了三顆(前一天晚上、今天中午、今天晚上)就發現月經疑似來了，有流出一些咖啡色的濃稠液體，但沒有像月經來時流出較大量的血色，不確定這樣是否是正常現象?如果月經真的來了有需要先停藥嗎？還是繼續吃呢？另外由於較晚起床，所以沒有吃到早餐，只有中午和晚餐各吃了一次，這樣會有影響嗎？若沒有吃早餐就空腹吃藥的話可以嗎？由於明天剛好是星期日，診所沒有開門無法直接去診所詢問，希望能夠儘速得到答覆，解決煩惱，謝謝您", "large": [], "small": [], "tier3": []}, {"no": "f5c1b523", "user": "小佐", "q": "女友長期有服用事前避孕藥（悅己）習慣，2/16（經期第1天）為停藥日第5天；理論上，2/19（經期第4天）為新一盒藥的第1天服藥日，但忘了吃。現在是2/22，為第4天服藥日，但至今尚未開始吃新一盒的事前避孕藥。想請問，該從什麼時候重新開始吃事前避孕藥？因為看醫生們的其他回答，停藥後會來月經，在月經來的第一天或第五天再開始吃第一顆但女友月經剛走，因此不確定該如何判斷？感謝醫生答覆，辛苦了", "large": [], "small": [], "tier3": []}, {"no": "625e160b", "user": "Josephine", "q": "原本陰道內外都沒有癢的症狀，婦科醫生開了欣黴素藥膏biomycinointment搽陰道裡面，搽了三天之後，陰道內及外陰部都開始癢，這樣正常嗎？這是過敏還是藥物的正常反應?", "large": [], "small": [], "tier3": []}, {"no": "6d909582", "user": "芊芊", "q": "醫生您好請問我最後一次月經是去年的9月初，一直到現在都沒來，有去抽血檢查，顯示動情素只有25，醫生說臨近更年期，有開維妮娜給我吃，是不是吃了以後就會月經來了？會延緩更年期到來嗎？聽說吃荷爾蒙會罹患乳癌是不是真的?但是我都沒有更年期那些症狀，只有月經不來，我這個年齡更年期會不會太早?", "large": [], "small": [], "tier3": []}, {"no": "80ddbe3a", "user": "匿名", "q": "女友2/15來月經比平常提前了10天，為期來了7天，2/23有無套，在裡面一陣子，沒有射在裡面，這樣需要吃事後藥嗎下一次月經來大概是什麼時候這樣算安全期嗎懷孕機率高嗎經期參考12/291/252/15", "large": [], "small": [], "tier3": []}, {"no": "d4d58c68", "user": "Cynthia", "q": "張醫師您好，我的女友平時月經週期穩定，app預測月經預計2/19來潮，因早有計畫2/19要出國旅遊，慎重起見我們於2/3到附近的婦產科診所向醫師諮詢並且開立延經藥美婷那，當天醫師告知於2/16開始吃藥，一天服用三次，一次吃一顆。於是2/16午餐與晚餐飯後開始服用，但是於2/17早上吃完藥女友開始覺得胃異常不舒服，痛到無法起身。當下立刻緊急叫了救護車緊急送急診，照了CT和超音波都顯示未出現異常，但當下女友還是痛到受不了捲曲身體，打了兩支止痛藥還是沒有效果，坐也不是躺也不是。急診科醫師當下診斷為胃潰瘍，也開了胃潰瘍的藥物回去服用，但在此之前女友並沒有發生過任何相關的疾病過，家族也未曾有相關病史。我們懷疑是服用美婷那三餐份量的藥物開始急性發作，造成女友嚴重胃痙攣。查詢了衛福部美婷那用藥仿單，建議服用劑量為一天一顆，但是該婦產科診所卻開立了一天三顆份量讓我女友服用，因此很慎重的懷疑是否為醫師開高劑量造成女友副作用發作嚴重到要坐救護車掛急診。", "large": [], "small": [], "tier3": []}, {"no": "d68a5fe5", "user": "萱", "q": "我懷孕4週2/8號吃了第二劑藥物，現在已經沒有流血了但這幾天有很多的透明液體可以拉絲的那種是因為藥流不乾淨嗎？還是說是正常現象呢？", "large": [], "small": [], "tier3": []}, {"no": "f1715a70", "user": "林先生", "q": "醫生您好，請問男方有分泌前列腺液且有在女方陰道口處摩擦，但是女方有穿內褲且內褲上有淫水，男方沒穿內褲。這樣有機率懷孕嗎？", "large": [], "small": [], "tier3": []}, {"no": "1a47a0c5", "user": "TING", "q": "曹醫師您好想請問，最近這幾個月月經來第八天開始都會有土黃、黃褐色的月經、分泌物，大概第１０天才轉成淡黃色或沒有，之前有看過婦科醫師，檢查都沒問題，想請問這樣還有需要再找其他醫師檢查嗎？還是這是正常的？另想問以前我的經期都５天乾淨，這一年都變成７天，這樣也是正常的嗎?再麻煩醫師回覆，感謝您", "large": [], "small": [], "tier3": []}, {"no": "3a0676f8", "user": "西", "q": "您好，我吃事前吃了好幾年，在24年的12月停藥，停到現在月經還是沒來。但想再繼續吃，這樣的話需要去婦產科看醫生拿催經藥再繼續吃嗎？還是直接吃即可？已排除懷孕可能，最後一次性行為之後還有來2次月經（有吃藥的情況下）", "large": [], "small": [], "tier3": []}, {"no": "13794fc3", "user": "JJ", "q": "醫師你好，我因為長期經期太亂，前幾個月又突然子宮異常性出血，去長庚婦產科診斷後醫生開給我《悅己》事前避孕藥來調經，2/11晚上（也是我月經來後第五天）開始吃第一顆，想請問如果服藥中途月經突然來是繼續把剩下的藥吃完後，一樣停7天藥再服用第二盒藥嗎？但這樣就沒有在經期來的第五天服用也沒關係嗎？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "4c73258e", "user": "J", "q": "上次經期1/25-1/31，是第一次吃事後藥的經期。今天2/26上午與男友發生性行為，全程戴套體內射精，但拔出時發現保險套還在體內，橡膠圈在陰道洞口，發現後立刻移除。男友表示沒有精液流出，都在保險套內，不確定是否要吃事後避孕藥，目前先買了艾伊樂但尚未服用。由於1月已經吃過一次(莉潔婷)，月經在1月中及一月底共來了2次，不確定是否要再服用事後藥。", "large": [], "small": [], "tier3": []}, {"no": "5083fd95", "user": "小瑄", "q": "請問醫師我已經12週了，可以做人工流產嗎？請問費用多少呢？", "large": [], "small": [], "tier3": []}, {"no": "6fda9839", "user": "楊先生", "q": "女朋友服用完第二劑之後只有感到強烈不適都沒有出血狀況會是什麼原因？該怎麼處理呢？", "large": [], "small": [], "tier3": []}, {"no": "8a431dcf", "user": "匿名", "q": "醫師您好：今日在整理房間時候手有碰到垃圾桶有稍微壓到裡面垃圾之後馬上上廁所忘記先洗手手有碰觸到下體後來才想到男友有打手槍習慣距離他打手槍有8小時不知道這樣有沒有懷孕可能感謝醫師回復", "large": [], "small": [], "tier3": []}, {"no": "93d413d4", "user": "花花", "q": "12/30~1/3正常來月經，在1/9發生性行為，1/10吃事後避孕藥，在1/16∼1/21撤退性出血，後來還有發生性行為，到現在2/27月經還沒來，這幾天有感覺肚子脹、胸脹、左側卵巢痛、疲勞、有分泌物流出的感覺、情緒變化大，用排卵試紙驗呈現弱陽性。請問這是因為事後避孕藥造成的延遲嗎？月經大概什麼時候會來呢？我應該現在開始吃催經藥嗎？之後應該如何調養身體呢？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "aec33da1", "user": "Rex", "q": "1/26無套內射當天有吃事後避孕藥2/7月經有正常來腹部有疼痛2/20有戴套行事沒有射但2月整個月都有持續來一點點的月經有去看婦產科醫師說骨盆發炎黃體素不足導致出血吃了醫師給的藥就沒有持續流血了吃了婦產科醫師給的藥讓身體的黃體素足夠有可能會懷孕嗎還是需要等到3月的月經是否有來才可以知道有沒有懷孕", "large": [], "small": [], "tier3": []}, {"no": "483dcae2", "user": "清", "q": "間隔一年後又開始服用事前藥，於週一開始服用（固定於5:30），在週六忘記服用，週日5:30PM仍有服用，至週日晚間8點多突然發現昨日未服用於是當下多吃一顆，請問這樣還有避孕效果嗎？若剛好下週四有無套性行為，需改用保險套或其他避孕手段嗎？", "large": [], "small": [], "tier3": []}, {"no": "abd84561", "user": "林", "q": "醫師您好，2/7時有尿道感染過，服藥結束後發現尿道跟陰道中間看起來像腫一顆球，看不到陰道口，也沒有疼痛感，這是尿道憩室需要去檢查嗎？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "ae200ee1", "user": "蓉", "q": "因為12月月經沒來(沒有性行為)，所以去看婦產科後是內分泌失調，一直在吃藥調經，有調比較正常，結果這個月月經來四天，今天開始沒血但一直有分泌物帶一點黃色跟透明色不黏稠偏水，沒有異味，只要上廁所都會擦到一些這種分泌物。腹部為悶悶的但不明顯，請問是淋病嗎？但很多年沒有性行為只有自己用情趣用品。因為要繼續吃調經藥，請問跟藥有關係嗎？", "large": [], "small": [], "tier3": []}, {"no": "e8178166", "user": "L", "q": "醫生您好，女友上一次月經是1/27，2/13下午4點有發生性行為(先無套來回幾下就戴套了無射精）事後發現app顯示13號當天是排卵，隔天14號約晚上10點吃了一顆Ella這期間女友沒有身體不適也沒有出血，2/26又發生一次性行為(無帶套體外後又戴套一次）app推算27號會來月經但目前還沒有來。問：請問醫生這樣會懷孕嗎問：需要再補一顆事後嗎補充：女友的經期本身就不太規律", "large": [], "small": [], "tier3": []}, {"no": "99c5a41c", "user": "a77775", "q": "因戒癮治療驗尿被驗出可待因及嗎啡濃度22244ng/ml.514ng/ml，但從未使用過海洛因，只有因為感冒頭痛吃了頓痛特膠囊及甘草止咳水，請問有什麼辦法可以證明我沒有使用海洛因", "large": [], "small": [], "tier3": []}, {"no": "5dba7d94", "user": "匿名", "q": "醫師您好我想請問，我長期全身不一定部位會痛，很微的痛，幾秒就沒，頻率也都不一定，不影響生活，但就是會沒有原因得痛，想請問醫師為什麼會這樣？謝謝", "large": [], "small": [], "tier3": []}, {"no": "fa1297bc", "user": "匿名", "q": "醫師您好，我是前幾天問身體會不同部位痛那位先生，我想請問，如果我的情況不影響生活，那還要去看醫生嗎？另外醫師我還想到一個問題，就是我長期胃食道逆流，但逆流的東西都沒酸沒有刺激性，那我這樣還要去看醫生嗎？謝謝醫師", "large": [], "small": [], "tier3": []}, {"no": "1e613002", "user": "小安", "q": "診所醫生說，一開始病毒感染引發感冒，發燒咳嗽喉嚨痛，但沒有鼻炎。幾天後轉細菌性，支氣管炎夫、一點點鼻水，改吃抗生素。但是夜咳非常嚴重，有痰、晚上兩點到早上七點幾乎停不下來，診所醫生說已經開最重的止咳藥依然無效，一週下來，沒有一天能睡覺，也因為小感冒卻幾乎無法工作。回診所，醫生說沒有變嚴重可以不用再去，但我生活已經快要因為咳嗽失眠失控。中間有試過吃一點助眠藥，但咳嗽起來更難過，請問建議還能看什麼科求診。", "large": [], "small": [], "tier3": []}, {"no": "cef3074b", "user": "Linda", "q": "請問醫生，因需求我臨時安排2/15本週六健檢，項目有抽血、尿液、肝臟、X光檢查、癌症篩檢等但我2/12今日已經有吃維他命B、魚油，請問是否會影響呢?以及本週五晚餐有聚會吃麻辣鍋，是否該取消呢?十分感謝醫生的答覆", "large": [], "small": [], "tier3": []}, {"no": "d2d11911", "user": "陳", "q": "最近發現體能越來越差，決定開始運動和控制飲食本人身高163體重90從剛開始運動到現在每天早上量測體重幾乎都掉一公斤多這是正常的嗎？我是下班先快走半小時回到家在做半小時有氧運動ㄒㄧ面是我最近量測體重的數字前天88.9、昨天88.7今天早上量86.7", "large": [], "small": [], "tier3": []}, {"no": "54c96f4f", "user": "文", "q": "醫生你好，昨天要睡覺前突然壓到胸部中間（應該是胸口吧？）然後壓下去會痛，然後我想說是不是我的疑心病我就一直壓，越壓越痛，到隔天就變成悶痛了。不知道胸口中間的位子本來就是按壓就會痛還是我需要看哪科嗎？謝謝醫生回覆。", "large": [], "small": [], "tier3": []}, {"no": "70daaecd", "user": "Liean", "q": "醫生您好今天帶小孩去吃下午茶，帶小孩去上廁所時洗手沒注意到洗手台下面有放馬桶刷跟夾子，兒子的腳不小心有提到夾子雖然有穿鞋子，後來問他說他沒有用手摸，但有跟他說不能玩那不是玩具那個是髒的…但我自己還是有點擔心兒子會因為鞋子踢到夾子被傳染什麼疾病或是夾子有病毒傳染到性病或愛滋等等的嗎，先生是說我太緊張了，希望醫生提供您的看法，因為好不容易才有兒子的，我真的很擔心，謝謝。", "large": [], "small": [], "tier3": []}, {"no": "75c66955", "user": "Rachel", "q": "您好,請問我檢驗維生素B12免疫超標(VIT-B12)值是4613,高於正常值,我平日每日服用B12為500mg.請問什麼原因可以讓檢驗值如此高?又有何潛在風險?是否需注意什麼?目前值己高於正常值,是否該停止服用每日500mg的補充?謝謝.", "large": [], "small": [], "tier3": []}, {"no": "0d846b23", "user": "Loc", "q": "醫生你好，我在吃過年買的開心果的時候不知道為什麼吃到一顆很苦的，當下有把它吐掉但感覺有吃到一點，後來查網路好像是可能過期還是壞掉才會苦，然後說可能有毒素黃麴毒素致癌或是肝臟衰竭…看了覺得很可怕，想請問醫生我這樣不小心吃到一點點那個毒素會食物中毒很嚴重嗎…剛剛我也叫家人不要再吃那個開心果，結果我爸還是照吃…他說他沒有吃到苦的。因為之前新聞也看過有吃粄條也是食物中毒很可怕，不確定自己剛剛這樣只吃到一點點是不是就非常嚴重了@@希望醫生可以給建議謝謝。或是有什麼情況我就要注意去看醫生。", "large": [], "small": [], "tier3": []}, {"no": "6a18fde1", "user": "熏", "q": "只要搭學校校車，人都很多只能站著，我經常在校車上一半的路程時，呼吸不到空氣、眼前一片黑、冒冷汗、耳鳴聽不太到外面的聲音，然後很想放屁還有腳軟感覺自己隨時會倒，下車之後才有感覺比較好，差不多一兩個月會有1到2次這種情況，請問我大概是什麼問題？", "large": [], "small": [], "tier3": []}, {"no": "4ddcb6ae", "user": "heifetz", "q": "醫師好。我三個月前和三個月後血液檢查MPV數值皆是9.0，請問這是什麼原因，網上查是凝血功能問題，目前有吃力清之，和納豆激酶5000fu，請問會不會有影響？謝謝您", "large": [], "small": [], "tier3": []}, {"no": "e643e53b", "user": "匿名", "q": "您好，我左邊嘴巴上方鼻下方的那塊區域突然紅腫按下去會很痛，請問我該怎麼辦？", "large": [], "small": [], "tier3": []}, {"no": "0b1d923e", "user": "K", "q": "葉醫師您好：我近年來體檢膽固醇與三酸甘油酯常有偏高現象，2023年7月TC225LDL-C151HDL-C49TG1602024年6月TC206LDL-C150HDL-C46TG1132025年2月TC205LDL-C152HDL-C49TG69膽固醇的部分沒什麼變化，但三酸甘油酯明顯下降，想請教醫師這樣的變化是否有什麼異常呢？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "e6132d8d", "user": "匿名", "q": "想問一下醫生，不吃早餐會膽結石嗎？我大多是晚上一點到兩點間睡覺，但是都會賴床到早上十點多，常常都會是十一點多吃午餐（早午餐那種），晚餐則是五點到六點吃，這樣會造成身體的問題嗎？長期的話是指多久呢？", "large": [], "small": [], "tier3": []}, {"no": "1baf4418", "user": "潘", "q": "醫師您好想請問高齡八十幾歲的長輩全身皮膚瘙癢，有擦乳液跟止癢藥膏（皮膚科醫生開藥）還是止不住癢，尤其晚上癢到醒來、睡不著，超過三個月了。因為長輩心臟不好，長期睡眠不足與瘙癢對精神和日常生活造成極大的影響，看了幾家皮膚科皆無好轉。請問除了乳液保濕、止癢藥膏，還有什麼方法可以緩解瘙癢？除了皮膚乾燥，是否可能有其他原因造成異常極度瘙癢呢？請問該諮詢哪一科別，謝謝解答。", "large": [], "small": [], "tier3": []}, {"no": "446a4ba4", "user": "安", "q": "醫生您好我有感染皰疹二型，之前於藥局購買抗病毒口服藥藥師表示預防皰疹復發要兩天吃一顆，我嘗試了一個月皰疹依舊復發中途🈶連續服用十天後突然改成兩天一顆，後來上網查同品牌藥需每天服用一顆。請問我這樣吃連續十天一顆後突然改成兩天一顆會不會使病毒產生抗藥性？我現在改成說明書上的每日一顆的吃法還會有效嗎", "large": [], "small": [], "tier3": []}, {"no": "7f555362", "user": "先生", "q": "醫生好，請教一下若家中長者高齡八十四歲，小腿前側有傷口，曾經結痂但未痊癒，之後滲出組織液，情況反反覆覆（時乾燥時滲流）已經兩個月左右，皮膚科醫生開藥膏與口服藥皆未痊癒，因本身沒有糖尿病跟血糖問題，傷口如此久未癒合，是否該做什麼檢查？病人自述傷口為皮膚搔癢，自己抓破皮的，全身癢的情況長達三四個月，乳液天天擦未改善。本身有心臟問題，目前有傷口的那隻腳稍微脹痛、有點水腫，但傷口看起來沒有潰爛。", "large": [], "small": [], "tier3": []}, {"no": "95dcc496", "user": "安", "q": "醫生您好我有感染皰疹二型，之前於藥局購買抗病毒口服藥藥師表示預防皰疹復發要兩天吃一顆，我嘗試了一個月皰疹依舊復發中途🈶連續服用十天後突然改成兩天一顆，後來上網查同品牌藥需每天服用一顆。請問我這樣吃連續十天一顆後突然改成兩天一顆會不會使病毒產生抗藥性？我現在改成說明書上的每日一顆的吃法還會有效嗎", "large": [], "small": [], "tier3": []}, {"no": "d955397c", "user": "xiao", "q": "醫師你好2個月前因為胸部不舒服掛了急診，出來的結果x光抽血心電圖都沒有問題。但後續變成會痛所以找了心臟科，心臟科的醫師認為有明顯的痛並不是心臟問題。前前後後跑了34次急診都是說沒有問題，直到後面又找了另一間醫院的心臟科醫師，做完心電圖跟x光也是說沒有問題，醫師也說不需要做更進一步的檢查，醫師認為是過度焦慮所以引起的。直到現在還是時不時會胸痛甚至還會背痛鎖骨附近痛都是在左邊，但每次都不是很痛而且持續時間又都很短，可能換個姿勢挺胸就不會痛了，又或是注意力不在胸部上有別的事情轉移注意力的話，就幾乎沒有特別的感覺。不會特別痛但一直三不五時來一下覺得很煩。想請問這樣需要跑去看胸腔科嗎？還是應該去看精神科？或是去一般的診所檢查就好了呢？", "large": [], "small": [], "tier3": []}, {"no": "0ac1dfbc", "user": "魚", "q": "醫師您好去年小弟友人網購了一罐威而鋼而本人因好奇心以及朋友慫恿下有吞了一顆想當然爾沒有任何作用比對包裝及藥品外觀已證實是假藥此藥比正牌威而鋼顏色深且粗糙溶水呈乳白色塊狀且不易溶但事後越想越不對因網上說不肖商人製偽藥可能用含鉛塗料或砒霜（砷）等磚灰水泥地蠟等有害物質我不曉得到底吞了什麼物質想請教醫師：我現在需要去做砷汞鉛等重金屬檢查嗎？是否需要做肝腎功能損傷或是其他檢查？我就只吞了那麼一顆現在想到實在很擔心煩請醫師指導該怎麼做謝謝", "large": [], "small": [], "tier3": []}, {"no": "54ee3877", "user": "小h", "q": "這陣子只要天氣寒冷手腳就會特別冰冷，腳底甚至會有發紫的現象，另外最近勃起也有困難，醫生說可能是縱慾過度的緣故，不知道這中間是否有關聯？勃起這部分是只需要禁慾就會好了嗎？大概需要多久時間？腳底又是什麼問題？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "95d0ab8d", "user": "顏", "q": "醫師您好，前陣子感染流感後（流感是在診所看診的），大概過兩個禮拜後，還是有咳嗽、胸悶、喘、呼吸不順的問題，讓我感到很困擾，個人平時有抽菸習慣。想要詢問醫師我該掛胸腔內科還是心臟內科要做個詳細檢查？", "large": [], "small": [], "tier3": []}, {"no": "dd2fe381", "user": "珍", "q": "常常會覺得氣不夠所以幾乎24小時都會一直想深呼吸，但有時候深呼吸會覺得吸不飽氣有時又可以，久了變得有點不太舒服，身體會異常緊繃、緊張和一直出手汗，有點心慌感，不像是恐慌發作因為我恐慌發作是不會那麼久，偶爾伴隨頭暈症狀，想請問有沒有可能是自律神經失調?該怎麼辦?", "large": [], "small": [], "tier3": []}, {"no": "e4d11f8b", "user": "凌薪", "q": "1/29(三)通宵打麻將至隔日1/30(四)早上5：30才去休息，一整晚坐圓木板凳，中間為了不駝背都挺直著腰正坐。遊戲結束起身後後背跟腰都很痛，睡覺醒來後變得更痛，尤其右肩胛骨下緣一整片位置，只要翻身起身，動用到背部力量時就會抽痛的厲害，要幾秒才會舒緩。1/30晚上再次玩了3小時麻將，變得越來越痛。有做5分鐘暖身運動舒展筋骨，當下有稍好。但隔日睡醒仍然翻身背部及劇烈抽痛(腰跟其他身體部位都不太會)1/31有吃一次消炎止痛藥，並貼酸痛貼布。但1/31與2/1起床都沒較舒緩，起床後有越來越痛的趨勢。2/1晚間有心悸狀況有吃藥(有輕度自律神經失調，醫生有開藥物，約莫吃一年了，去年11月心臟超音波檢查都很正常)2/2晚間有擦酸痛藥膏，揉搓背部患處。翻身時不太會痛，但起來時動到背部肌肉，仍十分疼痛，另外下床後發現右腳拇指發麻，約莫持續了2-3個小時，目前稍有緩解，另外起床吃飯前有30分鐘的左胸悶症狀。想詢問目前我可以做什麼動作緩解症狀，吃甚麼，或是不可以做什麼？另外目前症狀應該在明天開工後去看一下醫生嗎？(要看什麼科別)還是慢慢等他恢復即可？", "large": [], "small": [], "tier3": []}, {"no": "fcf66aaf", "user": "莊", "q": "我從1/31∼2/4連續戴了手錶五天，睡覺時都有摘下來。在中途五天摘下來後也沒感到不適或麻痛。2/4的隔天把手錶摘掉後覺得左手手腕上表皮做動作的時候有點麻麻的，但外觀上沒有什麼異常，直到現在2/7號麻麻的感覺還沒有好轉。想問現在這種症狀應該再過幾天放著不管讓它好，還是要去看什麼科來檢測治療呢？", "large": [], "small": [], "tier3": []}, {"no": "620f11e7", "user": "匿名", "q": "我想問一下醫生有關於扁平足的問題，因為我雙腳站立大概三分鐘整個腳底都會很酸，所以只要有要站立超過三分鐘的場合，常常會站成三七步（一隻腳站立一隻腳休息），想問一下我的足印有像扁平足嗎？因為在兵役體檢時檢查的醫生看了壓力板後先勾了異常後又塗掉再勾正常（沒有現場問是因為那個醫生的臉很臭）那我自己踩紙出來的圖形算是有明顯扁平足嗎？（附圖https://mork.ro/JOVaB#）", "large": [], "small": [], "tier3": []}, {"no": "74d52e00", "user": "達爾", "q": "在去年12/11號的時候，在練籃球當中，被球丟到腳導致跌倒，當時發生的太快手腕直接撐地，爬起來後手碗完全不能轉動，只要動一點就會很痛(1~10分有6分)也有微腫，隔天有去就醫，醫生說是韌帶受傷，需要休息6週以上，位置是TFCC那個地方，但至現在已休息兩個月了，手腕還是沒有好過程也有去復健什麼的，目前手腕可轉動但到一定位置還是會痛，運動久之後也會變得更痛，有時也會卡卡的，想問醫師我這個會不會留下舊傷之後會一直復發？是不是這個比一般的韌帶扭傷還嚴重？大概多久才會比較好？", "large": [], "small": [], "tier3": []}, {"no": "21ed6848", "user": "Belle", "q": "醫生您好，我常年有肩頸酸痛的問題，因為我習慣右側趴睡且不易變動睡姿，又長時間坐辦公室維持同一姿勢，去年右臂的壓迫痛嚴重到被診斷出五十肩，做了幾次葡萄糖注射，目前持續做復健，角度已幾乎回復，但是手臂外側肌肉還是常常感到疼痛。這期間有不時改換左側睡，但反而左臂外側也開始有壓迫痛，但正躺又無法入睡，只好忍著些許的壓迫痛持續左右交換側睡。也買了側睡抱枕試著改善。工作則是盡量端正坐姿，也避免長時間低頭看手機。現在想說找個適合自己的枕頭（原本是隨便拿家中有的枕頭睡），所以換了幾顆枕頭。高硬枕的話，手臂是不會痛了，但最近發現一整晚側趴睡有開始導致輕微腰痛（以前不會可能是因為還年紀輕？）。換成中枕或高軟枕後，入睡時是側睡，但會半夜醒來發現變成正躺，而且鼻塞嚴重變成用嘴巴呼吸，得用噴鼻劑才能緩解（本身也有嚴重的鼻子及皮膚塵蟎過敏）。換低枕更糟糕，只能用正躺難以入睡，睡醒後頸酸痛不已。硬是側睡又會壓到手臂外側疼痛難耐。我知道其實正躺對脊椎肩頸最好，但目前感覺還只能在中枕或高枕中妥協一種，想問問醫生您會建議之後睡哪種枕頭，謝謝您。", "large": [], "small": [], "tier3": []}, {"no": "0cf2c458", "user": "紅茶", "q": "醫師你好，問題比較長但拜託幫我看完，已經困擾快一年了。我身高174公分體重120公斤，血糖血脂正常但血壓160。113年5月左右因為腰痛問題（現在已經沒有）去復健科診所做拉腰牽引，因我的體重所以拉的力道很強，有一次拉完右側腰部延伸到右腳不舒服，過兩天腳踩地就非常痛幾乎沒辦法走，發現腳踝“整圈”都是腫的，無瘀青。當時醫生說是單純腳踝扭傷（但我自己根本沒印象有扭到）也就相信醫師一直覺得是扭傷，持續做復健大約一個月（電療，短波），但病情沒起色。後面另一家診所醫師懷疑可能是靜脈血栓，轉診至醫學中心做大腿的血管超音波，也有做過血栓抽血的檢查，報告皆為正常。最後在醫學中心持續看復健科，從去年六月左右持續復健到現在，上個月還打過自費PRP，但也沒什麼用。後面腳有消腫一點點，但內側踝關節還是很腫且伴隨瘀青，外側的話一點點腫也是有些微瘀青但沒內側那麼明顯。疼痛分數如果原本是滿分10分的話，現在大約是6分痛，早上起床的時候覺得腳踝有點僵硬，且起床時腳踩地板前面幾下最痛，再來整天就還好這樣。有次復健科老師幫我看了一下病歷，說我的韌帶其實沒什麼受傷，可能是其他循環的問題，但我自己查健康存摺的病歷上面記載是韌帶有受傷。曾經懷疑過是痛風，但尿酸正常且痛風的症狀似乎不可能持續這麼久。腳踝超音波檢查照片連結：https://imgur.com/a/hvMvdY7以下是我的腳踝檢查報告骨骼肌肉超音波檢查報告單[AnatomicalLocation]　　rightankle[Findings]　　1.rightdeltoidligamentsprainwitheffusionisnoted.noobviousvascularity.　　2.Underultrasoundgudiance.platelet-richplasmawasinjectedaroundthedeltoidligament.Thepatientunderwenttheproceduresmoothlyandwentback.[Diagnosis]　　1.rightdeltoidligamentsprainwitheffusionisnoted.　　2.Underultrasoundgudiance.platelet-richplasmawasinjectedaroundthedeltoidligament.Thepatientunderwenttheproceduresmoothlyandwentback.　　Pleasecorrelatewithclinicalcondition.問題1.復健拉腰是否可能會影響血管方面的循環導致腳踝腫脹呢？（小腿沒有腫，只有腳踝）問題2.是否有可能是僵直性脊椎炎或是類風濕關節炎導致的呢？因為有時候睡覺正躺睡的話半夜會胸背痛，會被痛醒。問題3.超音波照片中韌帶是否有損傷呢？問題4.體重過重是否也會有此問題懇請醫師指點一條明路，接下來我該怎麼辦。拜託了，謝謝醫師。", "large": [], "small": [], "tier3": []}, {"no": "b4697b61", "user": "kelly", "q": "醫生您好，因為近期右眼皮跳動嚴重剛好前陣子落枕有去拍Ｘ光，顯示頸椎好像有突出然後去物理治療的時候，按到某個位置眼皮會跳動得更厲害物理治療師認為應該同樣是頸椎問題造成眼皮跳動想問如果是否需要到醫院更近一步檢查是否真的是頸椎問題造成的呢還是應該看神經內科檢查謝謝", "large": [], "small": [], "tier3": []}, {"no": "69339be7", "user": "鬥仔", "q": "陳醫師想請教側躺時呼氣到底會感覺像地震", "large": [], "small": [], "tier3": []}, {"no": "63906876", "user": "hong", "q": "醫生我最近一個月時不時會胸痛，早上不太會感覺到，但慢慢變晚特別自己在房間會覺得特別有感，有的時候在左胸部下方，有的時候靠近中間，有的時候靠近左腋下，有的時候右胸也會痛，或是脖子肩膀，但常痛一下然後沒了痛一下然後沒了，不會胸悶，也不會特別喘，跑步也不會特別痛。有去急診，x光，心電圖，抽血，都沒有問題，說是筋膜痛。有幫我預約心臟科，但醫師說：會痛那不是心臟問題，心臟痛是很模糊的而且痛到走不了路。我並沒有做其他的檢查。後來過了一兩個禮拜因為牙齒麻麻的，有去看牙醫且洗牙。當天晚上還是時不時牙齒會麻而且手也會痛，因為有上網看到一些非典型症狀很害怕就半夜去掛急診，x光，心電圖，抽血，一樣沒有問題，一樣是判斷是筋膜炎。醫師我現在的問題是，一牙痛牙麻手麻，我反而會覺得是我心臟問題，雖然急診說我沒問題，但因為上次醫生沒有安排檢查，所以很心慌感覺要再去一次。可是我現在並沒有特別胸痛，他就是一陣一陣的，沒有注意就不會特別覺得他不舒服，但心臟痛應該不可能忽略吧？就是牙齒麻痛胸部不會痛我覺得是非典型症狀，胸部痛我卻又覺得是心臟問題，一有症狀我就覺得要看醫生，但上次醫生說不是心臟問題，我到底該怎麼辦呢？不是心臟問題要看什麼呢？還想請問我在急診時被說是高血壓，然而我常去的診所醫師說我的血壓正常，這是什麼意思呢？哪個才對呢？", "large": [], "small": [], "tier3": []}, {"no": "4626a746", "user": "myoi", "q": "大概前幾個星期的某個晚上，我突然覺得全身不舒服，看applewatch的紀錄，我的心率大概落在80-120，而且會有噁心想吐的症狀。後來覺得狀況有改善後就去休息睡覺了，這幾天的晚上有時候也會突然心跳變快，而且左手的食指和中指也會有麻麻的感覺，甚至會有幾秒鐘是沒知覺的。這幾天都有戴著applewatch睡覺，但很奇怪的是，睡覺的時候心律範圍都落在50-70，但是我起床後心跳又會變快，然後覺得全是都不舒服，一直有心慌的感覺。", "large": [], "small": [], "tier3": []}, {"no": "9a058775", "user": "小黑貓球", "q": "昨晚偏頭痛後心跳就開始有變快的趨勢，applewatch的心率大  "large": [], "small": [], "tier3": []}, {"no": "6a7a2618", "user": "匿名", "q": "我心臟痛去做心導管檢查早上檢查完醫生說做很多支架會有生命危險要跟外科討論下午外科醫生說他們討論完結果支架/繞道都可以做要我們討論要哪一個第二天一個帶著很多年輕醫生的人(不是檢查的那位)跟我們介紹兩種方式的優缺點之後說看檢查的資料做支架沒有很困難,我們討論說6X歲要做開胸手術加上要長的復原時間所以選擇支架第三天進手術房後第一天檢查的醫生跑來罵說都說有生命危險為啥要做支架之後雖然過程中胸口跟背後非常痛不過最後順利完成,之後觀察1天半後出院了我想問做太多條支架真的會比繞道危險嗎?(心導管檢查圖片有劃紅圈的有6個/3個也有堵塞但是沒劃(同張紙))(去林口長庚檢查的)", "large": [], "small": [], "tier3": []}, {"no": "21f71982", "user": "許", "q": "醫生您好，想向您諮詢以下問題，先在此感謝您的回覆。之前就會偶爾胸痛（極偶爾），但從大約ㄧ到兩週前有得過腸胃炎之後，不論坐著或躺著胸口（不確定是不是心臟問題）常會有陣陣的痛或是悶悶的感覺，偶爾也會刺痛，直到近幾日越來越頻繁並且時間也越來越長，目前發文的當下（2/233:34）剛經歷躺下睡覺翻身時胸口突然一陣痛且不間斷（沒辦法形容的痛，但感覺不是刺痛）平躺後還是悶悶的痛，後續嘗試深呼吸的方式都沒有用，最後坐起來胸口偏左部位還是再痛，逐漸轉變成有點刺痛的感覺，嘗試將身體縮起來也會感覺到痛，目前疼痛情況是躺著有翻身動作大於平躺等於坐著，想向您詢問是何原因以及該就醫嗎？", "large": [], "small": [], "tier3": []}, {"no": "f9ab9e10", "user": "許", "q": "醫生您好，想向您諮詢以下問題，先在此感謝您的回覆。之前就會偶爾胸痛（極偶爾），但從大約ㄧ到兩週前有得過腸胃炎之後，不論坐著或躺著胸口（不確定是不是心臟問題）常會有陣陣的痛或是悶悶的感覺，偶爾也會刺痛，直到近幾日越來越頻繁並且時間也越來越長，目前發文的當下（2/233:34）剛經歷躺下睡覺翻身時胸口突然一陣痛且不間斷（沒辦法形容的痛，但感覺不是刺痛）平躺後還是悶悶的痛，後續嘗試深呼吸的方式都沒有用，最後坐起來胸口偏左部位還是再痛，逐漸轉變成有點刺痛的感覺，嘗試將身體縮起來也會感覺到痛，目前疼痛情況是躺著有翻身動作大於平躺等於坐著，想向您詢問是何原因以及該就醫嗎？", "large": [], "small": [], "tier3": []}, {"no": "6710130f", "user": "Jack007", "q": "何醫師您好，我在約6-7年前發生心跳加快現象，就醫後被診斷為持續性心房顫動，之後採用藥物控制，每日服用康肯（降心率）及拜瑞妥(抗凝血），多年以來生活、上班皆可正常，算是滿意，主治醫生也認為若是生活正常，就繼續施以藥物控制，和平共存，並不需要採用3d電燒侵入式治療。及至去年底，醫生建議我一種新型手術--FPA，它的手術時間減半（安全性提高）、復發率及傷害副作用皆小，在國外及國內皆有充分臨床實証，惟需自費xx萬元，醫生並且考量我的心臟有擴大（約10%）情況，故認為可趁心臟還未惡化採用FPA，效益較大。依上述情況，在不考慮費用條件下，我有2個选擇：1）因無急迫性，故選擇繼續服藥，直到對藥放不能滿意才做FPA，2）應趁心臟還未惡化先採用FPA，若惡化再做則效益有限。請教您的看法，我應考量那些因素來做決定，感謝您！", "large": [], "small": [], "tier3": []}, {"no": "6c4d7d62", "user": "安安", "q": "您好，近期在很多心臟診所有看到ABI這個項目，但我本身有做過心導管手術，請問可以測量嗎?因為我看這個儀器是四肢同時測量，會不會有壓力影響到我的心導管，謝謝。", "large": [], "small": [], "tier3": []}, {"no": "0d730020", "user": "李先生", "q": "前些日子作過心臟專科檢查，結果如下：請問要如何精確解讀？謝謝您AO:35IVS:7LVEF:81.62LVPW:7LV:111LA:28LVEDD:49RV:22LVESD:25LVEDV:113LVESV:22AORTA:Rt/IVS:二尖瓣:TR列表:輕度VSD列表:無角86二尖瓣流量[Dec.時間]：162PA流量[峰值V]：105PA流量[加速。時間]：162TR[峰值流量]：236TR[峰值PG]：22多普勒波描述：E/E'：9.41。正常腔體尺寸和壁厚2。左心室收縮力好3。二尖瓣脫垂4.無PHT5的輕度TR。二尖瓣血流E/A逆轉，伴隨輕度舒張功能障礙", "large": [], "small": [], "tier3": []}, {"no": "0ba58f8b", "user": "陳怡均", "q": "請問醫師我小孩因疑似有雙主動脈弓，要做EKGgatedwidevolumecardiovascularstructuralAngiogram，請問輻射劑量高嗎？", "large": [], "small": [], "tier3": []}, {"no": "bc72b50e", "user": "廖", "q": "醫生您好想請問照X光時會貼的板子材質是否會殘留輻射或細菌？我上週去醫院檢查時，照完胸部X光後要照頸部，但指示人員指示得不清楚我沒理會到他要我抬頭，他就幫我喬，我才知道是要抬頭，過程中我的嘴唇有不小心碰到那塊板子，因為嘴唇比一般皮膚脆弱所以有點擔心，能否幫我解惑一下這樣有沒有風險呢？", "large": [], "small": [], "tier3": []}, {"no": "2a3175bb", "user": "C小姐", "q": "王醫師您好，因右腎水腫因懷疑跟婦科問題相關，醫師安排了CTU腹部+骨盆腔，本身罹患過甲狀腺乳突癌，姊姊有罹患過子宮內膜癌目前皆已治癒，所以有點擔心同時照2部位輻射的劑量，請問這樣輻射的劑量大約多少呢？是在安全範圍內嗎？通常骨盆腔是不是應該照磁振造影沒有輻射會比較好呢？另外照完CT有什麼幫助代謝排出的方法呢？比如多喝水之類的。謝謝王醫師🙏", "large": [], "small": [], "tier3": []}, {"no": "c53e0b16", "user": "小美", "q": "我每次運動完手舉起來整個都是酸臭味還黑黑的醫生請問這是怎樣", "large": [], "small": [], "tier3": []}, {"no": "b5c28d5a", "user": "F", "q": "您好醫師：我的女兒約中班時手掌就有一顆軟軟的腫塊會稍微隨著時間一點點變大，不會痛！有帶去手部整形外科看過也有照過核磁共振攝影，醫生沒具體的說孩子的手掌是什麼東西但建議不影響生理心理不用急著開刀，開刀孩子血管細小反而有風險，孩子的腫塊有時還會忽大忽小，變大時我們又急著再帶去複診…大致上也是保守處理等待時間再開刀∼如今也已經四年級手部腫塊也跟她和平共處到這麼大（約三公分），今天她的手掌腫塊又稍微變大部分部位還有點痛…所以想說上來問問其他醫生的意見∼感謝🙏還是能推薦我什麼醫生或者去掛什麼科呢？", "large": [], "small": [], "tier3": []}, {"no": "760fd953", "user": "菈拉", "q": "請問醫師，假如以前做過鼻中膈彎曲手術，後面要再做正顎手術會有鼻子塌陷或其他風險嗎我屬於戽斗，上顎要外移的狀況，聽說外移後鼻翼會變寬，鼻子可能朝天忽然想到我做過鼻中膈手術，不知道會不會有什麼潛在風險!", "large": [], "small": [], "tier3": []}, {"no": "50f0d0f7", "user": "小明", "q": "想請問如果剛自慰完（我是男生）上廁所發現在準備要尿出時會有一下灼熱感跟次痛感是怎麼回事呢而在過了一小時後再次上廁所發現仍有這樣的症狀這樣需要看醫生嗎還是過了一段時間就會自己好了呢", "large": [], "small": [], "tier3": []}, {"no": "5c7f6d72", "user": "Peter", "q": "醫師您好:我確診急性攝護腺炎後積極配合治療,在抗生素治療(用藥是喜伏菌)第一週後就自覺沒什麼症狀了,在第28天回診時醫師有幫我做攝護腺檢查,當時完全無壓痛感,醫師確認康復可不必再吃抗生素,但我自己擔心仍繼續吃了一週,總共35天療程;但在停藥的第一天晚上就開始會陰及陰囊有壓痛感了,然後每隔一天症狀越明顯;請問醫師:(1)網上資料說4-6週能痊癒,請問我為何無法痊癒?到底是那個環節出了問題?(2)後面會進行其他治療嗎?謝謝醫師的意見..", "large": [], "small": [], "tier3": []}, {"no": "9536d113", "user": "賢", "q": "主任您好，我是一名男同志，在十二月初有發生危險性行為，我是插入方，對方onprep且並沒有任何明顯的問題。但約莫一個月後，對方告訴我他有出現生殖器疣，在看完許多網路的資訊及科普文章後還是有一些問題想釐清。1.對方那時候的HPV可能是在潛伏期（沒有明顯症狀）肛門在後來才發展出肉眼可見的菜花，想請問病灶的存在與否會影響我得到菜花的機率嗎？如果會的話，想請問我得到菜花的機率是否會因為我跟他發生關係時沒有明確病灶而相對較低？2.有些醫生好像認為在如廁後完整的洗手（仔細清潔指甲、指縫等地方二十秒）以及70%酒精擦拭可以降低傳染給同住他人的可能性，但有些人認為可能需要用到消毒水才有用，想請問哪一個應對方式相對接近事實？3.儘管我目前還是沒有明確的病灶，想請問只有接觸過的部位有可能長菜花嗎？還是說即便沒有接觸對方的肛門，任何黏膜都有可能長？麻煩醫生撥空回覆，感謝", "large": [], "small": [], "tier3": []}, {"no": "11fbf928", "user": "k先生", "q": "醫師您好，我勃起時發現我的兩條陰莖淺背靜脈一條在陰莖中間一條在陰莖左邊，那麼我的陰莖深背靜脈位置還是一樣會在兩條淺背靜脈中間嗎，還是會在陰莖中間呢？謝謝您！", "large": [], "small": [], "tier3": []}, {"no": "90f7b429", "user": "DONY", "q": "您好，本人陰莖皮膚上有一條一條黑紋，除此之外沒有任何發紅腫脹，流膿，異味等異狀，查網路資訊可能為手淫或性行為頻繁造成黑色素沈澱，但心裡有疑慮想再跟醫師確認看看為何如此？", "large": [], "small": [], "tier3": []}, {"no": "3fb0282d", "user": "阿祐", "q": "醫師你好，請問我沒有勃起時包可以完全推下清洗，但是勃起時會因為龜頭太大無法推下，請問這樣有需要去切除包皮嗎？如果沒有切除會有很大的影響嗎？", "large": [], "small": [], "tier3": []}, {"no": "e0aad5d3", "user": "黃先生", "q": "簡醫師您好，我今天去動包皮槍手術，醫師有說不是用狼和，是用有點像剪刀外型的那把，繳費單上好像有寫ZSR，請問這個品牌尺寸30有幾根釘子?一個月後我想確認釘子是否完全脫落避免埋在肉裡，謝謝您。祝您身體健康、平安快樂!", "large": [], "small": [], "tier3": []}, {"no": "44d5ed7c", "user": "允", "q": "醫師您好家族無攝護腺病史2024/12/3psa6.762025/1/2psa5.22025/1/20psa5.8超音波報告說有低回音病灶目前已經有排尿症狀尿急尿流比較細其他症狀沒有我google腫瘤在超音波會顯示低回音下次回診要切片了我想問超音波低回音腫瘤的機率高嗎?很焦慮", "large": [], "small": [], "tier3": []}, {"no": "8175b4fb", "user": "黃先生", "q": "簡醫師您好，請問包皮槍術後龜頭和尿道口敏感，網查資料說可以塗一些物質減少摩擦，請問有推薦的產品嗎?或者有其他的解決方式?謝謝您，祝您身體健康、平安快樂。", "large": [], "small": [], "tier3": []}, {"no": "b1e8dd18", "user": "黃先生", "q": "醫師您好，我今天去動包皮槍手術，醫師有說不是用狼和，是用有點像剪刀外型的那把，繳費單上好像有寫ZSR，請問這個品牌尺寸30有幾根釘子?一個月後我想確認釘子是否完全脫落避免埋在肉裡，謝謝您。祝您身體健康、平安快樂!", "large": [], "small": [], "tier3": []}, {"no": "f6754e5c", "user": "Rei", "q": "醫師好打擾八年前按時打過四價HPV疫苗3針最近補打九價HPV疫苗但診所櫃檯告訴我這樣這樣只需要兩針也就是那天打完1針兩個月在1針即可不用打3針請問這樣的資訊正確嗎還是需要完整打完3針", "large": [], "small": [], "tier3": []}, {"no": "0896f804", "user": "匿名", "q": "醫生你好目前26歲平常都有DIY的習慣也都有正常性行為性慾也蠻大的但是前陣子突然發現陰莖及陰囊在一般情況下會變的冰冷且麻麻的，還有萎縮的情形（且萎縮蠻多的）但是勃起及射精或是性行為都沒有受到影響，不過最近有發現之前射精完後可以馬上再接著繼續，這症狀出現後就沒辦法了之前是都有正常運動習慣近幾年開始都沒什麼運動且變的肥胖想請問醫生這些症狀可能是什麼原因導致的", "large": [], "small": [], "tier3": []}, {"no": "302635d6", "user": "豪豪", "q": "醫師你好我是HIV帶原者U=U「測不到體內有愛滋病毒，就等於不會傳染」，跟男友無套被男友內射，此時過程中我有流血，請問這樣男友會被傳染到HIV嗎", "large": [], "small": [], "tier3": []}, {"no": "d8d4c337", "user": "PeterChan", "q": "醫師您好:我最近在治療攝護腺炎,醫師開的抗生素是喜伏菌,已知此類抗生素不能與含鈣離子等的制酸劑一起服用,那請問其他胃藥如(1)癒吐寧(2)舒必朗(3)耐適恩錠等可否一起服用嗎?還是一樣要隔2小時以上?謝謝..", "large": [], "small": [], "tier3": []}, {"no": "fc05ffd7", "user": "黃先生", "q": "醫師您好，請問包皮槍術後龜頭和尿道口敏感，網查資料說可以塗一些物質減少摩擦，請問有推薦的產品嗎?或者有其他的解決方式?謝謝您，祝您身體健康、平安快樂。", "large": [], "small": [], "tier3": []}, {"no": "2bb221ef", "user": "陳先生", "q": "醫生我想要請問一下，我的睪丸左小右大，左邊的軟度比右邊還軟，冷的時候縮起來右邊會硬硬的，但熱的時候散開又變軟了，右邊下面靠後方的地方也有一顆軟軟的東西延伸到上面管子，請問我這樣正常嗎…", "large": [], "small": [], "tier3": []}, {"no": "c0f98319", "user": "小瓜", "q": "今年22歲沒有性經驗，前幾天想打手槍時突然硬不起來，這幾天開始看片硬不起來，要用手才可以硬，但手一停很快就軟了，雖然可以在硬的時候射，但馬上就軟了，之前還會硬一下子，以前一天大概都打1∼2次，現在突然變這樣就很害怕，情緒很低落也沒什麼性慾，現在都只敢看還會不會硬，我這樣是陽痿了嗎，需要看醫生嗎", "large": [], "small": [], "tier3": []}, {"no": "49a79df5", "user": "Jack", "q": "醫師您好，我弟弟前幾天做了腎臟電腦斷層，發現有結石，醫師就用軟式輸尿管鏡去取石，手術結束，就跟我們說，最大結石被息肉包住了，無法取出，要再動二次手術，請問，電腦斷層不是結石跟息肉都看的到嗎?手術之前也打過震波", "large": [], "small": [], "tier3": []}, {"no": "4b17891f", "user": "小瓜", "q": "杜醫生您好，我是215474，像我這樣的狀況，想問這樣算是心因性嗎，會不會是縱慾過度造成的，停止自慰一段時間後會恢復嗎？", "large": [], "small": [], "tier3": []}, {"no": "4b18fa0d", "user": "政", "q": "醫生您好，我最近發現馬眼周圍在勃起時會有幾顆小顆粒凸起，但在勃起逐漸退掉或是沒充血時又會消失，目前沒有任何疼痛或分泌物等不適。查閱了很多資訊以及其他提問者得到的回覆，好像很多醫生都認為那有可能是陰莖本身的組織，想請問醫生那會是菜花嗎？或是這個症狀是可以怎麼治療、處理的嗎？感謝醫生的回覆", "large": [], "small": [], "tier3": []}, {"no": "4b5a0b82", "user": "小瓜", "q": "今年22歲沒有性經驗，前幾天想打手槍時突然硬不起來，這幾天開始看片硬不起來，要用手才可以硬，但手一停很快就軟了，雖然可以在硬的時候射，但馬上就軟了，之前還會硬一下子，以前一天大概都打1∼2次，現在突然變這樣就很害怕，情緒很低落也沒什麼性慾，現在都只敢看還會不會硬，我這樣是陽痿了嗎，需要看醫生嗎", "large": [], "small": [], "tier3": []}, {"no": "55513136", "user": "老王", "q": "結紮手術的醫生說傷口復原後可以交作業或自己來，滿20次或是三個月後可以驗精蟲，請問滿20次後是否還要禁慾幾天才能驗精蟲？假設前一晚有交作業或自己來，隔天還可以驗精蟲嗎？有規定精液需要超過多少量嗎？", "large": [], "small": [], "tier3": []}, {"no": "973dfe42", "user": "林先生", "q": "醫生好∼因為近期中了HSV-2已在治療中、目前已快痊癒、也知道這個病目前沒有疫苗能醫治、想請問如果之後一直都有長期固定再吃祛疹易500MG（一天一顆）這樣再跟太太性行為時還有可能會傳染給對方嗎（假如都無外傷無症狀的情況下）？是不是吃到兩顆一天就更不會傳染了呢？也有看到有些中醫有介紹他們的配藥吃幾個療程就可以完全不會復發是真的嗎？治療原理是什麼呢？謝謝醫生解答", "large": [], "small": [], "tier3": []}, {"no": "a2dad8d2", "user": "Kv", "q": "醫師您好，目前20歲BMI:25,近1年發現最近較少晨勃現象，且看片時無法自行勃起，必須刺激才能硬起來，勃起時若無刺激大約20秒就軟，性行為時可正常射精，但有些時候會到一半時變軟或者直接軟掉，勃起時硬度約為帶皮香蕉，想請問這個狀況有需要進一步治療嗎？", "large": [], "small": [], "tier3": []}, {"no": "c4c075a8", "user": "成", "q": "我在今年1/31去看了泌尿科，醫生說了是生殖器皰疹，陸陸續續吃藥吃到2/10。我的皰疹一共有兩個個傷口，其中一個已經癒合長出一層薄皮，觸碰已經沒有感覺，但是另外一個到現在還在輕微出血，不確定是不是因為要退下包皮清潔傷口拉扯到出血請問我應該繼續擦外用藥膏嗎（健聯）或是不管它讓它自己好", "large": [], "small": [], "tier3": []}, {"no": "dc5fd457", "user": "L", "q": "杜醫師您好：小弟目前19歲，大學生，身高178公分，體重約莫56公斤，體態偏瘦。今年寒假某次自我安慰時，發覺睪丸不見一顆，但站立起來後又出現了；再一次時又發現只有一顆睪丸，於左下腹部位置（腹股溝）以手下推，結果把睪丸推下來了，有些驚訝。小弟兒時檢查皆沒有隱睪症，上網搜索資料得知天氣寒冷時會有此狀，稱有「伸縮性睪丸」，應屬正常。惟自該次將睪丸向下推後，腹股溝隱隱作痛。檢視睪丸應該是沒有凸起之血管，只有正常可見之血絲，且疼痛感似乎並不來自於睪丸或陰囊。小弟寒假約一個月多，居北部縣市，冬天乾冷，皆窩於床上或坐於電腦桌前，無久站，除相較平時自我安慰之次數較多外，無劇烈運動，有熬夜而作息較紊亂，好飲含糖茶飲。目前腹股溝作痛已1∼2天之久，睪丸及陰囊似乎沒有特別之異狀，小弟在想，因伸縮性睪丸跑入腹股溝而手動將其推下，是否會有傷害到相關部位而導致此種不適症狀存在？雖非疼痛難耐，然而仍感不適，可否服用止痛成藥？若真為精索靜脈曲張，依照本人年齡現狀，是否必須開刀而無替代方案？（小弟單身，且坦白而言，若有幸結為連理，亦無生子意願）感謝杜醫師祝萬事如意闔家安康", "large": [], "small": [], "tier3": []}, {"no": "dffc769a", "user": "路人", "q": "醫生您好，我的睪丸左右大小有明顯差距，軟度也有差，左邊比較軟，右邊比較不軟但不硬，去年發現右邊下方靠近後面有一顆軟軟的東西，我順著摸上去有一條軟軟的東西請問這是副睪嗎，之前沒檢查過不知道這是原本就有的還是突然有的，有點擔心是不是癌症", "large": [], "small": [], "tier3": []}, {"no": "10aaedbe", "user": "路人", "q": "醫生您好，我的睪丸左右大小有明顯差距，軟度也有差，左邊比較軟，右邊比較不軟但不硬，去年發現右邊下方靠近後面有一顆軟軟的東西，我順著摸上去有一條軟軟的東西請問這是副睪嗎，之前沒檢查過不知道這是原本就有的還是突然有的，有點擔心是不是癌症", "large": [], "small": [], "tier3": []}, {"no": "54f89d50", "user": "匿名", "q": "醫生您好：想問我以往都是以包皮摩擦龜頭方式自慰，想問這樣會不會影響以後做愛？我沒有包莖問題，洗澡時也都會把龜頭翻出來洗；有嘗試過包皮翻開來直接摩擦自慰但極度不舒服，用了沐浴乳潤滑後有改善但嘗試幾次仍然無法高潮射出，如果要改善此問題（降低龜頭敏感度比較不會痛？）有沒有方法，例如平常讓龜頭外露摩擦內褲或其他？因為本人不太想割包皮還是其實不用做出改變此狀況是正常的？（我還是處男不太知道做愛的實際情況）謝謝醫生解答，因為也不敢問別人所以不知道什麼才是正常的⋯", "large": [], "small": [], "tier3": []}, {"no": "8a0cd48b", "user": "L", "q": "杜醫師您好：小弟是#215518問題的19歲L同學。關於上次的問題，有一些問題想進一步請教。小弟隱隱作痛的位置就是稱作「腹股溝管」（inguinalcanal）的地方，應就是連接到陰囊的那個通道。自己的痛感來源是位在中央微微偏左，非常靠近陰囊上方的腹部皮膚底下，會有一些輕微痛楚，此痛楚是「痠痛」的不適感。目前痛楚沒有來自陰囊及睪丸，檢視其等外表也都沒什麼問題，性器功能目前也都正常。小弟有參考#184510問題的情況，個人認為或許類似，因為自己沒有疝氣，也排除精索靜脈曲張，唯一就是手動將睪丸自腹股溝管推回陰囊後造成後續一些疼痛的情形。想請教這是否真的就是身體內部因為物理關係所導致的傷害？亦即如撕裂或碰撞之類的受傷，所以之後可能有一些發炎而引發的不適？如果是這樣的話，請問這是否能讓它自然修復痊癒呢？本人也好運動，常打籃球，在休養階段，開學過後與同儕一起打球的話，會有甚大的影響嗎？有何須特別注意可以照顧患部的要點嗎？以上請教杜醫師。於醫師休息時段叨擾，小弟深感不好意思，再麻煩您了！敬祝平安順心", "large": [], "small": [], "tier3": []}, {"no": "dd937de0", "user": "潘安", "q": "前幾天和另一半性行為，可能頂太大力突然ㄆㄧㄚ一聲有點嚇到但當下跟日後也不會痛而且當時也是硬的沒有馬上軟，外觀那些都很正常沒有彎曲腫大變色，也能正常勃起長度都一樣充血後角度也沒有變，唯一不太一樣的是硬度沒有跟之前一樣硬，甚至只有硬一些。上網爬文很多，目前是看到類似白膜撕裂傷需休息6周，想問以我的情況休息就能慢慢復原嗎？", "large": [], "small": [], "tier3": []}, {"no": "e0057227", "user": "Su", "q": "想請問一下醫師，我平常喝水大概1000~1800之間，沒在運動所以流汗的排泄基本沒有，午跟晚餐有包含一碗湯1.目前有一個狀況是早上跟下午3點過後的排尿狀況，大概是半小~1個小時左右就會想去上廁所，但大概只上了100~150cc左右而已，這樣算是膀胱過動症嗎?因為最近看了一些憋尿的後果跟症狀，導致我有點緊張後最近注意到就變成這樣2.這個狀況更之前就有，是早上就正常的上廁所量跟次數，但中午大概1:30~2:30躺床休息時就會每隔10~15分鐘跑一次廁所，大概每次不超過100cc，跑個4~8次後就又不會了，請問這樣是正常的嗎?3.從2024年12月到現在都如1所述的情形，在懷疑是不是膀胱過動，有幾次我會嘗試憋尿試試，但到10~15分鐘時就會很想衝去廁所，請問這樣子會不會導致尿液迴流傷到腎臟注:前幾天有去泌尿科做過尿液檢驗跟超音波，沒感染膀胱也尿得很乾淨，但醫師看完後只說是我壓力太大，叫我放輕鬆就好，上述我想問的他也沒回答就草草打發走，所以想請醫師解惑一下。", "large": [], "small": [], "tier3": []}, {"no": "26f2bf0f", "user": "123", "q": "醫師您好大概幾個月前有不安全性行為到泌尿科診所，看了2位醫師都說不確定是否為菜花，病灶大概出現一個禮拜。上禮拜已做完STD7合一，病灶處的HPV檢驗結果是16跟61型陽性，其他為陰性，想請問醫師一般不是第6、11型會比較有可能出現菜花病灶嗎？還是說其他型會有不同的病灶表現？以下附圖，請問醫師若不是菜花，還有可能有哪些鑑別診斷呢？https://lurl.cc/cOEIl另外想請問醫師目前是再觀察可以嗎？還是我可以直接擦樂得美了？（泌尿科醫師有開給我擦）以上問題，再麻煩醫師了，謝謝", "large": [], "small": [], "tier3": []}, {"no": "812cb19b", "user": "李長安", "q": "因我有在神經外科看診,醫生有開這種藥,查藥使用於末梢血管循環障礙,能否服用此藥可以改善充血狀況呢?", "large": [], "small": [], "tier3": []}, {"no": "5e123202", "user": "Pin", "q": "父親2/4自費攝護腺雷射汽化術&切片（術前無症狀psa7.86&切片格里森6分）想詢問醫師，術後為何夜尿次數變多？進一步檢查MRI排在2/20是否時間上會過早？謝謝", "large": [], "small": [], "tier3": []}, {"no": "7ecc26cf", "user": "小嗨", "q": "醫生您好兩個月前因為Diy中途突然軟掉蛋蛋縮進去後來硬不起來過了幾天緩緩是能勃起但手握就軟掉而且站著明顯腫脹，青筋很明顯尤其是根部中間包皮也突然多了很多皺褶陰莖未勃起但摸起來感覺硬硬的，也很難勃起握著不行但隔著褲子摩擦可以昨天去看泌尿科說我攝護線腫大？我才29...而且排尿正常但吃完藥精液倒流我還該吃嗎還是我應該做什麽檢查我怕是海綿體受傷之類的", "large": [], "small": [], "tier3": []}, {"no": "f597e75f", "user": "陳", "q": "醫生您好，前陣子龜  [], "small": [], "tier3": []}, {"no": "03b622fa", "user": "小言", "q": "在21號時割了包皮，醫生說我血液循環好，血管容易出血，22號因繫帶部分腫大，醫生動了手術把血塊切出來，之後幾天趨向正常，今天已26號，困擾我很久的是小便的問題，只要小便時，尿液沒辦法一瞬間就出來，會好像卡在龜頭一樣，擠了很久才出來，就很像要尿出來時強制憋尿一樣，尿出來時馬眼會有強烈疼痛感，導致我現在很不想要尿尿，一天只尿了3-4次想請問醫生：1.這個強烈疼痛感是正常的嗎2.這個強制憋尿感久了我會不會怎樣3.一天只尿3、4次沒關係嘛4.有什麼辦法可以緩解或治療這個症狀抱歉問題比較多因為我很怕謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "43cfe83a", "user": "G", "q": "每天晚上都會夜尿一次平常尿尿有時候要等個5~10秒才會尿出來感覺自己上廁所的速度似乎比同齡人慢一點（大概慢10秒）沒有斷斷續續但排尿到最後流速會變很慢（中間的速度應該算正常）有時候一個小時就會有輕微尿意但大概超過兩個小時後才會真的很急有去看醫生尿液、X光結果都正常但醫生沒幫我做攝護腺的檢查想請問是否有可能是攝護腺肥大？但感覺以自己的年紀應該不會吧…", "large": [], "small": [], "tier3": []}, {"no": "5b482ac8", "user": "G", "q": "每天晚上都會夜尿一次平常尿尿有時候要等個5~10秒才會尿出來感覺自己上廁所的速度似乎比同齡人慢一點（大概慢10秒）沒有斷斷續續但排尿到最後流速會變很慢（中間的速度應該算正常）有時候一個小時就會有輕微尿意但大概超過兩個小時後才會真的很急有去看醫生尿液、X光結果都正常但醫生沒幫我做攝護腺的檢查想請問是否有可能是攝護腺肥大？但感覺以自己的年紀應該不會吧…", "large": [], "small": [], "tier3": []}, {"no": "5bd44f55", "user": "徐小姐", "q": "您好，我爸爸目前56歲，最近抽血數值N末端前B型利納太25.1，且最近上班搬重物一個小時血壓會降到90幾80舒張壓會降到50幾背部會很酸但是兩三個小時以後又恢復了，想問問是什麼問題，謝謝", "large": [], "small": [], "tier3": []}, {"no": "8141b74e", "user": "C", "q": "醫師您好因為頻尿跟急尿問題已經有掛泌尿科，並且診斷為膀胱過動症醫師有開牟靜錠(半顆)+歐舒緩釋錠1顆每天早上吃上個月連續兩周服用感覺改善很多幾乎已經跟正常時一樣但自我因為鬼剃頭掛免疫，免疫風濕科醫師開了奎寧(必賴克廔)給我吃以後，每天早晚各一顆頻尿的症狀就又開始了，才喝一些水不到一小時就很想上廁所我不知道這兩者是否有關連，但先前詢問免疫風濕科醫師以及藥物諮詢都說沒關係我自己後來早上也會隔半小時再吃可是還是一樣耶我是否應該先停藥奎寧呢?", "large": [], "small": [], "tier3": []}, {"no": "1382e433", "user": "匿名", "q": "1我的生殖器長了小部分菜花目前以雷燒擦藥但還沒打九價那我可以跟別人舌吻或是親吻嗎2請問這樣我的精子會有病毒嗎3我洗衣服需要跟其他人分開洗嗎", "large": [], "small": [], "tier3": []}, {"no": "4b5af1dc", "user": "Leo", "q": "醫生您好，關於上次的問題我想再問，戒掉之後有辦法改善嗎，如果有要戒多久，因為我看a片跟手淫的頻率很頻繁", "large": [], "small": [], "tier3": []}, {"no": "533a71e0", "user": "小志", "q": "經常自慰會造成掉髮嗎？", "large": [], "small": [], "tier3": []}, {"no": "b3de9b44", "user": "SAKU拉", "q": "請問醫師最近剛做了一些檢驗腎絲球過濾率只有80.97請問以一個35歲的人來說這樣算正常嗎，會有什麼風險疑慮嗎?另外聽說腎絲球沒有辦法逆轉一生就這樣的量那有辦法改善腎絲球過濾率嗎?", "large": [], "small": [], "tier3": []}, {"no": "eb04a692", "user": "陳先生", "q": "醫師您好，想請問1，感染菜花後施打九價疫苗，是否能避免自己傳染病灶附近的皮膚（嘴唇上感染過，冬天嘴唇容易乾裂有傷口）.2,在某些網站上看過，感染hpv後免疫系統會在1至2年清除體內病毒，但男女不一樣，男生只有極少數免疫系統會產生抗體，不知以上是否為真.3,承上，假入沒有電燒或其他手段去除病灶，只靠免疫系統清除病毒，假設真清除了長在身體上的疣依舊會傳染嗎？4,菜花清除後超過半年沒復發，但近期似乎有帶狀皰疹，不曉得是否會復發，如果會，是否以後免疫力下降時，基本都會再復發呢？", "large": [], "small": [], "tier3": []}, {"no": "f9a6247d", "user": "曾先生", "q": "醫師您好請教攝護腺超音波80公克，有阻塞到輸尿管，是應該只刮除阻塞部位還是應刮除到多餘肥大部分，抑或是刮除至正常40公克以下。若是應刮除多餘部位如何判定多餘部位，謝謝。", "large": [], "small": [], "tier3": []}, {"no": "2bc57429", "user": "胖惇惇", "q": "去年10月初上廁偶爾有感覺尿道些微灼熱感，10月中有與朋友發生不安全性關係，10月中也有泡湯水池做SPA，水柱沖大腿內側時有勃起，換腳時不小心水直沖尿道，當時有痛了一下，之後小便時灼熱感越來越明顯，於11月底就醫•第一家診所看診了一個多月，期間有服用抗生素，服用近一個月，服用期間症狀有改善，之後醫師說已服用太久須停止抗生素，過一陣子後灼熱感又出現(期間無性行為)•於今年一月中後更換一間泌尿科診所，也自費做了性病篩檢，期間遇到過年有先服藥，過年期間無意間擠壓尿道發現有一小滴白微灰色感的分泌物出現(性病篩檢抽樣後才後發現)，發現後每日觀察均在睡醒時才比較能擠出一小滴，年後回診看篩檢報告(披衣菌、淋病、梅毒等均陰性)及跟醫師說有白灰色分泌物，醫師開抗生素(得喜寧膠囊)，服用一週症狀有改善後(灼熱及分泌物都沒有了)，之後醫師拿掉抗生素更改藥物繼續治療(藥物治療是說明治療前列腺肥大症所伴隨的排尿障礙)，於第2週時尿道灼熱感又出現1.2次，且每日早上又可以擠出白灰色分泌物，回診與醫師說狀況又復發，醫師回復應該是不會在復發，前家診所及現在都有服用過抗生素，暗示我不要再找該朋友...但我在去年10月中那次性行為後就沒有過性行為了....連親摸舔都沒有......今天看診有自費打一針及開四顆Zithromax日舒錠250mg/TAB一次服用•想詢問：1.篩檢沒問題是會有其他症狀會造成有白灰分泌物(分泌物量少，睡醒比較能擠出一小滴)嗎?2.如果吃完Zithromax日舒錠後還有症狀有需要改去大醫院做更詳細的檢驗嗎?", "large": [], "small": [], "tier3": []}, {"no": "858fe805", "user": "C小姐", "q": "杜醫師您好：上週超音波發現右腎中度水腫，因懷疑是婦科問題壓迫造成，所以醫師排了斷層掃描腹部與骨盆腔，但驗血腎指數不太好Cre1.5/eGfr40.5，上網查等於慢性腎臟病期數3b,請問這數值打顯影劑是否有腎損傷風險？現在的醫生說擔心的話就不打顯影照斷層但就只能看是否有結石，若沒結果可能就要做侵入式膀胱鏡檢查，聽起來感覺不打顯影劑後續檢查會花更多時間，但打了又害怕會有洗腎的風險，有詢問現在的醫師是否打顯影劑有預防腎損傷方式，比如顯影劑打少一點，醫師回覆我沒辦法打少一點，都是依照體重打，我體重有82kg,那是否需要打很多顯影劑？另外醫師說可以多喝水跟發泡錠預防，也有另外也有問檢查室，檢查室說Cre2以下都可以做，所以是否我是過度擔心了呢？謝謝您", "large": [], "small": [], "tier3": []}, {"no": "d64920aa", "user": "大銘", "q": "杜醫師您好:在美國呼吸道乳突瘤的成人和兒童大約有17000人,這種病是很罕見,主要是由hpv6和hpv11所感染,目前沒有完全根治的方法,只能以手術,雷射和干擾素輔助治療,這些治療只能去除病灶,沒辦法清除殘留體內的hpv病毒,造成反反覆覆的複發,反覆手術多次,苦不堪言,所幸美國precigne生技公司研發hpv治療型疫苗(PRGN-2012)是以腺病毒載體製作,臨床HPV病毒清除效果非常好,也減少復發機會,這支HPV治療疫苗今年也已提出FDA上市申請,假設不久將來應該有機會能引進台灣,請問杜醫師,這支HPV治療型的疫苗也能治療生殖器感染(菜花)嗎?", "large": [], "small": [], "tier3": []}, {"no": "c57d29aa", "user": "匿名", "q": "您好，我本身是上班族，平時沒在做有氧運動(連重訓都沒有)，本人身形偏瘦(但BMI是正常值)，請問有什麼辦法可以讓自己看起來壯一點呢？如果都沒在運動多攝取高蛋白質的食物也可以增加肌肉量嗎？謝謝。", "large": [], "small": [], "tier3": []}, {"no": "cd2feba8", "user": "鄭", "q": "您好：市售\"水煮\"鯖魚罐頭標榜無食品添加物及不添加防腐劑，利用高溫殺菌保存營養價值，為了補充EPA、DHA、維生素D以及鈣質等，是否可讓3歲幼童每日食用呢？", "large": [], "small": [], "tier3": []}, {"no": "cc10f0e2", "user": "江小姐", "q": "1.食藥署之孕婦兒童魚類攝食指南中提及1至6歲兒童每周至少70公克，但未說1歲以下嬰兒副食品每周可食份量有嬰兒副食品魚類每周可食份量之建議嗎?2.國民健康署嬰兒一日飲食建議量10個月開始嘗試給予高品質蛋白質食物1-1.5份，是指生重嗎及每份含有7公克的蛋白質嗎是要參考食物代換表中不同種類豆肉魚的生重嗎?3.6-12個月嬰兒每天每公斤體重需要多少蛋白質,有查到每公斤體重1.2公克蛋白質或1公克蛋白質或國人膳食營養素參考攝取量（DRIs）第七版7∼12月嬰兒蛋白質需要量修定為2.1g/kgBW。哪一個才是正確?上述2.1g/kgBW中BW是指什麼?若嬰兒蛋白質攝取過量會造成身體負擔嗎?", "large": [], "small": [], "tier3": []}, {"no": "d1a51e32", "user": "阿奇", "q": "最近刷牙完注意到口腔內顎咽弓充血紅紅的舌頭下方有血絲然後舊齒牙齦的部分因為剛吃完飯塞牙縫有稍微刷比較用力不知道是不是這個原因導致血紅色軟顎的部分也有血絲我就上網查擔心是不是口腔癌特徵有點害怕但是我刷牙和漱口都沒有出血也不會感覺到疼痛請問如果都不會痛的話是否因為刷牙的關係導致?因為我習慣性連牙齦和上顎下顎還有口腔黏膜和舌頭都輕刷過一遍https://ibb.co/Gf7jPkynhttps://ibb.co/h3FS76shttps://ibb.co/wFrjXMpvhttps://ibb.co/rT8kt4Rhttps://ibb.co/zW83scdy", "large": [], "small": [], "tier3": []}, {"no": "4545a41e", "user": "susan", "q": "醫生您好：我的左上大臼齒曾經蛀牙但已補過銀粉和樹脂，最近一直感覺牙齒麻麻的，經2家牙科檢查及照X光皆說沒有再度蛀牙，但是觀察至今已近2個月狀況還是沒有改善，目前牙齒除了麻麻之外還伴隨著眼睛酸澀，且有時臉頰會抽痛一下我在去年11/28有拔除左上大臼齒旁的牙齒，左下的智齒也拔除並做局部矯正，不知道這樣會間接影響到左上的大臼齒嗎？牙齒麻麻，眼睛酸澀的問題一直困擾著我，想請教醫生，這狀況是否正常，還是我要再尋求其他醫生診斷？或是做些什麼處置？麻煩醫生幫忙解答？", "large": [], "small": [], "tier3": []}, {"no": "defec8f8", "user": "唐小姐", "q": "醫師您好：想在去看牙醫前做點功課。吃排骨時不慎導致下排側門齒有輕微的切削（牙齒後側靠近齒緣處有微小片的被削去薄薄一層），肉眼可見正面碎裂的鋸齒狀。請問有補救之法嗎－補牙或牙套等？另，網路上說若對刷牙用力所導致的齒頸部凹痕做填補，可能會有填補不久後即脫落、齒頸受力、或少數人刺激到牙齦等狀況，請問齒頸部凹痕填補是必要的嗎？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "2e3e1cc3", "user": "Joepro", "q": "醫生您好，我遇到了以下問題我在2/1凌晨3.睡前開始有上下顎的牙齒疼痛大約在6.後有所舒緩在2/2凌晨3.又開始疼痛且有延伸到臉頰太陽穴附近大約在5.6.服用藥局所購買的布洛芬止痛藥後有所舒緩但是睡醒後仍然有痛感並且吃布洛芬後沒有顯著效果（仍然有陣痛感），我也有嘗試普拿疼止痛加強腚（乙醯胺酚），但是仍然有陣痛感2/3早上9.去牙醫門診後牙醫師告知是顳顎關節的問題，醫師有幫我按摩臉頰以及太陽穴還有口內的拉伸及按壓，並且開立Muxalon以及Voren在大約10.30服用後11.30左右陣痛有明顯的改善但是在2/3晚上9.30服用藥物後仍然感到明顯的疼痛，在口中含住冰水可以改善疼痛但是如果沒有含冰水則會有明顯的劇痛（上下顎牙齒）不知道這樣的狀況醫生有什麼建議", "large": [], "small": [], "tier3": []}, {"no": "c188cc27", "user": "匿名", "q": "醫生你好，11月中時因為門牙牙齒做了根管，1/27但臨時假牙，但至今那顆牙齒用舌頭從內側推的話會痠(怪感)，一直推他的話不會持續酸，推的動作是突然間推到才會感覺酸那一下，持續的弄不會酸，吃東西都正常不會痛，喝熱冷的東西也都正常。也有諮詢牙隨專科表示x光及電腦斷層都是正常的。想問醫生這個狀況是正常的嗎?因為查了很多資料，都是會有痛的感覺，但我這個就只是覺得酸怪感(不會到不舒服，就是覺得怪怪的)，因為網路查抽完神經後的牙齒不是應該沒感覺嗎?在勞煩醫生解答了謝謝", "large": [], "small": [], "tier3": []}, {"no": "580ad400", "user": "匿名", "q": "醫生您好我過年前左下倒數第二顆牙齒照x光有牙周病的問題，當時醫生說有輕微侵蝕到一點骨頭，當天已經用藥水幫我類似洗牙清洗過，跟我說2/20回診看狀況有沒有改善，如果有就不用花24000做手術，當時醫生說這顆牙應該可以保住，手術機率一半，而這星期開始我那顆牙齦外圍反覆長了一小粒膿包，差不多都兩天自己破掉，又再長出來，已經反覆兩次了，而我目前只有刷牙到那區塊會不舒服，牙齦沒腫也沒流血，牙齒也沒鬆動，那我狀況是否有變嚴重呢？因為目前看我的醫生門診都滿好，除非現場排三個小時但也不一定是他本人幫我看，而且即使看了當天也無法治療，我的狀況可以拖到2/20嗎？謝謝醫生", "large": [], "small": [], "tier3": []}, {"no": "f14bd7c7", "user": "匿名", "q": "去看牙醫詢問咬合面黑黑的是否為蛀牙，醫生說是深層染色不是蛀牙想詢問噴砂美白還是有其他方法能消除咬合面染色.感謝醫生", "large": [], "small": [], "tier3": []}, {"no": "047aa6de", "user": "MOMO", "q": "我門牙2年前不知原因長了根尖囊腫，當初懷疑是蛀牙但檢查時也沒發現蛀牙，當初牙髓部醫生是說確實有些是不知原因的囊腫，目前那顆門牙已在2年前發現時根管治療完成且到現在追蹤2年了，囊腫幾乎已經消失，骨頭也長了回來目前影像上只剩下一點點黑黑的，醫生說他會在自己長，想請問主任，我目前那顆門牙需要裝上牙冠嗎?那要打牙釘嗎?因為我以前蛀牙抽神經的牙齒都會裝上牙冠但沒打牙釘，我看網路說打牙釘是牙齒結構變少才需要打牙釘支撐，不過我這顆沒蛀牙只是抽神經會有可能牙齒結構變少需要裝牙釘嗎?(因為後來我本來是看牙髓部但這裡告一段落了，將我轉去給一般牙科說要請它們重補樹酯，一般牙科醫生說我可以裝牙冠根打牙釘，不過都是看我自己，但我不知道怎麼辦@@他也沒給我建議)", "large": [], "small": [], "tier3": []}, {"no": "0d724b47", "user": "毛貓", "q": "醫生你好~我門牙不知原因長了根尖囊腫是2年前的事情，當初懷疑蛀牙但當時檢查後也沒發現蛀牙，那時候牙髓部醫生是說確實有些是不知原因的囊腫，目前那顆門牙已在發現時根管治療且到現在追蹤2年了，這顆根尖囊腫幾乎已消失，骨頭也長了回來目前影像上只剩下一點點黑黑的，當初醫生說他會在自己長回去，想請問醫生，我目前那顆門牙需要裝上牙冠嗎?那要打牙釘嗎?因為我以前蛀牙抽神經的牙齒都會裝上牙冠但沒打牙釘，看網路說打牙釘是牙齒結構變少才需要打牙釘支撐，不過我這顆沒蛀牙只是抽神經會有可能牙齒結構變少需要裝牙釘嗎?*(因我本來是看牙髓部但這裡他說告一段落了，將我轉去給一般牙科說要請它們重補樹酯，一般牙科醫生說我可以裝牙冠根打牙釘，不過都是看我自己，但我不知道怎麼辦@@他也沒給我建議~~)", "large": [], "small": [], "tier3": []}, {"no": "659d1b8f", "user": "mun", "q": "醫生您好，一週前(2/13)車禍，門牙撞到馬路，當時總共三顆牙齒出現疼痛症狀(兩顆門牙及左門牙旁邊那顆)，只有一點斷裂，無搖晃。至今(2/21)只剩下左門牙壓下時會痛，其他都已沒有疼痛症狀。昨天去醫院複診，醫生幫我電擊測試，結果說我左門牙神經已壞掉，需要抽神經。請問醫生：1.神經是否壞掉多久可以知道？2.我左門牙的疼痛是否會慢慢康復？還是真的是神經壞掉了呢？3.如果會慢慢康復，大慨會需要多久時間？4.如果是神經壞掉需要接受什麼樣的治療？謝謝醫生！", "large": [], "small": [], "tier3": []}, {"no": "3b321107", "user": "Momo", "q": "我有一顆側門牙，九年前做過顯微跟尖手術，手術後就做了假牙。但其實一直隱約都感覺手去碰它壓會感覺到酸酸的悶悶的不到很痛，結果昨天晚上，突然這顆牙連著著玻璃纖維釘一起掉出來。今天早上立馬跑去醫院看診醫生說我需要植牙這，這顆沒救了，他沒有排x光看只有肉眼判斷。1.難道這樣子的情況真的只能植牙嗎？2.我從2/23昨天晚上八點就假牙掉出來了，如果這樣我都沒有回去處理牙齒這樣子會不會有感染的風險？我預計2/28去再換一家看診，這樣子會不會隔太久了？", "large": [], "small": [], "tier3": []}, {"no": "5182fd75", "user": "阿尼", "q": "請問用不鏽鋼的牙釘會不會容易造成牙根斷裂，這種牙釘會不會還有什麼可怕的副作用?還有他的大概壽命是多少?", "large": [], "small": [], "tier3": []}, {"no": "b758cf93", "user": "Momo", "q": "=====續問========續問===1.我今天是找台中榮總贗復牙科看診，醫生直接說要拔掉植牙。因為醫生態度專業讓我不是很信任，所以所以想說如果等五天後，找原本幫我做根尖手術的牙髓科陳錦醫師幫我看診不知道合適嗎？因為我想能不能可以再次根管再重新做假牙，希望保留真牙。2.若如果不適合還是是否我應該去榮總什麼科看診較適合？3.目前牙齒是沒有痛，不曉得這樣等五天是否太冒險，怕細菌跑進去。牙齒移位4.還是說現在這個情況有辦法裝臨時牙嗎？因為今天在贗復牙科說沒有辦法裝，弄得我好緊張，好怕這樣子都沒有用臨時牙，不知道可以等多久處理不會有發生風險", "large": [], "small": [], "tier3": []}, {"no": "87669cc9", "user": "Vivien", "q": "請問林醫師：我做人工植牙多顆已經五個月了，還沒裝正式假牙，因臉上有長扁平疣想打雷射去除，請問這樣會影響植體或牙齦嗎？", "large": [], "small": [], "tier3": []}, {"no": "5052c070", "user": "Kiki", "q": "側門牙做過根管治療也做過跟尖切除手術，然後有使用假牙套上，可是昨天吃肉粽突然假牙跟牙釘都掉下來了，當下我有先去附近診所看診，兩家診所都跟我說要拔掉，看電腦斷層有殘存牙根在裡面，認為牙齒沒救。連結：https://lurl.cc/zAFEg1.但我想給平常治療的醫生，因為太突然發生，現在預約需要排到14天後才能看診，想請問這樣子等待天數是否有牙根感染的風險？我雖然我沒有感覺現在也不會痛。3.或者能建議我應該醫院看診哪科別？是植牙門診還是牙髓病科或贗復牙科？因為我希望這一顆牙齒看有沒有機會，可以挽救不要植牙，可以重新根管套假牙的機會。", "large": [], "small": [], "tier3": []}, {"no": "a805e608", "user": "Bella", "q": "吳醫師您好，１）想詢問醫師對於皮膚雷射治療的建議臉上從去年夏天戴口罩後陸續出現扁平膚色的小突起，後來眼下也出現了一顆較大膚色有彈性的突起。看了兩間家裡附近的診所，一間只是說沒什麼，並且太小無法治療，另一間則是說是粟粒腫，後來到了台北新光醫院，醫生說不是粟粒腫也不是扁平疣並開酸類的藥膏擦了快要半年左右，但基本上都沒有消除。所以前陣子換了台北馬偕醫院的皮膚科看診。這次是被診斷為軟性纖維瘤。由於醫師表示手術會留疤，自費雷射比較不會。所以目前已雷射處理作為優先考慮。馬偕看診及諮詢時整體氣氛感覺急躁，後來剛好馬偕的醫生有其他皮膚症狀沒有幫我開要處理所以回到了說我臉上突起物太小無法處理的診所看診，由於此次是給不同醫生看，所以我又詢問了一次臉上突起物的狀況。而這位醫師並無表示病兆名稱，只表示可以凍燒（瘤疤），也可以自費雷射。結束看診後由護理師幫忙諮詢雷射的部分，但護理師不斷說我這些可能是扁平疣，然後有幾個看起來是包覆的很緊的粉刺，可能之後還是會擴散等等的。並且表示雷射將由診所院長操作，也就是一開始說我這些無法雷射的那位醫師。因為有點感覺怎麼都是護理師個人在做各種判斷，於是我就與護理師確認了一下雷射當天院長是不會再進行諮詢確認是否臉上的突起都適合二氧化碳雷射的治療。結果護理師表示當天就是跟護理師確認要打雷射的地方，然後直接繳費後開始治療。以目前這兩個地方，診所確實價格比較便宜。但也擔心皮膚科兼醫美診所會不會雷射不打乾淨讓你多來幾次的狀況因此在這裡想諮詢醫生的建議，如果要以上敘述的雷射治療，會建議在診所還是醫院進行？或是說會建議改到醫學美容中心或整形外科看診？２）本身這兩年開始出現毛孔角化症。看到網路上都說是從青少年開始發，長大後逐漸好轉，但我卻是30幾歲後才開始發。想請問醫師，這有什麼可能的原因嗎？因治療紅斑性狼瘡長期服用類固醇是否有影響？3)本來似乎就因為紅斑性狼瘡掉髮量比發病前明顯，但去年突然有增加的趨勢。想請問醫師是否有方法可以確認掉髮原因為何？另外血紅素常常指數介於8.5-11左右是否會影響頭髮生長或造成掉髮？謝謝您！", "large": [], "small": [], "tier3": []}, {"no": "677a3426", "user": "林先生", "q": "醫師您好，我在今年1/8第一次嘴唇上長小區域的唇皰疹(第1個禮拜有抹安特斯乳膏)，到2/3時，病灶的地方已長得和原來的嘴唇皮膚相近，但仍有緊緊、悶悶跟麻的感覺，2/4時我手忍不住去稍微撐開那邊的皮膚，造成不適感增加。請問是否好的了?如何去保養恢復?", "large": [], "small": [], "tier3": []}, {"no": "a6bee91b", "user": "小龍", "q": "醫生您好，於陰毛處有一紅腫處觸摸有小硬塊，需以指甲壓才會痛，如圖（密碼1234，已看過醫生被告知是毛囊炎，經擦藥後已有好轉，但仍有硬塊，請問醫生正常毛囊炎的硬塊大概會持續多久，又或者這會是其他病症嗎，謝謝！https://imgus.cc/Pq2aahttps://imgus.cc/lDBvxhttps://imgus.cc/wVAB1該圖已吃過抗生素以及擦藥", "large": [], "small": [], "tier3": []}, {"no": "a7c8513f", "user": "皓呆", "q": "這是幫我媽問的他實在有點難拖去看醫生，如題腳水泡破掉了我昨天先拿我自己之前用的褐黴素幫她擦應該可以吧？有用生理食鹽水先清洗傷口過，還有紗布稍微包一下還是用優本藥膏比較好呢同時間又發現他腳灰指甲有點嚴重實在有點怕合併感染之類的我姐說我媽還有股癬我應該還是要把她拖去皮膚科一起處理看比較好吧唉包好的紗布又給我拿去碰到水…", "large": [], "small": [], "tier3": []}, {"no": "b17485c3", "user": "Tim", "q": "醫師您好，昨天去看皮膚科後醫生說我這是得了脂漏性皮膚炎，發生部位是在腳背，之前洗澡時洗太燙導致現在皮膚乾燥、發炎了（一片紅）、癢還起了紅疹，有開外敷的類固醇軟膏，但醫生說要先擦讓皮膚滋潤的再擦醫生給的想請問：1.有推薦的嗎？各大醫美藥局有賣的（例如要含什麼成分對皮膚好又不刺激的）單純凡士林可以嗎？我是敏感肌2.是不是要選不含香精、香料、酒精、樟腦和薄荷成分的最好？3.這兩款我適合嗎？CeraVe保濕乳霜、理膚保水B5+全面修復霜4.一次擦太多或擦太多次類固醇藥膏會怎樣？5.這症狀會好嗎？", "large": [], "small": [], "tier3": []}, {"no": "a8d574d1", "user": "小龍", "q": "吳醫師您好，我是#215404的小龍不好意思再請教您上篇照片的狀況是毛囊炎會出現的症狀嗎", "large": [], "small": [], "tier3": []}, {"no": "24f9fcdc", "user": "凌小姐", "q": "醫師您好，我大概一年半前右邊臉頰長了一顆痘痘，我有去擠它摳它，痘痘恢復後變成顏色介於淺咖啡色和深咖啡色的圓形痣，肉眼看沒有突起，手觸摸會有微凸感（不仔細摸的話摸不出來）。另外臉部其他地方也有類似狀況的小痣（有拿照片對比過，是痘痘後才出現的）。近四個月有塗抹A醇保養品也無消除跡象。請教醫生這是什麼狀況？該如何消除？感謝醫生百忙中回覆！", "large": [], "small": [], "tier3": []}, {"no": "f6c897fc", "user": "黃", "q": "最近發覺頭皮兩處按壓到會疼痛疼痛感類似像按壓到瘀青的地方有時候撥頭髮牽引到也會痛有嘗試用手機拍照有一點紅但也不太明顯沒有頭皮屑問題想問是否是脂溢性皮炎？是否需要就醫？圖片網址如下https://lurl.cc/M7ffv", "large": [], "small": [], "tier3": []}, {"no": "c38820d7", "user": "楊小姐", "q": "昨日到家裡附近的皮膚科診所確診為水痘，晚上癢到受不了，醫師只有開口服的艾萊沒有開止癢藥，目前家裡手邊有一條強力施美藥膏請問可以使用嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "81c9a11b", "user": "SAI", "q": "醫生您好，我的右邊陰囊下方內側長了一顆凸起物，四天前還只是指尖大小而已所以不在意，過兩天變得有大姆指大小頂端表面是白色開始有點在意了，但位置實在不好查看，所以塗蘆薈凝露再觀察看看，再隔一天開始嚴重畏寒，發燒，但並未有其他感冒的症狀，臥病在床一整天，吃點家裡常備的科學中藥，想等燒稍微退了些在來看醫生，隔天燒勉強退了，但還是有點頭暈，該上班還是得上班，那個凸起物變的有兩個拇指大小了，今天下班後洗澡發現那兩個拇指大小的凸起物破掉化膿了，明天休假打算來去看醫生，請問我應該要看皮膚科還是泌尿科？我很難不懷疑我發燒跟患處沒關係", "large": [], "small": [], "tier3": []}, {"no": "d6e7b938", "user": "可可", "q": "請問醫師，良性的痣也有可能是突起的嗎？因為我小腿有一顆突痣，皮膚科醫生用皮膚鏡看是說沒問題，可是我沒和醫師提這顆痣是突的，請問ABCDE中的突起指的是「突然」突起，而不是指突起的痣就是惡性的嗎？謝謝", "large": [], "small": [], "tier3": []}, {"no": "9a0deb10", "user": "小優", "q": "連續擦了兩天蒂膚麗擦完都會搭配舒特膚乳液但第二天塗完乳液產生明顯刺痛感隨後就是臉部發紅於是我趕緊把臉上的乳液洗掉擦了b5修護霜睡覺起來臉有比較好但還是紅過了一天也是一樣可是似乎變嚴重除了泛紅還出現一顆一顆很像被蚊子叮的包會癢又不像痘痘。之前擦完雅若整個臉大發炎與現在有些類似但更嚴重皮膚科醫生開給我的類固醇藥物：1.Mometasone2.FUTUSOA請問我目前可以擦哪一個藥物緩解症狀？還是兩個都可以擦？臉的照片：https://lurl.cc/zoGrR", "large": [], "small": [], "tier3": []}, {"no": "615690b2", "user": "小姐", "q": "1.請問粉瘤可以擦美康藥膏消炎嗎?2.請問如何改善長粉瘤?例如沐浴乳或者飲食呢3.因為要去開刀切除(位於頭部)，請問有需要避免什麼嗎，或者洗澡方面如何預防進水謝謝醫生。", "large": [], "small": [], "tier3": []}, {"no": "e8778a98", "user": "C", "q": "醫師您好，約兩周前發現自己頭髮有兩處一大一小一個大於50元硬幣，一個大約5元硬幣大小的圓禿，求診皮膚科後開藥(敏撲寧)早晚擦，但由於該科醫師沒有驗血，所以我又掛號免疫風濕科，經抽血檢查後說有風濕指數稍微高的狀況，所以我這是免疫系統出問題嗎？免疫風濕科醫師開了奎寧給我吃，但我又很怕奎寧的副作用(因為說要吃半年)網路爬文很多人經擦藥後就有改善是否這種情形比較多為壓力導致？而我這是否為真的已經是疾病所以才必須要吃藥？如果是擦藥+吃藥大概多久會改善呢？", "large": [], "small": [], "tier3": []}, {"no": "21360789", "user": "阿飛", "q": "最近洗澡發現龜頭有類似老人斑，0.15*0.3公分，無任何不適。請問有問題嗎？", "large": [], "small": [], "tier3": []}, {"no": "f07bf9ec", "user": "Kris", "q": "吳醫師您好:想請教您，腋下皮膚究竟該如何清潔較好呢?用沐浴乳直接塗抹怕洗後太過乾燥，但只用清水洗腋下又覺得不夠乾淨，也沒去掉角質。又，能夠用去角質的洗面乳來清潔腋下嗎?實在不知所措，還請吳醫師指導正確的腋下清潔方式，又能不傷害腋下的皮膚，感謝您。", "large": [], "small": [], "tier3": []}, {"no": "e7d47044", "user": "凱", "q": "腳底長了紅色的點，很像起疹子那樣原來只有1顆，突然變3顆之前也有長過，醫師是說病毒疣冷凍就好了現在又漲了請問病毒疣是會復發嗎？除了冷凍還可以怎麼治療？擦藥不行嗎請問什麼原因造成的？有可能是浴室潮濕嗎？平時也沒有赤腳走路請問這個一直復發會癌化嗎？這算性病的一種嗎？", "large": [], "small": [], "tier3": []}, {"no": "98a60e2e", "user": "匿名", "q": "前幾天坐著太久，好像卡到牛仔褲鈕扣，彎腰或按肚臍就會有點點痛，但我想說可能是那天瘀青後來今天回家發現肚臍周圍有組織液乾掉的塊狀物，不知道這是否需要去看醫生？(已使用棉花棒沾酒精清理，清出很多髒東西)", "large": [], "small": [], "tier3": []}, {"no": "b9566b8b", "user": "小成", "q": "我這陣子上完廁所擦屁股得時候摸到屁股接近肛門那邊有一個小腫塊之前是都不會痛也不會癢就沒管他但這幾天又去動到他他就像其他痘痘還沒成熟前動到他那樣會發炎變大我想問一下如果想要解決這個要像以前痘痘去皮膚科就診還是要找其他科別會比較好畢竟這次位置比較特殊接近肛門不像其他的是在屁股表面", "large": [], "small": [], "tier3": []}, {"no": "92a561f2", "user": "Ann", "q": "吳醫師您好，之前已有詢問您雷射治療的建議。這次有些問題想再詢問釐清。臉上有許多扁平膚色的小突起，看了許多間診所及醫院，有的說是粟粒腫，大醫院說是軟性纖維瘤，但治療方法有兩間都是說用二氧化碳雷射。但上週又去了一間皮膚科，醫師說看起來像是疣之類的東西，表示臉上凸起物無害，只有美觀上的問題而已。然後他提供的醫美諮詢是電燒。在此想問一下吳醫師，1.臉部皮贅，疣這類的狀況用二氧化碳雷射跟電燒的效果，復原程度及留疤程度和可能性？2.有沒有比較建議要用二氧化碳雷射還是電燒呢？3.我今年35歲，皮贅從去年才有明顯的生長。諮詢的其中一位醫師說是年紀到了，所以開始長。看網路上許多資訊是說與體質或是肥胖有關係。我有紅斑醒狼瘡，長期服用類固醇並且有腎病症候群，想詢問這樣的情況是否有可能導致皮贅容易生長呢（和肥胖同一個原因）？4.SkinTag跟疣是否為相同的東西？謝謝！", "large": [], "small": [], "tier3": []}, {"no": "ac519819", "user": "lee", "q": "請問太常用除毛膏除毛會影響皮膚嗎", "large": [], "small": [], "tier3": []}, {"no": "6f0b4005", "user": "小欣", "q": "醫師您好，我對gentamicin、氧化鋅及蘆薈過敏，還有疤膚力軟膏及灼膚星藥膏也會過敏，所以現在找不到燙傷藥膏可以使用。想請問像貝他每松軟膏這樣的外用類固醇藥膏，可以代替燙傷藥膏使用嗎？非常感謝！", "large": [], "small": [], "tier3": []}, {"no": "a4e8af1a", "user": "林小姐", "q": "因為早期發現硬皮症，治療穩定後，目前醫師是開必賴克廔給我吃，每天早晚各一顆，後來發現手肘關節會變黑，醫師表示是藥物的副作用無大礙。但真的黑的非常明顯，有點困擾，都會被誤會沾到髒東西。想請問李醫師這種藥物引起的色素沉澱，有可能靠擦美白的保養品改善嗎?或是可以怎麼改善呢?謝謝~", "large": [], "small": [], "tier3": []}, {"no": "863eabc4", "user": "Ting", "q": "請問：112/5右眼白內障開刀，112/11開始點舒腫KELAC0.5%眼藥水，已經點了一年多了，請問這藥水需要長期使用嗎？（右眼有輕微黃斑部病變）\r煩請撥冗解惑，感恩！", "large": [], "small": [], "tier3": []}, {"no": "581840f6", "user": "俄", "q": "1近視本身對眼睛有害嗎2近視本身對眼睛有負擔嗎", "large": [], "small": [], "tier3": []}, {"no": "5be7df90", "user": "L", "q": "醫生你好，大概在一週前我發現自己的眼睛視力變得有些模糊（也只有模糊而已），眼睛也變得有點敏感（但剛起床的時候視力是正常的，之後一段時間才開始模糊），考慮到有用電腦手機的習慣，請問醫生這是因為過度使用3C而引發的乾眼症嗎？是的話要怎麼自己處理呢？", "large": [], "small": [], "tier3": []}, {"no": "5ea96d78", "user": "阿明", "q": "請問醫生我看紅綠燈的時候綠燈時從遠處看會有兩個疊影近看時就不會紅燈跟黃燈卻不會夜晚更明顯請問這樣必須就醫嗎謝謝您", "large": [], "small": [], "tier3": []}, {"no": "a2699066", "user": "阿漢", "q": "在暗處時（有時亮處也會）轉動眼球會有閃光，但過一陣子就不會有了，這個跟玻璃體和視網膜拉扯有關嗎？", "large": [], "small": [], "tier3": []}, {"no": "afdda9fd", "user": "alex", "q": "醫生您好，本人飛蚊症大概有4年了，飛蚊數量也滿多的，兩眼都各有大概有數十個，我知道飛蚊症分為生理性、退化性和病理性，那因為我看網路上說退化性飛蚊通常都只有數個，病理性飛蚊通常就是有數十個至數百個飛蚊稱為病理性的，但因為我都有定期檢查，上次檢查是在上個月，醫生都說視網膜正常，所以這樣是屬於退化性飛蚊嗎，所以退化性或病理性是以數量決定的，還是以醫生檢差為主，現在才24歲，很怕30歲就瞎了。", "large": [], "small": [], "tier3": []}, {"no": "c6c267d6", "user": "鵝", "q": "1追求眼睛有看的很遠的能力(沒有矯正或治療）是可以的嗎？", "large": [], "small": [], "tier3": []}, {"no": "d5a1edc9", "user": "匿名", "q": "如有細微鐵粉跑到眼球或眼角膜是否會有強烈異物感?(今日自己用剪刀剪鬍子用完才擔心剪刀受損過是否會因角度不平衡摩擦跑出鐵粉問題)如果現在沒異物感視力也正常是否就不用擔心?", "large": [], "small": [], "tier3": []}, {"no": "e42fd9c0", "user": "林", "q": "高主任您好這次想向您詢問因為我在戶外工作或散步戴眼鏡的時候有時候會感覺眼睛上方黑黑像頭髮的感覺我左右眼都有測試我有嘗試撥動它會隨著動在室內反而看不到這個現象想詢問我這是看到眼睫毛嗎2.我現在只要眨眼睛左邊眉毛就會有類似抽動的感覺請問主任這是疲勞的關係嗎", "large": [], "small": [], "tier3": []}, {"no": "fa83e249", "user": "子", "q": "1追求眼睛有看的很遠的能力(沒用矯正或治療)是可以的嗎？2不要追求眼睛有看的太遠的能力，眼睛有看的很遠的能力對眼睛有負擔這樣說法正確嗎？", "large": [], "small": [], "tier3": []}, {"no": "3433005f", "user": "路人甲", "q": "醫師您好，想請教您：上個月到A診所量眼壓，測出兩眼23、25，於是A醫生開了降眼壓藥給我，我正常點了一個月，然而我今天複診時，眼壓仍然是23、25，於是我今天馬上跑去B診所看診(間隔不到一小時)，途中沒有點任何眼藥水，結果在B診所量出來的眼壓是19、20，測量值差距很大，怎麼會這樣？今天的A診所開給我了跟上個月一樣的眼藥水(是艾弗目)，而B診所則說我要換藥，開給我了Abbive廠牌的降眼壓藥，想請問一下我該點哪款藥水？還有一星期回診一次測眼壓會不會太頻繁？至於我兩個月前在A診所照過Disc，A醫生說沒有問題，而B醫生則診斷了雙眼巨大乳頭結膜炎(我偷看醫生電腦上的文字，不太懂這是什麼)。", "large": [], "small": [], "tier3": []}, {"no": "9a5b94ab", "user": "兒", "q": "1追求眼睛有看的很遠的能力(沒有用矯正或治療)是可以的嗎？2不要追求眼睛有看的太遠的能力，眼睛有看得很遠的能力對眼睛有負擔這樣說法正確嗎？", "large": [], "small": [], "tier3": []}, {"no": "d32d4312", "user": "匿名", "q": "醫生您好我前天去眼科做了一次基本的健檢醫生用了測眼壓的機器然後用登看視神經檢查結果完說，右眼的杯盤比跟眼壓高了一點建議去醫院做一下眼底檢查，其他沒什麼問題我隔天就直接預約了另一間眼科也要先做基本的眼壓近視之類的然後醫生也是用登幫我看視神經說看起來還好欸沒怎樣，說幫我用儀器拍一下視神經你比較安心拍完醫生說杯盤比看起來還好不大有異常的話畫面應該是紅字，我當時看都是黑字就，叫我繼續點眼藥水然後半年回診一次請問醫生兩間眼科檢查結果不一樣一個有用儀器拍視神經一個用肉眼幫我看的請問我該再去找第三間看嗎還是就相信儀器拍下來的結果", "large": [], "small": [], "tier3": []}, {"no": "deb771a2", "user": "183", "q": "眼睛看東西時，除了網路上搜尋得到的飛蚊症種類，還有一種是像透明果凍狀的物體飄來飄去，體面積比一般的飛蚊症都來得大，某些特定角度飄過去時眼睛變得無法對焦，那塊區域完全模糊，其他沒有被遮擋到的地方視線是正常的，請問那也是飛蚊症的一種嗎？本人高度近視", "large": [], "small": [], "tier3": []}, {"no": "8df77d0b", "user": "困惑眼小白", "q": "高醫師您好，上次提問#214414，最近終於解決。由於找眼鏡找了5年多，過程像無頭蒼蠅一樣，眼科、眼鏡行、眼睛以外的疾病亂問亂試卻無解；此次配眼鏡前，詢問我斜視科醫師配鏡需要注意的地方或是這些問題可能在哪裡(如#214414的資訊)，也只說「配一般眼鏡就好」，只指說不用稜鏡。也就是我5年來一直配的「一般眼鏡」……在這裡想提供一些後續發展，期望能給類似情況的人一點訊息……也希望醫師能夠大致理解這種鏡片確實有幫助，找出可能是什麼原理。———今年1月中，換了這款鏡片：https://www.rodenstock.com.tw/bigvisionforall/B.I.G.系列的Exact剛戴兩天時，視覺有點像看廣角鏡、水平線有點弧度，再適應幾天就正常了。且5年來戴眼鏡會「眼睛脹痛」的問題也消失，雖不像一些品牌來得清晰銳利、對比度高，戴久卻不會累。目前已經試了3個禮拜，沒有問題Q_Q———最後的最後，還是要感謝高醫師的耐心傾聽回答，#214414的回答很有幫助，幫助理解驗光時重要的是什麼，以及無解無助時的一些支持，感謝Q_Q", "large": [], "small": [], "tier3": []}, {"no": "b5a6e9e7", "user": "額頭", "q": "請問高醫師：1不要追求眼睛有看的太遠的能力，眼睛有看得很遠的能力對眼睛有負擔這樣說法正確嗎？(請用是否正確回答）2追求眼睛有看的很遠的能力(沒用不當方式)是可以的嗎", "large": [], "small": [], "tier3": []}, {"no": "cb73cc8e", "user": "請", "q": "請問高醫師：1追求眼睛有看的很遠的能力(沒用不當方式)是可以的嗎2不要追求眼睛有看的很遠的能力眼睛有看得很遠的能力對眼睛有負擔這樣說法正確嗎？3眼睛本身有可以看的很遠的能力是可以的嗎？", "large": [], "small": [], "tier3": []}, {"no": "1af35677", "user": "陳", "q": "醫生好！去年下半年，我感覺眼睛酸痛近視加深，感覺看東西的距離感怪怪的，先後看了附近的眼科診所跟市立醫院眼科門診，兩位醫師皆為我測量了眼壓跟視力，點散瞳之後用裂隙燈看眼底，都表示結果正常。請問（1這樣就能確定眼睛沒問題了嗎？（2請問作為高度近視患者該定期做什麼檢查，我一直很擔心自己會得青光眼或視網膜剝離，不知道是不是心理作用，看了青光眼科普文章後就覺得視野靠近鼻樑側有黑影……", "large": [], "small": [], "tier3": []}, {"no": "5a97570e", "user": "王先生", "q": "想請問醫師：#三個問題有些不同1不要追求眼睛有看的太遠的能力眼睛有看得很遠的能力對眼睛有負擔這樣說法正確嗎？2不要追求眼睛有看的太遠的能力，眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎？3不要追求眼睛有看的太遠的能力，眼睛有看得很遠的能力對眼睛有負擔這樣說法正確嗎？", "large": [], "small": [], "tier3": []}, {"no": "64760c6a", "user": "王先生", "q": "想請問醫師：#前三個問題有些不同1不要追求眼睛有看的太遠的能力眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎？2不要追求眼睛有看的很遠的能力眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎?3不要追求眼睛有看的很遠的能力，眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎?4追求眼睛有看的太遠的能力(沒用不當方式)是可以的嗎？5眼睛本身擁有看得太遠的能力是可以的嗎？", "large": [], "small": [], "tier3": []}, {"no": "a10e2692", "user": "婷", "q": "高醫生您好有幾個問題想詢問今天有摸附近的家貓（別人把貓咪放在家門口有繩子綁住）因為這隻貓會咬人，後來回家也先洗手跟有沖洗被咬的地方（沒有用洗手的清潔液）之後有塗抹欣黴素藥膏，之後用手機有用到被咬的地方碰到眼睛（類似用手抹過眼睛，因為有聞到藥味）想問被咬的地方，碰到眼睛，這樣眼睛會受到什麼感染嗎？之前咳嗽，會閉眼睛，眼睛部分會有一些白光，想問這是正常的嗎？（閉上眼睛是黑黑的，咳嗽會有部分，感覺有白光，但不是每次咳嗽都有之前有一陣子再用手機打字都會打錯數字例如要打081365打成801365，或是有時候會打到下面的按鍵y按到h，想請問我眼睛這樣是正常的嗎？因為以前幾乎沒這個情況，之前常常發生還有正常眼睛會有血絲是正常的嗎？洗完澡感覺眼白感覺比較清晰比較沒血絲，但之後眼白部分看起來比較混濁這是正常的嗎？謝謝高醫生", "large": [], "small": [], "tier3": []}, {"no": "cf27e331", "user": "李子安", "q": "請問醫師#23有些不同1眼睛擁有看的太遠的能力會對眼睛有負擔嗎？2不要追求眼睛有看的很遠的能力(沒有用不當方式)這樣說法正確嗎？3不要追求眼睛有看的太遠的能力(沒有用不當方式)這樣說法正確嗎？", "large": [], "small": [], "tier3": []}, {"no": "d02382e7", "user": "高三生", "q": "醫師您好，剛剛我在咳嗽後，突然眼前出現很多光點在飄（類似平常看藍天或白色背景下會出現的，但明顯比平常大顆），約略過了30秒後逐漸消失。我本來就有飛蚊症，但去過兩次醫院做散瞳檢查醫生都說視網膜沒有問題。因此我想請問這是正常的嗎？P.S.我發現左眼往上方看時，會出現像指紋的網狀黑影，請問那是甚麼呢", "large": [], "small": [], "tier3": []}, {"no": "d6f5aef1", "user": "匿名", "q": "醫生您好，我之前去做過三次眼底檢查，兩間診所一間大醫院檢查都說視網膜沒問題但以近視350度來說，視網膜蠻薄的診所建議我預防性雷射大醫院說先不必，定期回診觀察就好大醫院檢查完一個禮拜，我蹲下起立後，突然看見眼前有放射狀一條一條的白光/閃光但由於工作忙碌，加上一週前才做過檢查而並沒有再一次去做眼底檢查這幾天都提心吊膽看見眼鏡上的反光以為是閃光希望醫生能給我要不要去預防性雷射的建議，也很怕手術出錯和後遺症，真的很煩惱", "large": [], "small": [], "tier3": []}, {"no": "f7c53f0a", "user": "G", "q": "半年前眼角膜受傷(昆蟲飛進、揉眼睛造成)，發現恢復長得不好，因此有剝掉重長，搭配治療型隱形眼鏡、血清、睡前點淚膜等治療方式，但這半年期間內還是反覆角膜破皮進出醫院。農曆年前因狀況又復發、連續三天都清晨痛醒、嚴重影響視力，因此有請醫生開治療型隱形眼鏡戴2週多，回診恢復狀況良好，在上週二摘掉。摘掉的第一、二天，眼睛狀況都不錯，白天有持續點血清保養，晚上點淚膜很舒服也睡得很好。但第三天開始，白天眼睛漸漸變很乾澀，血清或人工淚液點一點下去就馬上乾，要拼命補，後來實在是不行了，就白天也點淚膜搭配血清、人工淚液，才有比較滋潤一些。整天很乾時，晚上點淚膜會感覺很稠，在眼睛上不舒服感，因此，都搭配打呵欠分泌一些淚液跟淚膜混和才去睡覺。今日清晨5點多眼睛痛醒，以為是角膜又破皮了，因為視力有模糊，因此上午去門診看醫生，但透過裂隙燈看是沒有異狀，用儀器測量、視力檢查，發現是散光從75變成150，醫生是說角膜還沒定型，所以暫時會這樣。但我上網找不到相關資訊，想詢問您1.既然都點淚膜了，為何睡覺還會痛醒(通常是在白天眼睛比較乾的狀況發生)，並且這次沒有破皮，反而角膜變形導致散光，我睡覺都有戴護目鏡及口罩保護，並且正躺不會亂動，2.角膜變形代表我睡覺乾眼的力道去扯到角膜嗎？煩請醫師解答，謝謝您！", "large": [], "small": [], "tier3": []}, {"no": "1c1b269e", "user": "王小姐", "q": "您好：最近雙眼上方開始有異物感（感覺像要長針眼，好幾天了也都沒長），自己先以人工淚液滋潤及休養後無舒緩，已就醫。醫生說看起來沒東西，可能是有點過敏或結膜炎，開藥讓我點點看有沒有改善。這次忘記跟醫生說我有乾眼症，以前聽醫生說乾眼症不能亂點藥水，尤其有收斂效果的。想確認這次開的藥我可以照常使用，還是須回診換藥呢？*藥品明細1.Alminto2.FoxoneOphthalmic3.Fusone這次剛好看完眼科隔天確診流感，有可能耳鼻喉發炎腫脹讓眼睛有異物感，或分泌物較多這種狀況嗎？（已退燒24小時，異物感還在）謝謝您的協助！", "large": [], "small": [], "tier3": []}, {"no": "ea5a07d6", "user": "施能達", "q": "想請問醫師：#前三個問題有些不同1不要追求眼睛有看的太遠的能力眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎？2不要追求眼睛有看的很遠的能力眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎？3不要追求眼睛有看的很遠的能力，眼睛有看得太遠的能力對眼睛有負擔這樣說法正確嗎？4追求眼睛有看的太遠的能力是可以的嗎(沒有用不當方式)？5眼睛本身有看的太遠的能力是可以的嗎？", "large": [], "small": [], "tier3": []}, {"no": "1bd7fe72", "user": "王先生", "q": "想請問醫師：#1到4有些不同m5到6有些不同7到8有些不同1不要追求眼睛可以看的太遠眼睛可以看得很遠對眼睛有負擔這樣說法正確嗎？2不要追求眼睛可以看的太遠，眼睛可以看得很遠對眼睛有負擔這樣說法正確嗎？3不要追求眼睛可以看的很遠，眼睛可以看得太 生我該去買那種遮蔽膠帶或是測量視力的那種來遮蓋眼睛進行訓練嗎？因為右眼較不好，每次都是用手遮蔽進行15分鐘訓練，但訓練完拿下手左眼都要需要一段時間才能看清楚因為我蓋太久，相對的就要花更多時間等他恢復才能進行左眼訓練。也想問醫生這樣訓練真的會好起來嗎？感覺兩年已經過了好久，前半年去看醫生也只是被回覆到除了運動沒什麼方法，檢查飛蚊也是沒有變嚴重然後很快就又出診療間了..，或是還有什麼方法可以訓練呢？先謝謝醫生解答和聽我的症狀。", "large": [], "small": [], "tier3": []}, {"no": "c5b8eb2d", "user": "Hsiao", "q": "今天不小心被東西砸到眼睛眼睛出現一個黑點不會移動大約是十元大小請問是瘀血還是有可能是視網膜剝離呢因為人在泰國沒辦法馬上回台灣看醫生謝謝", "large": [], "small": [], "tier3": []}, {"no": "fe757e97", "user": "陳", "q": "醫師您好我目前在國外出差工作，左右眼近視250散光50、150，去年11月發現有飛蚊，上個月1/13有到醫院做眼底散瞳檢查跟OCT，醫生說看起來正常，OCT數值也在範圍內，應該是玻璃體退化，有交代說如果有閃光或飛蚊增加就要注意，因當時病人太多沒特別問閃光的類型，想請問1.白天上班時常發生眼前或上方會有燈光閃爍或是變暗一下又恢復的感覺，尤其是集中看電腦、報告時，有時當下看上方燈管的確有閃爍的現象，有時又沒有，閉眼好像沒有這種狀況發生，且常常眼睛一動就沒有這狀況了，無法確認是哪一眼，跟查資料的多是眼睛移動或閉眼也會出現似乎不同?2.最近幾天發現剛睡醒閉眼時有時眼尾也會有類似閃光劃過的感覺，也有幾次是在快睡著前有類似閃電出現在眼前的感覺，大多閃一下就沒了，其他時間目前沒注意到有類似的狀況以上狀況都是最近查完資料才去注意的，因預約下次檢查是四月了，否要緊急找醫生再檢查一次?", "large": [], "small": [], "tier3": []}, {"no": "2a7f143a", "user": "陳", "q": "醫師好,請問：吃口服A酸會導致長針眼嗎？", "large": [], "small": [], "tier3": []}, {"no": "465cb6e4", "user": "ken", "q": "主任你好本人因左眼視力模糊，檢查了很多項目都查不出病因，最後建議我只能自費做基因檢測。想請問主任若是基因檢測有問題能治療嗎？治療費用會不會很高?健保有給付嗎?基因檢測自費要3萬多，因本人經濟條件有限，目前還在考慮中。謝謝！", "large": [], "small": [], "tier3": []}, {"no": "69899161", "user": "匿名", "q": "去年11月右眼白內障手術後有乾眼症，術後視力檢查越來越模糊，上星期回診發現角膜破皮，這星期發現看物體變小了。請問是角膜破皮造成的嗎，還是有其他原因導致？角膜破皮的情況下是否可以去醫院進行其他的眼部檢查？", "large": [], "small": [], "tier3": []}, {"no": "994d37c7", "user": "啊哈", "q": "醫生，請問有時候才會出現早期症狀的要去看醫生嗎？我昨天晚上閉上眼睛後突然頭很暈&痛而且有看到虹光&邊邊視野模糊去年暑假也有發生過一次請問是在暗處玩太多手機導致的嗎？而且最近眼睛都會乾乾的目前雙眼視力都是1.0，很怕得青光眼", "large": [], "small": [], "tier3": []}, {"no": "c5cfff48", "user": "M", "q": "人工水晶體脫位(掉進玻璃體內)後，醫生將執行玻璃體切除術+人工水聽體縫合術，不須灌氣體與矽油想請問:玻璃體切除後，這麼大的空腔沒有了玻璃體存在，會有\"人工玻璃體\"或其他物質填充嗎", "large": [], "small": [], "tier3": []}, {"no": "1e601cf1", "user": "呀哈", "q": "請問一下，這兩天晚上都有發生頭痛+頭暈+看到光斑過了大概半小時才好然後今天後腦勺抬頭的時候會痛請問是什麼原因上網查是說眼睛偏頭痛請問如何緩解", "large": [], "small": [], "tier3": []}, {"no": "457a278b", "user": "李子安", "q": "1不要追求眼睛看很遠方(沒有使用不當方式)正確嗎2不要追求眼睛看太遠方(沒有使用不當方式)正確嗎3追求眼睛看很遠方(沒有使用不當方式)可以嗎4追求眼睛看太遠方(沒有使用不當方式
